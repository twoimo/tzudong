name: Closure
run-name: Closure · ${{ inputs.mode || 'validate' }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact protected main commit SHA
        required: true
        type: string
      mode:
        description: Controller mode; validate is source-only and default.
        required: true
        default: validate
        type: choice
        options: [validate, preflight, readback, runtime-probe, reconciliation-readback]

permissions:
  contents: read

concurrency:
  group: g037-hosted-closure
  cancel-in-progress: false

jobs:
  source-validation:
    if: github.repository == 'twoimo/tzudong' && github.ref == 'refs/heads/main' && github.sha == inputs.commit_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact detached protected main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify detached SHA binding
        shell: bash
        env: {EXPECTED_SHA: '${{ inputs.commit_sha }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = ""
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with: {python-version: '3.12.8'}
      - name: Validate controller source without credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -- "$RUNNER_TEMP/g037-receipts"
          python backend/supabase/scripts/g037_hosted_closure_executor.py validate > "$RUNNER_TEMP/g037-receipts/validate-${GITHUB_SHA}.json"
      - name: Upload sanitized source-validation receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # actions/upload-artifact@v4
        with:
          name: g037-hosted-closure-validate-${{ github.sha }}
          path: ${{ runner.temp }}/g037-receipts/validate-${{ github.sha }}.json
          if-no-files-found: error

  remote-readonly:
    needs: source-validation
    if: >-
      github.repository == 'twoimo/tzudong' && github.ref == 'refs/heads/main' && github.sha == inputs.commit_sha
      && (inputs.mode == 'preflight' || inputs.mode == 'readback' || inputs.mode == 'runtime-probe' || inputs.mode == 'reconciliation-readback')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify detached SHA binding
        shell: bash
        env: {EXPECTED_SHA: '${{ inputs.commit_sha }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = ""
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with: {python-version: '3.12.8'}
      - name: Install hash-locked controller dependencies
        shell: bash
        run: 'python -m pip install --require-hashes --only-binary=:all: -r backend/supabase/scripts/g037-hosted-closure-requirements.txt'
      - name: Run protected read-only controller
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SUPABASE_G037_READONLY_DB_URL: ${{ secrets.SUPABASE_G037_READONLY_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -- "$RUNNER_TEMP/g037-receipts"
          timeout --signal=TERM --kill-after=5s 120s python backend/supabase/scripts/g037_hosted_closure_executor.py "$REQUESTED_MODE" --db-env SUPABASE_G037_READONLY_DB_URL > "$RUNNER_TEMP/g037-receipts/${REQUESTED_MODE}-${GITHUB_SHA}.json"
      - name: Upload sanitized hosted receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # actions/upload-artifact@v4
        with:
          name: g037-hosted-closure-${{ inputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/g037-receipts/${{ inputs.mode }}-${{ github.sha }}.json
          if-no-files-found: error
      - name: Remove sanitized temporary receipt
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/g037-receipts/${{ inputs.mode }}-${GITHUB_SHA}.json"
