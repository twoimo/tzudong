name: YouTube KPI Snapshot

on:
  schedule:
    # 15분 간격. 정각 혼잡을 피해 7/22/37/52분에 실행합니다. (UTC 기준)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: youtube-kpi-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CHANNEL_HANDLE: ${{ secrets.YOUTUBE_CHANNEL_HANDLE }}
      YOUTUBE_KPI_SNAPSHOT_INTERVAL_MINUTES: "15"
      YOUTUBE_KPI_SNAPSHOT_MAX_PLAYLIST_PAGES: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Capture YouTube KPI snapshot
        run: node scripts/capture-youtube-kpi-snapshot.mjs
