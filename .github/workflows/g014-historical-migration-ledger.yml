name: Ledger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.10'

      - name: Run migration-ledger unit tests
        run: python -m unittest backend.supabase.tests.test_read_hosted_migration_ledger

      - name: Read hosted migration ledger
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/supabase/scripts/read_hosted_migration_ledger.py --output artifacts/hosted-migration-ledger.json

      - name: Validate sanitized artifact
        run: python backend/supabase/scripts/read_hosted_migration_ledger.py --validate-artifact artifacts/hosted-migration-ledger.json

      - name: Upload migration-ledger artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # actions/upload-artifact@v4
        with:
          name: hosted-migration-ledger
          path: artifacts/hosted-migration-ledger.json
          if-no-files-found: error
          retention-days: 14
