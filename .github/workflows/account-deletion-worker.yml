name: Account Deletion

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: account-deletion-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.ref_name == github.event.repository.default_branch
      && vars.G037_WRITE_FREEZE != 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Dispatch bounded account deletion work
        env:
          ACCOUNT_DELETION_WORKER_URL: ${{ secrets.ACCOUNT_DELETION_WORKER_URL }}
          ACCOUNT_DELETION_WORKER_CAPABILITY: ${{ secrets.ACCOUNT_DELETION_WORKER_CAPABILITY }}
        run: node scripts/run-account-deletion-worker.mjs --limit 10 --deadline-ms 10000
