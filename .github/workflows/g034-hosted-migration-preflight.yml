name: G034 hosted migration preflight

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to preflight
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'twoimo/tzudong' && github.ref == 'refs/heads/main' && github.sha == inputs.commit_sha
    runs-on: ubuntu-24.04
    environment: production-database
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Install hash-locked database client
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all:
          -r backend/supabase/scripts/g034-preflight-requirements.txt
      - name: Focused source tests
        run: python -m unittest backend.supabase.tests.test_preflight_g034_hosted_migration_closure
      - name: Validate bound source closure
        run: python backend/supabase/scripts/preflight_g034_hosted_migration_closure.py --validate-only --artifact g034-hosted-preflight.json
      - name: Run bounded read-only catalog retirement preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backend/supabase/scripts/preflight_g034_hosted_migration_closure.py --artifact g034-hosted-preflight.json
      - name: Upload sanitized bounded preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g034-hosted-preflight-${{ github.sha }}
          path: g034-hosted-preflight.json
          if-no-files-found: error
