name: Daily Data Collection

on:
  schedule:
    # 한국 시간(KST) 새벽 4시 = UTC 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      max_videos:
        description: '자막 문맥 생성 개수 설정 (0=Unlimited, -1=Skip)'
        required: false
        default: '-1'
        type: string
      policy_mode:
        description: 'run_daily 정책 모드 (기본: end_to_end)'
        required: false
        default: 'end_to_end'
        type: string
      verify_optional_scenario:
        description: '검증 전용 optional 시나리오 (예: missing_youtube, missing_supabase_migration, missing_supabase_insert)'
        required: false
        default: ''
        type: string
      verify_required_scenario:
        description: '검증 전용 required 시나리오 (예: step08_quota)'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: '보안상 secrets 사용 실행은 default branch만 허용됩니다 (비default ref는 거부)'
        required: false
        default: ''
        type: string
      allow_budget_risk:
        description: 'Actions budget posture가 critical이어도 default-branch 수동 실행 허용'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# GitHub Actions Node 20 deprecation 사전 대응: JS actions를 Node 24 런타임으로 강제
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GEMINI_CLI_TRUST_WORKSPACE: "false"

# [SECURITY/PERF] production secrets/data sync runs are serialized on one trusted default-branch lane.
concurrency:
  group: daily-crawl-pipeline
  cancel-in-progress: false

jobs:
  daily-crawl:
    runs-on: ubuntu-latest
    # [PERF] 안전 타임아웃: 최대 90분 (월 3000분 한도 보호)
    timeout-minutes: 90
    env:
      MAX_CONTEXT_VIDEOS: ${{ github.event.inputs.max_videos || '-1' }}
    steps:
      # ============================================================
      # 환경 준비 (Setup) - 캐시 최대 활용으로 시간 절약
      # ============================================================

      - name: Guard trusted manual checkout ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_CHECKOUT_REF: ${{ github.event.inputs.checkout_ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$REQUESTED_CHECKOUT_REF" ] && [ "$REQUESTED_CHECKOUT_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::daily-crawler uses production secrets and may only run against the default branch. Use read-only PR/CI validation for non-default refs."
            exit 1
          fi

      - name: System Setup (Disk + Swap)
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          # [PERF] 디스크 정리를 백그라운드에서 실행 (스왑 생성과 병렬)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          
          # 스왑 생성 (정리와 병렬 진행 - 서로 다른 경로)
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 백그라운드 정리 완료 대기
          wait
          echo "[OK] System setup complete (Swap 8GB)"
          free -h

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Guard manual default-branch budget posture
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_BUDGET_RISK: ${{ github.event.inputs.allow_budget_risk || 'false' }}
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_actions_budget.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow daily-crawler.yml \
            --workflow gdrive-frame-backfill.yml \
            --output backend/log/cron/actions-budget-posture.json
          python3 - <<'PY'
          import json, os, sys
          with open('backend/log/cron/actions-budget-posture.json', encoding='utf-8') as fh:
              report = json.load(fh)
          soft_gate = report.get('softGate')
          allow = str(os.environ.get('ALLOW_BUDGET_RISK', '')).lower() == 'true'
          checkout_ref = os.environ.get('CHECKOUT_REF') or os.environ.get('DEFAULT_BRANCH')
          default_branch = os.environ.get('DEFAULT_BRANCH')
          if soft_gate == 'critical' and checkout_ref == default_branch and not allow:
              print('Budget posture is critical; refusing default-branch workflow_dispatch without allow_budget_risk=true.')
              print(json.dumps({
                  'softGate': soft_gate,
                  'estimatedMonthlyPrivateEquivalentMinutes': report.get('estimatedMonthlyPrivateEquivalentMinutes'),
                  'manualRunCount': report.get('manualRunCount'),
                  'backfillEstimatedMinutes': report.get('backfillEstimatedMinutes'),
              }, ensure_ascii=False, sort_keys=True))
              sys.exit(1)
          PY

      - name: Install System Dependencies (ffmpeg, jq, rclone)
        timeout-minutes: 12
        run: |
          set -euo pipefail

          missing_packages=()
          command -v ffmpeg >/dev/null 2>&1 || missing_packages+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing_packages+=(jq)
          command -v rclone >/dev/null 2>&1 || missing_packages+=(rclone)
          command -v secret-tool >/dev/null 2>&1 || missing_packages+=(libsecret-tools)
          command -v gnome-keyring-daemon >/dev/null 2>&1 || missing_packages+=(gnome-keyring)
          command -v dbus-launch >/dev/null 2>&1 || missing_packages+=(dbus-x11)

          if [ ${#missing_packages[@]} -eq 0 ]; then
            echo "[OK] System dependencies already available"
            ffmpeg -version | head -1 || true
            jq --version || true
            rclone version | head -1 || true
            exit 0
          fi

          APT_OPTIONS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
            -o Dpkg::Use-Pty=0
          )

          retry_with_timeout() {
            local description="$1"
            local time_limit="$2"
            shift 2

            local attempt
            for attempt in 1 2; do
              echo "[INFO] ${description} (attempt ${attempt}/2)"
              if timeout "$time_limit" "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 2 ]; then
                echo "[ERROR] ${description} failed after ${attempt} attempts"
                return 1
              fi

              echo "[WARN] ${description} failed; retrying once..."
            done
          }

          retry_with_timeout "apt-get update" 2m sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTIONS[@]}" update -qq
          retry_with_timeout "apt-get install ${missing_packages[*]}" 4m sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTIONS[@]}" install -y -qq --no-install-recommends "${missing_packages[@]}"

          command -v ffmpeg >/dev/null 2>&1
          command -v jq >/dev/null 2>&1
          command -v rclone >/dev/null 2>&1
          command -v secret-tool >/dev/null 2>&1
          command -v gnome-keyring-daemon >/dev/null 2>&1
          command -v dbus-launch >/dev/null 2>&1

          echo "[OK] Installed missing packages: ${missing_packages[*]}"
          ffmpeg -version | head -1 || true
          jq --version || true
          rclone version | head -1 || true

      # ============================================================
      # 의존성 설치 (Dependencies) - 캐시 활용 극대화
      # ============================================================

      - name: Cache Puppeteer Browser
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-


      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/restaurant-crawling/scripts/requirements.txt

      # [SECURITY/PERF] Python + Node 의존성 병렬 설치 (requirements.txt 고정 버전만 사용)
      - name: Install Dependencies (Python + Node.js)
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer
        run: |
          # Python: pip upgrade + pinned requirements (백그라운드)
          (python -m pip install --upgrade pip -q && \
           pip install --requirement backend/restaurant-crawling/scripts/requirements.txt -q && \
           python -m camoufox fetch) &
          PY_PID=$!
          
          # Node.js + OAuth CLI 의존성 (병렬)
          (cd backend && npm ci --prefer-offline && npm install -g @google/gemini-cli && \
           curl -fsSL https://antigravity.google/cli/install.sh | bash) &
          NPM_PID=$!
          
          # 모든 설치 완료 대기
          wait $PY_PID $NPM_PID
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "[OK] All dependencies installed"
          command -v gemini >/dev/null 2>&1 && gemini --version || true
          "$HOME/.local/bin/agy" --help | head -20 || true

      # ============================================================
      # 자격 증명 설정 (Credentials) - 병렬 생성
      # ============================================================

      - name: Setup Credentials
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
          AGY_SETTINGS_JSON: ${{ secrets.AGY_SETTINGS_JSON }}
          AGY_CREDENTIAL_B64: ${{ secrets.AGY_CREDENTIAL_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backend/restaurant-crawling/data ~/.gemini ~/.gemini/antigravity-cli ~/.config/rclone
          
          # Add wrapper to PATH
          echo "${{ github.workspace }}/backend/bin" >> "$GITHUB_PATH"
          chmod +x "${{ github.workspace }}/backend/bin/gemini"
          
          # Google Credentials (optional; kept only for legacy scripts that read credentials.json)
          if [ -n "$GOOGLE_CREDENTIALS_BASE64" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS_BASE64" | base64 -d > backend/restaurant-crawling/data/credentials.json
          fi
          
          # YouTube Cookies
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            printf '%s' "$YOUTUBE_COOKIES_TXT" > backend/restaurant-crawling/data/cookies.txt
          fi
          
          # Gemini CLI OAuth accounts (optional): backend/bin/gemini rotates oauth_creds_*.json on quota.
          if [ -n "$GEMINI_CREDENTIALS_BASE64" ]; then
            printf '%s' "$GEMINI_CREDENTIALS_BASE64" | base64 -d > ~/.gemini/oauth_creds.json
            chmod 600 ~/.gemini/oauth_creds.json
          fi
          if [ -n "$GEMINI_CREDENTIALS_BASE64_2" ]; then
            printf '%s' "$GEMINI_CREDENTIALS_BASE64_2" | base64 -d > ~/.gemini/oauth_creds_2.json
            chmod 600 ~/.gemini/oauth_creds_2.json
          fi
          if [ -f ~/.gemini/oauth_creds.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path.home() / ".gemini" / "settings.json"
          try:
              data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          except json.JSONDecodeError:
              data = {}
          data.setdefault("security", {}).setdefault("auth", {})["selectedType"] = "oauth-personal"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            chmod 600 ~/.gemini/settings.json
          fi

          start_secret_service() {
            if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
              eval "$(dbus-launch --sh-syntax)"
            fi
            export DBUS_SESSION_BUS_ADDRESS
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
            if [ -n "${DBUS_SESSION_BUS_PID:-}" ]; then
              export DBUS_SESSION_BUS_PID
              echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
            fi

            # Create/unlock an empty-password CI keyring and keep the daemon alive for later steps.
            eval "$(printf '\n' | gnome-keyring-daemon --unlock 2>/dev/null || true)"
            eval "$(gnome-keyring-daemon --start --components=secrets 2>/dev/null || true)"
            if [ -n "${GNOME_KEYRING_CONTROL:-}" ]; then
              export GNOME_KEYRING_CONTROL
              echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
            fi
            if [ -n "${SSH_AUTH_SOCK:-}" ]; then
              export SSH_AUTH_SOCK
              echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            fi
          }

          # Antigravity CLI stores auth in the OS keyring; settings.json controls the selected model.
          if [ -n "$AGY_SETTINGS_JSON" ]; then
            printf '%s' "$AGY_SETTINGS_JSON" > ~/.gemini/antigravity-cli/settings.json
          elif [ ! -f ~/.gemini/antigravity-cli/settings.json ]; then
            printf '%s\n' '{"model":"Gemini 3.5 Flash (High)","enableTelemetry":false}' > ~/.gemini/antigravity-cli/settings.json
          fi
          chmod 600 ~/.gemini/antigravity-cli/settings.json

          if [ -n "${AGY_CREDENTIAL_B64:-}" ]; then
            start_secret_service
            agy_credential_file=$(mktemp)
            trap 'rm -f "$agy_credential_file"' EXIT
            printf '%s' "$AGY_CREDENTIAL_B64" | base64 -d > "$agy_credential_file"
            secret-tool store --label="Antigravity OAuth token" service gemini username antigravity < "$agy_credential_file"
            if secret-tool lookup service gemini username antigravity >/dev/null; then
              echo "[OK] Antigravity OAuth credential restored to Secret Service"
            else
              echo "::error::Antigravity OAuth credential could not be read back from Secret Service"
              exit 1
            fi
          else
            echo "[WARN] AGY_CREDENTIAL_B64 is not set; Antigravity CLI may prompt for OAuth in CI."
          fi
          
          # RClone Config
          if [ -n "$GDRIVE_RCLONE_CONFIG" ]; then
            printf '%s' "$GDRIVE_RCLONE_CONFIG" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          fi
          
          echo "[OK] All credentials configured"

      - name: Validate runtime environment contract
        env:
          YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
          NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
          NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
          NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          OPENAI_API_KEY_BYEON: ${{ secrets.OPENAI_API_KEY_BYEON }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
          AGY_SETTINGS_JSON: ${{ secrets.AGY_SETTINGS_JSON }}
          AGY_CREDENTIAL_B64: ${{ secrets.AGY_CREDENTIAL_B64 }}
        run: python3 backend/bin/check_env_contract.py --profile daily

      - name: Preflight Gemini/Antigravity AI quota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
        run: |
          mkdir -p backend/log/cron

          print_preflight_excerpt() {
            local label="$1"
            local file_path="$2"
            if [ ! -s "$file_path" ]; then
              return 0
            fi
            echo "::group::$label"
            sed -E 's/(access_token|refresh_token|id_token|code)=([^&[:space:]]+)/\1=[redacted]/g' "$file_path" | sed -n '1,80p'
            echo "::endgroup::"
          }

          ensure_gemini_cli_oauth_settings() {
            if [ ! -f "$HOME/.gemini/oauth_creds.json" ]; then
              return 1
            fi
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path.home() / ".gemini" / "settings.json"
          try:
              data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          except json.JSONDecodeError:
              data = {}
          data.setdefault("security", {}).setdefault("auth", {})["selectedType"] = "oauth-personal"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            chmod 600 "$HOME/.gemini/settings.json"
          }

          set +e
          node backend/bin/check_gemini_runtime.mjs \
            --output backend/log/cron/gemini-runtime-preflight.json \
            --require-api-available
          API_STATUS=$?
          set -e

          OAUTH_STATUS=1
          AGY_STATUS=0
          GEMINI_CLI_STATUS=0
          if [ "$API_STATUS" -ne 0 ]; then
            echo "[WARN] Gemini API preflight exited $API_STATUS; checking Antigravity CLI OAuth fallback."
            set +e
            python3 backend/bin/run_agy_prompt.py \
              --prompt-text "Reply with only: ok" \
              --output backend/log/cron/agy-runtime-preflight.txt \
              --stderr-file backend/log/cron/agy-runtime-preflight.err \
              --print-timeout 45s \
              --timeout-sec 75
            AGY_STATUS=$?
            set -e

            if [ "$AGY_STATUS" -eq 0 ]; then
              OAUTH_STATUS=0
            else
              echo "[WARN] Antigravity CLI preflight exited $AGY_STATUS; checking Gemini CLI OAuth fallback."
              print_preflight_excerpt "Antigravity CLI preflight stdout" backend/log/cron/agy-runtime-preflight.txt
              print_preflight_excerpt "Antigravity CLI preflight stderr" backend/log/cron/agy-runtime-preflight.err

              if command -v gemini >/dev/null 2>&1 && ensure_gemini_cli_oauth_settings; then
                set +e
                env GEMINI_API_KEY= timeout --foreground 75s gemini --skip-trust -p "Reply with only: ok" --model gemini-3-flash-preview --output-format json < /dev/null \
                  > backend/log/cron/gemini-cli-runtime-preflight.json \
                  2> backend/log/cron/gemini-cli-runtime-preflight.err
                GEMINI_CLI_STATUS=$?
                set -e
                if [ "$GEMINI_CLI_STATUS" -eq 0 ]; then
                  OAUTH_STATUS=0
                else
                  echo "[WARN] Gemini CLI OAuth preflight exited $GEMINI_CLI_STATUS."
                  print_preflight_excerpt "Gemini CLI OAuth preflight stdout" backend/log/cron/gemini-cli-runtime-preflight.json
                  print_preflight_excerpt "Gemini CLI OAuth preflight stderr" backend/log/cron/gemini-cli-runtime-preflight.err
                fi
              else
                GEMINI_CLI_STATUS=127
                echo "[WARN] Gemini CLI OAuth credentials/settings are unavailable."
              fi
            fi
          fi

          {
            echo "### Gemini/Antigravity runtime preflight"
            echo
            echo "API status: $API_STATUS"
            echo "Antigravity CLI status: $AGY_STATUS"
            echo "Gemini CLI OAuth status: $GEMINI_CLI_STATUS"
            echo "OAuth fallback status: $OAUTH_STATUS"
            echo
            echo '```json'
            if [ -s backend/log/cron/gemini-runtime-preflight.json ]; then
              cat backend/log/cron/gemini-runtime-preflight.json
            else
              echo '{"error":"gemini-runtime-preflight.json missing"}'
            fi
            echo '```'
            if [ -s backend/log/cron/agy-runtime-preflight.txt ]; then
              echo
              echo "Antigravity CLI stdout:"
              sed -n '1,20p' backend/log/cron/agy-runtime-preflight.txt
            fi
            if [ -s backend/log/cron/agy-runtime-preflight.err ]; then
              echo
              echo "Antigravity CLI stderr:"
              sed -n '1,20p' backend/log/cron/agy-runtime-preflight.err
            fi
            if [ -s backend/log/cron/gemini-cli-runtime-preflight.err ]; then
              echo
              echo "Gemini CLI OAuth stderr:"
              sed -n '1,40p' backend/log/cron/gemini-cli-runtime-preflight.err
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$API_STATUS" -ne 0 ] && [ "$OAUTH_STATUS" -ne 0 ]; then
            echo "::error::Gemini API and OAuth CLI fallbacks are unavailable (api=$API_STATUS agy=$AGY_STATUS gemini_cli=$GEMINI_CLI_STATUS)."
            exit "$API_STATUS"
          fi

      - name: Check production contract fixture drift
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_production_contract_fixtures.py \
            --output backend/log/cron/production-contract-fixture-status.json \
            --max-records 200

      # ============================================================
      # Ollama 설정 (AI Model) - 조건부 실행
      # ============================================================

      - name: Cache Ollama Models
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: |
            ~/.ollama
            /usr/share/ollama/.ollama
          key: ${{ runner.os }}-ollama-models-v3
          restore-keys: |
            ${{ runner.os }}-ollama-models-

      - name: Setup Ollama
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        env:
          OLLAMA_INSTALL_VERSION: v0.24.0
          OLLAMA_INSTALL_SHA256: 25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/ollama-install.sh "https://github.com/ollama/ollama/releases/download/${OLLAMA_INSTALL_VERSION}/install.sh"
          echo "${OLLAMA_INSTALL_SHA256}  /tmp/ollama-install.sh" | sha256sum -c -
          sh /tmp/ollama-install.sh
          # [Fix] 캐시 복원 시 모델 디렉토리 권한 보정 (ollama 사용자에게 소유권 이전)
          if [ -d /usr/share/ollama/.ollama ]; then
            sudo chown -R ollama:ollama /usr/share/ollama/.ollama 2>/dev/null || true
          fi
          echo "[OK] Ollama installed"

      - name: Start Ollama & Pull Model
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          ollama serve &
          
          # Ollama 준비 대기 (최적화된 폴링)
          for i in $(seq 1 15); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "[OK] Ollama ready (${i}s)"
              break
            fi
            [ $i -eq 15 ] && { echo "[ERROR] Ollama timeout"; exit 1; }
            sleep 1
          done
          
          # 모델 Pull (캐시 히트 시 즉시 완료)
          ollama pull cookieshake/a.x-4.0-light-imatrix:Q8_0

      # ============================================================
      # 파이프라인 실행 (Main Pipeline)
      # ============================================================

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily Pipeline
        timeout-minutes: 80
        env:
          # API Keys
          YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
          GITHUB_TOKEN: ${{ github.token }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Naver & NCP API
          NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
          NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
          NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
          NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
          # RClone / GDrive
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_REMOTE_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/video_cache"
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          # Ollama
          OLLAMA_HOST: http://localhost:11434
          # CI
          CI: true
          RUN_DAILY_POLICY_MODE: ${{ github.event.inputs.policy_mode || 'end_to_end' }}
          RUN_DAILY_VERIFY_OPTIONAL_SCENARIO: ${{ github.event.inputs.verify_optional_scenario || '' }}
          RUN_DAILY_VERIFY_REQUIRED_SCENARIO: ${{ github.event.inputs.verify_required_scenario || '' }}
          RUN_DAILY_EXECUTION_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_DAILY_TARGET_BRANCH: data
        run: |
          chmod +x backend/run_daily.sh
          bash backend/run_daily.sh
          
      # ============================================================
      # 후처리 (Post-processing) - 항상 실행
      # ============================================================

      - name: Add Job Summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f backend/log/cron/admin-data-quality-audit.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat backend/log/cron/admin-data-quality-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write Actions budget posture ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_actions_budget.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow daily-crawler.yml \
            --workflow gdrive-frame-backfill.yml \
            --output backend/log/cron/actions-budget-posture.json || true
          {
            echo "### GitHub Actions budget posture"
            echo
            echo "\`\`\`json"
            cat backend/log/cron/actions-budget-posture.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Upload Results to GDrive
        if: always()
        continue-on-error: true
        # 대량 프레임은 batch 업로드 + strong remote proof + staging/backfill material을 남긴다.
        timeout-minutes: 45
        env:
          RUN_DAILY_TARGET_BRANCH: data
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          GDRIVE_STATUS_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/status"
          GDRIVE_UPLOAD_MAX_FILES: "0"
          GDRIVE_UPLOAD_BATCH_FILES: "400"
          GDRIVE_UPLOAD_BATCH_BYTES: "402653184"
          GDRIVE_UPLOAD_BATCH_TIMEOUT: "6m"
          GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS: "2280"
          GDRIVE_UPLOAD_MIN_REMAINING_SECONDS: "420"
          GDRIVE_UPLOAD_SHARD_FILES: "1000"
          GDRIVE_UPLOAD_SHARD_BYTES: "536870912"
        run: |
          set -euo pipefail
          FRAMES_DIR="backend/restaurant-crawling/data/frames"
          UPLOAD_LOG_DIR="backend/log/cron"
          SUMMARY_MANIFEST="$UPLOAD_LOG_DIR/current-summary.json"
          EXPECTED_MANIFEST="$UPLOAD_LOG_DIR/current-upload-expected.json"
          BATCH_MANIFEST="$UPLOAD_LOG_DIR/current-upload-batches.json"
          UPLOAD_STATUS="$UPLOAD_LOG_DIR/current-upload-status.json"
          RESIDUAL_QUEUE="$UPLOAD_LOG_DIR/gdrive-upload-residual-queue.jsonl"
          FILES_FROM="$UPLOAD_LOG_DIR/current-upload-files-from.txt"
          BATCH_DIR="$UPLOAD_LOG_DIR/gdrive-upload-batches"
          VERIFIED_FILES="$UPLOAD_LOG_DIR/current-upload-verified-files.txt"
          STAGING_DIR="$UPLOAD_LOG_DIR/gdrive-upload-staging"
          STAGING_MANIFEST="$UPLOAD_LOG_DIR/current-upload-staging-manifest.json"
          RCLONE_LOG="$UPLOAD_LOG_DIR/current-upload-rclone.log"
          mkdir -p "$UPLOAD_LOG_DIR" "$BATCH_DIR" "$STAGING_DIR"
          : > "$VERIFIED_FILES"
          : > "$RCLONE_LOG"
          STATUS_SCOPE="main"
          if [ "${RUN_DAILY_TARGET_BRANCH:-data}" != "data" ]; then
            STATUS_SCOPE="$(printf '%s' "${RUN_DAILY_TARGET_BRANCH:-validation}" | tr '/ :' '---')"
          fi
          GDRIVE_STATUS_SCOPE_PATH="${GDRIVE_STATUS_PATH%/}/$STATUS_SCOPE"
          GDRIVE_STAGING_SCOPE_PATH="$GDRIVE_STATUS_SCOPE_PATH/staging/run-${GITHUB_RUN_ID:-local}"
          echo "GDrive status scope path: $GDRIVE_STATUS_SCOPE_PATH"

          if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
            if rclone copyto "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" "$RESIDUAL_QUEUE" --stats 0 2>/dev/null; then
              echo "Restored previous GDrive residual queue from $GDRIVE_STATUS_SCOPE_PATH."
            else
              echo "No previous GDrive residual queue restored; starting from local state."
            fi
          fi

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-expected \
            --frames-dir "$FRAMES_DIR" \
            --output "$EXPECTED_MANIFEST" \
            --files-from-output "$FILES_FROM" \
            --residual-queue "$RESIDUAL_QUEUE" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --recent-minutes 120 \
            --retention-days 7 \
            --max-items "${GDRIVE_UPLOAD_MAX_FILES:-0}"

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-batches \
            --expected-manifest "$EXPECTED_MANIFEST" \
            --output "$BATCH_MANIFEST" \
            --output-dir "$BATCH_DIR" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --max-files "${GDRIVE_UPLOAD_BATCH_FILES:-400}" \
            --max-bytes "${GDRIVE_UPLOAD_BATCH_BYTES:-402653184}"

          EXPECTED_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("expectedCount", 0))' "$EXPECTED_MANIFEST")
          OVERFLOW_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("overflowCount", 0))' "$EXPECTED_MANIFEST")
          UPLOADABLE_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("uploadableCount", 0))' "$EXPECTED_MANIFEST")
          BATCH_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("batchCount", 0))' "$BATCH_MANIFEST")
          UPLOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          write_upload_status() {
            local exit_code="$1"
            local timed_out="$2"
            local skipped="$3"
            local proof="$4"
            local note="$5"
            python3 backend/utils/run_daily_helpers.py write-gdrive-upload-status \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$UPLOAD_STATUS" \
              --summary-manifest "$SUMMARY_MANIFEST" \
              --residual-queue "$RESIDUAL_QUEUE" \
              --verified-files-from "$VERIFIED_FILES" \
              --staging-manifest "$STAGING_MANIFEST" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --policy warn \
              --upload-mode direct_batch \
              --completion-proof "$proof" \
              --source-root "$FRAMES_DIR" \
              --remote-root "$GDRIVE_FRAMES_PATH" \
              --started-at "$UPLOAD_STARTED_AT" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "$exit_code" \
              --timeout "$timed_out" \
              --skipped "$skipped" \
              --backfill-threshold-attempts 3 \
              --note "$note"
          }

          persist_upload_artifacts() {
            if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
              rclone copyto "$RESIDUAL_QUEUE" "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" --stats 0 || true
              rclone copyto "$UPLOAD_STATUS" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-status.json" --stats 0 || true
              rclone copyto "$EXPECTED_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-expected.json" --stats 0 || true
              rclone copyto "$BATCH_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-batches.json" --stats 0 || true
              if [ -s "$STAGING_MANIFEST" ]; then
                rclone copyto "$STAGING_MANIFEST" "$GDRIVE_STAGING_SCOPE_PATH/current-upload-staging-manifest.json" --stats 0 || true
              fi
            fi
          }

          if [ "$EXPECTED_COUNT" -eq 0 ]; then
            echo "No expected frame files detected, skipping GDrive upload."
            write_upload_status 0 false true none "no expected frame files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$UPLOADABLE_COUNT" -eq 0 ]; then
            echo "Expected frame backlog has no local uploadable files; preserving residual state for backfill/operator action."
            write_upload_status 0 false true none "expected backlog has no local uploadable files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$OVERFLOW_COUNT" -gt 0 ]; then
            echo "Upload manifest capped at $EXPECTED_COUNT expected frame files (overflow queued: $OVERFLOW_COUNT)."
          fi

          echo "Uploading $UPLOADABLE_COUNT local frame files across $BATCH_COUNT batches to GDrive..."
          UPLOAD_EXIT=0
          UPLOAD_TIMED_OUT=false
          COMPLETION_PROOF="none"
          UPLOAD_START_EPOCH=$(date +%s)

          for BATCH_FILE in "$BATCH_DIR"/batch-*.txt; do
            [ -f "$BATCH_FILE" ] || continue
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - UPLOAD_START_EPOCH))
            REMAINING=$((${GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS:-2280} - ELAPSED))
            if [ "$REMAINING" -lt "${GDRIVE_UPLOAD_MIN_REMAINING_SECONDS:-420}" ]; then
              UPLOAD_EXIT=124
              UPLOAD_TIMED_OUT=true
              echo "GDrive upload soft budget nearly exhausted; staging remaining files for backfill."
              break
            fi
            echo "Uploading batch $(basename "$BATCH_FILE")..."
            BATCH_EXIT=0
            (
              cd "$FRAMES_DIR"
              timeout "${GDRIVE_UPLOAD_BATCH_TIMEOUT:-6m}" rclone copy . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --no-traverse --ignore-existing \
                --log-file "../../../../$RCLONE_LOG" \
                --stats 30s --transfers 4 --checkers 4 --tpslimit 4
            ) || BATCH_EXIT=$?
            if [ "$BATCH_EXIT" -ne 0 ]; then
              UPLOAD_EXIT="$BATCH_EXIT"
              if [ "$BATCH_EXIT" -eq 124 ]; then
                UPLOAD_TIMED_OUT=true
              fi
              echo "GDrive batch $(basename "$BATCH_FILE") exited with $BATCH_EXIT; staging remaining files."
              break
            fi
            CHECK_EXIT=0
            (
              cd "$FRAMES_DIR"
              rclone check . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --size-only --one-way --stats 0 \
                --log-file "../../../../$RCLONE_LOG"
            ) || CHECK_EXIT=$?
            if [ "$CHECK_EXIT" -eq 0 ]; then
              cat "$BATCH_FILE" >> "$VERIFIED_FILES"
              COMPLETION_PROOF="remote_size_check"
            else
              echo "Remote proof failed for $(basename "$BATCH_FILE") with exit=$CHECK_EXIT; keeping it in residual verification backlog."
              COMPLETION_PROOF="rclone_exit_zero"
            fi
          done

          VERIFIED_COUNT=$(sort -u "$VERIFIED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERIFIED_COUNT" -lt "$EXPECTED_COUNT" ]; then
            python3 backend/utils/run_daily_helpers.py write-gdrive-staging-shards \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$STAGING_MANIFEST" \
              --output-dir "$STAGING_DIR" \
              --verified-files-from "$VERIFIED_FILES" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --source-root "$FRAMES_DIR" \
              --remote-staging-root "$GDRIVE_STAGING_SCOPE_PATH" \
              --max-files "${GDRIVE_UPLOAD_SHARD_FILES:-1000}" \
              --max-bytes "${GDRIVE_UPLOAD_SHARD_BYTES:-536870912}"
            if find "$STAGING_DIR" -type f | grep -q .; then
              rclone copy "$STAGING_DIR" "$GDRIVE_STAGING_SCOPE_PATH" --stats 30s --transfers 2 --checkers 2 --tpslimit 2 || true
            fi
          else
            echo '{"schemaVersion":2,"shards":[]}' > "$STAGING_MANIFEST"
          fi

          STATUS_NOTE="batch upload exit=$UPLOAD_EXIT; verified=$VERIFIED_COUNT/$EXPECTED_COUNT; proof=$COMPLETION_PROOF"
          if [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            STATUS_NOTE="$STATUS_NOTE; soft timeout"
          fi
          write_upload_status "$UPLOAD_EXIT" "$UPLOAD_TIMED_OUT" false "$COMPLETION_PROOF" "$STATUS_NOTE"
          persist_upload_artifacts

          {
            echo "### GDrive upload status"
            echo
            echo '```json'
            cat "$UPLOAD_STATUS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS_VALUE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "$UPLOAD_STATUS")
          if [ "$STATUS_VALUE" = "backfill_required" ] || [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            exit 0
          fi

          exit "$UPLOAD_EXIT"

      - name: Upload GDrive Status Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: gdrive-upload-status-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/log/cron/current-upload-status.json
            backend/log/cron/production-contract-fixture-status.json
            backend/log/cron/gemini-runtime-preflight.json
            backend/log/cron/agy-runtime-preflight.txt
            backend/log/cron/agy-runtime-preflight.err
            backend/log/cron/gemini-cli-runtime-preflight.json
            backend/log/cron/gemini-cli-runtime-preflight.err
            backend/log/cron/actions-budget-posture.json
            backend/log/cron/admin-data-quality-audit.json
            backend/log/cron/admin-data-quality-audit.md
