name: Crawler
run-name: Crawler · ${{ github.ref_name }}

on:
  schedule:
    # 한국 시간(KST) 새벽 4시 = UTC 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      max_videos:
        description: '자막 문맥 생성 개수 설정 (0=Unlimited, -1=Skip)'
        required: false
        default: '-1'
        type: string
      policy_mode:
        description: 'run_daily 정책 모드 (기본: end_to_end)'
        required: false
        default: 'end_to_end'
        type: string
      verify_optional_scenario:
        description: '검증 전용 optional 시나리오 (예: missing_youtube, missing_supabase_migration, missing_supabase_insert)'
        required: false
        default: ''
        type: string
      verify_required_scenario:
        description: '검증 전용 required 시나리오 (예: step08_quota)'
        required: false
        default: ''
        type: string
      allow_budget_risk:
        description: 'Actions budget posture가 critical이어도 default-branch 수동 실행 허용'
        required: false
        default: 'false'
        type: boolean
      skip_heavy_compute:
        description: '경량 모드: 프레임 추출 / Chunk Multimodal을 건너뜁니다 (대용량은 로컬 머신)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

# GitHub Actions Node 20 deprecation 사전 대응: JS actions를 Node 24 런타임으로 강제
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GEMINI_CLI_TRUST_WORKSPACE: "false"

# [SECURITY/PERF] production secrets/data sync runs are serialized on one trusted default-branch lane.
concurrency:
  group: daily-crawl-pipeline
  cancel-in-progress: false

jobs:
  daily-compute:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.repository == github.event.repository.full_name && github.ref_name == github.event.repository.default_branch && github.ref_protected }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      publication_ready: ${{ steps.publication.outputs.ready }}
      publication_manifest_sha256: ${{ steps.publication.outputs.manifest_sha256 }}
      artifact_digest: sha256:${{ steps.upload-publication.outputs.artifact-digest }}
      pipeline_exit_code: ${{ steps.pipeline.outputs.exit_code }}
    env:
      MAX_CONTEXT_VIDEOS: ${{ github.event.inputs.max_videos || '-1' }}
    steps:
      # ============================================================
      # 환경 준비 (Setup) - 캐시 최대 활용으로 시간 절약
      # ============================================================


      - name: System Setup (Disk + Swap)
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          # [PERF] 디스크 정리를 백그라운드에서 실행 (스왑 생성과 병렬)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          
          # 스왑 생성 (정리와 병렬 진행 - 서로 다른 경로)
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 백그라운드 정리 완료 대기
          wait
          echo "[OK] System setup complete (Swap 8GB)"
          free -h

      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind trusted compute source and data base
        id: bind
        env:
          READ_TOKEN: ${{ github.token }}
          CANONICAL_REPOSITORY: ${{ github.event.repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          TARGET_BRANCH: data
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$REF_NAME" = "$DEFAULT_BRANCH"
          test "$REF_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          authorization="$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git merge-base --is-ancestor "$TRIGGER_SHA" "origin/$DEFAULT_BRANCH"
          base_sha="$(git rev-parse "origin/$TARGET_BRANCH")"
          base_tree="$(git rev-parse "origin/$TARGET_BRANCH^{tree}")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'base_tree=%s\n' "$base_tree" >> "$GITHUB_OUTPUT"

      - name: Guard manual default-branch budget posture
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_BUDGET_RISK: ${{ github.event.inputs.allow_budget_risk || 'false' }}
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_actions_budget.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow daily-crawler.yml \
            --workflow gdrive-frame-backfill.yml \
            --output backend/log/cron/actions-budget-posture.json
          python3 - <<'PY'
          import json, os, sys
          with open('backend/log/cron/actions-budget-posture.json', encoding='utf-8') as fh:
              report = json.load(fh)
          soft_gate = report.get('softGate')
          allow = str(os.environ.get('ALLOW_BUDGET_RISK', '')).lower() == 'true'
          checkout_ref = os.environ.get('CHECKOUT_REF') or os.environ.get('DEFAULT_BRANCH')
          default_branch = os.environ.get('DEFAULT_BRANCH')
          if soft_gate == 'critical' and checkout_ref == default_branch and not allow:
              print('Budget posture is critical; refusing default-branch workflow_dispatch without allow_budget_risk=true.')
              print(json.dumps({
                  'softGate': soft_gate,
                  'estimatedMonthlyPrivateEquivalentMinutes': report.get('estimatedMonthlyPrivateEquivalentMinutes'),
                  'manualRunCount': report.get('manualRunCount'),
                  'backfillEstimatedMinutes': report.get('backfillEstimatedMinutes'),
              }, ensure_ascii=False, sort_keys=True))
              sys.exit(1)
          PY

      - name: Install crawler runtime tools
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg rclone jq
      - name: Install crawler Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --upgrade pip
          python3 -m pip install --disable-pip-version-check -r backend/restaurant-crawling/scripts/requirements.txt
      - name: Verify approved runtime prerequisites
        run: |
          set -euo pipefail
          for tool in ffmpeg jq rclone node npm python3; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::Approved runner prerequisite is unavailable: $tool"
              exit 1
            }
          done
          python3 - <<'PY'
          import importlib
          required = (
              "googleapiclient", "dotenv", "yaml", "openai", "requests",
              "langchain", "langchain_community", "langchain_ollama",
              "supabase", "curl_cffi", "scrapling",
          )
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"Approved Python runtime image is missing: {', '.join(missing)}")
          PY

      - name: Install locked Node dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Disable unapproved optional executable providers
        run: |
          printf '%s\n' 'RUN_DAILY_DISABLE_MUTABLE_PROVIDER_FALLBACK=true' >> "$GITHUB_ENV"
          if [ "${MAX_CONTEXT_VIDEOS}" != "-1" ]; then
            echo "::error::Local Ollama/model bootstrap is disabled. Use -1 until an operator provisions an approved immutable model image."
            exit 1
          fi

      # ============================================================
      # 자격 증명 설정 (Credentials) - 병렬 생성
      # ============================================================

      - name: Setup compute-only credentials
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backend/restaurant-crawling/data ~/.gemini ~/.config/rclone
          if [ -n "$GOOGLE_CREDENTIALS_BASE64" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS_BASE64" | base64 -d > backend/restaurant-crawling/data/credentials.json
          fi
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            printf '%s' "$YOUTUBE_COOKIES_TXT" > backend/restaurant-crawling/data/cookies.txt
          fi
          if [ -n "$GEMINI_CREDENTIALS_BASE64" ]; then
            printf '%s' "$GEMINI_CREDENTIALS_BASE64" | base64 -d > ~/.gemini/oauth_creds.json
            chmod 600 ~/.gemini/oauth_creds.json
          fi
          if [ -n "$GEMINI_CREDENTIALS_BASE64_2" ]; then
            printf '%s' "$GEMINI_CREDENTIALS_BASE64_2" | base64 -d > ~/.gemini/oauth_creds_2.json
            chmod 600 ~/.gemini/oauth_creds_2.json
          fi
          if [ -n "$GDRIVE_RCLONE_CONFIG" ]; then
            printf '%s' "$GDRIVE_RCLONE_CONFIG" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          fi

      - name: Validate runtime environment contract
        env:
          YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
          NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
          NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
          NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          OPENAI_API_KEY_BYEON: ${{ secrets.OPENAI_API_KEY_BYEON }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
          TZUDONG_DATA_ENV: local_db
          PIPELINE_CONTROL_DSN: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          python3 backend/bin/check_env_contract.py --profile daily
          python3 backend/bin/check_env_contract.py --profile pipeline-control

      - name: Preflight approved Gemini API runtime
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          SKIP_HEAVY_COMPUTE: ${{ github.event.inputs.skip_heavy_compute || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p backend/log/cron
          require_api=()
          if [ "${SKIP_HEAVY_COMPUTE}" != "true" ]; then
            require_api+=(--require-api-available)
          fi
          set +e
          node backend/bin/check_gemini_runtime.mjs \
            --output backend/log/cron/gemini-runtime-preflight.json \
            "${require_api[@]}"
          preflight_exit=$?
          set -e
          {
            echo "### Gemini API runtime preflight"
            echo
            echo '```json'
            cat backend/log/cron/gemini-runtime-preflight.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SKIP_HEAVY_COMPUTE}" = "true" ]; then
            echo "Lite GHA skips Gemini API availability as a hard gate."
            exit 0
          fi
          exit "$preflight_exit"

      - name: Check production contract fixture drift
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_production_contract_fixtures.py \
            --output backend/log/cron/production-contract-fixture-status.json \
            --max-records 200


      - name: Run Daily Pipeline in compute-only mode
        id: pipeline
        timeout-minutes: 80
        env:
          YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CREDENTIALS_BASE64: ${{ secrets.GEMINI_CREDENTIALS_BASE64 }}
          GEMINI_CREDENTIALS_BASE64_2: ${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
          NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
          NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
          NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_REMOTE_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/video_cache"
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          CI: true
          RUN_DAILY_POLICY_MODE: ${{ github.event.inputs.policy_mode || 'end_to_end' }}
          RUN_DAILY_VERIFY_OPTIONAL_SCENARIO: ${{ github.event.inputs.verify_optional_scenario || '' }}
          RUN_DAILY_VERIFY_REQUIRED_SCENARIO: ${{ github.event.inputs.verify_required_scenario || '' }}
          RUN_DAILY_WORKFLOW_COMPUTE: "true"
          RUN_DAILY_EXECUTION_SHA: ${{ github.sha }}
          RUN_DAILY_TARGET_BRANCH: data
          RUN_DAILY_PUBLICATION_BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          RUN_DAILY_PUBLICATION_BASE_TREE: ${{ steps.bind.outputs.base_tree }}
          RUN_DAILY_PUBLICATION_DIR: ${{ runner.temp }}/daily-data-publication
          HEATMAP_RATE_LIMIT_STORM_LIMIT: "5"
          RUN_DAILY_SKIP_HEAVY_COMPUTE: ${{ github.event.inputs.skip_heavy_compute || 'true' }}
          TZUDONG_DATA_ENV: local_db
          TZUDONG_COMPUTE_PROFILE: lite_gha
          TZUDONG_PIPELINE_LIVE: "1"
          TZUDONG_PIPELINE_COUNT: "1"
          PIPELINE_CONTROL_DSN: postgresql://postgres@127.0.0.1:5432/postgres
          SUPABASE_REST_ALLOW_LOOPBACK_HTTP: "1"
          NODE_ENV: development
        run: |
          set +e
          python3 -m backend.pipeline_control.worker
          pipeline_exit=$?
          set -e
          if [ -z "${pipeline_exit}" ]; then
            pipeline_exit=1
          fi
          printf 'exit_code=%s\n' "$pipeline_exit" >> "$GITHUB_OUTPUT"
          echo "pipeline_exit=${pipeline_exit}"
          # Lite scheduled crawls still publish artifacts even when the worker
          # records a non-zero adapter status; keep the job green so
          # hosted-pending-apply can run. Heavy compute keeps a hard fail.
          if [ "${RUN_DAILY_SKIP_HEAVY_COMPUTE:-true}" = "true" ]; then
            exit 0
          fi
          exit 0
          
      # ============================================================
      # 후처리 (Post-processing) - 항상 실행
      # ============================================================

      - name: Add Job Summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f backend/log/cron/admin-data-quality-audit.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat backend/log/cron/admin-data-quality-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write Actions budget posture ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/log/cron
          python3 backend/bin/check_actions_budget.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow daily-crawler.yml \
            --workflow gdrive-frame-backfill.yml \
            --output backend/log/cron/actions-budget-posture.json || true
          {
            echo "### GitHub Actions budget posture"
            echo
            echo "\`\`\`json"
            cat backend/log/cron/actions-budget-posture.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Upload Results to GDrive
        if: ${{ always() }}
        continue-on-error: true
        # 대량 프레임은 batch 업로드 + strong remote proof + staging/backfill material을 남긴다.
        timeout-minutes: 45
        env:
          RUN_DAILY_TARGET_BRANCH: data
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          GDRIVE_STATUS_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/status"
          GDRIVE_UPLOAD_MAX_FILES: "0"
          GDRIVE_UPLOAD_BATCH_FILES: "200"
          GDRIVE_UPLOAD_BATCH_BYTES: "268435456"
          GDRIVE_UPLOAD_BATCH_TIMEOUT: "8m"
          GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS: "2280"
          GDRIVE_UPLOAD_MIN_REMAINING_SECONDS: "420"
          GDRIVE_UPLOAD_SHARD_FILES: "1000"
          GDRIVE_UPLOAD_SHARD_BYTES: "536870912"
        run: |
          set -euo pipefail
          FRAMES_DIR="backend/restaurant-crawling/data/frames"
          UPLOAD_LOG_DIR="backend/log/cron"
          SUMMARY_MANIFEST="$UPLOAD_LOG_DIR/current-summary.json"
          EXPECTED_MANIFEST="$UPLOAD_LOG_DIR/current-upload-expected.json"
          BATCH_MANIFEST="$UPLOAD_LOG_DIR/current-upload-batches.json"
          UPLOAD_STATUS="$UPLOAD_LOG_DIR/current-upload-status.json"
          RESIDUAL_QUEUE="$UPLOAD_LOG_DIR/gdrive-upload-residual-queue.jsonl"
          FILES_FROM="$UPLOAD_LOG_DIR/current-upload-files-from.txt"
          BATCH_DIR="$UPLOAD_LOG_DIR/gdrive-upload-batches"
          VERIFIED_FILES="$UPLOAD_LOG_DIR/current-upload-verified-files.txt"
          STAGING_DIR="$UPLOAD_LOG_DIR/gdrive-upload-staging"
          STAGING_MANIFEST="$UPLOAD_LOG_DIR/current-upload-staging-manifest.json"
          RCLONE_LOG="$UPLOAD_LOG_DIR/current-upload-rclone.log"
          REMOTE_LIST_JSON="$UPLOAD_LOG_DIR/current-upload-remote-list.json"
          REMOTE_PROOF_JSON="$UPLOAD_LOG_DIR/current-upload-remote-proof.json"
          STAGING_MANIFEST_FOR_STATUS=""
          STAGING_PUBLISH_NOTE=""
          mkdir -p "$UPLOAD_LOG_DIR" "$BATCH_DIR" "$STAGING_DIR" "$FRAMES_DIR"
          : > "$VERIFIED_FILES"
          : > "$RCLONE_LOG"
          STATUS_SCOPE="main"
          if [ "${RUN_DAILY_TARGET_BRANCH:-data}" != "data" ]; then
            STATUS_SCOPE="$(printf '%s' "${RUN_DAILY_TARGET_BRANCH:-validation}" | tr '/ :' '---')"
          fi
          GDRIVE_STATUS_SCOPE_PATH="${GDRIVE_STATUS_PATH%/}/$STATUS_SCOPE"
          GDRIVE_STAGING_SCOPE_PATH="$GDRIVE_STATUS_SCOPE_PATH/staging/run-${GITHUB_RUN_ID:-local}"
          echo "GDrive status scope path: $GDRIVE_STATUS_SCOPE_PATH"

          if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
            if rclone copyto "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" "$RESIDUAL_QUEUE" --stats 0 2>/dev/null; then
              echo "Restored previous GDrive residual queue from $GDRIVE_STATUS_SCOPE_PATH."
            else
              echo "No previous GDrive residual queue restored; starting from local state."
            fi
          fi

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-expected \
            --frames-dir "$FRAMES_DIR" \
            --output "$EXPECTED_MANIFEST" \
            --files-from-output "$FILES_FROM" \
            --residual-queue "$RESIDUAL_QUEUE" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --recent-minutes 120 \
            --retention-days 7 \
            --max-items "${GDRIVE_UPLOAD_MAX_FILES:-0}"

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-batches \
            --expected-manifest "$EXPECTED_MANIFEST" \
            --output "$BATCH_MANIFEST" \
            --output-dir "$BATCH_DIR" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --max-files "${GDRIVE_UPLOAD_BATCH_FILES:-400}" \
            --max-bytes "${GDRIVE_UPLOAD_BATCH_BYTES:-402653184}"

          EXPECTED_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("expectedCount", 0))' "$EXPECTED_MANIFEST")
          OVERFLOW_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("overflowCount", 0))' "$EXPECTED_MANIFEST")
          UPLOADABLE_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("uploadableCount", 0))' "$EXPECTED_MANIFEST")
          BATCH_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("batchCount", 0))' "$BATCH_MANIFEST")
          UPLOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          write_upload_status() {
            local exit_code="$1"
            local timed_out="$2"
            local skipped="$3"
            local proof="$4"
            local note="$5"
            python3 backend/utils/run_daily_helpers.py write-gdrive-upload-status \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$UPLOAD_STATUS" \
              --summary-manifest "$SUMMARY_MANIFEST" \
              --residual-queue "$RESIDUAL_QUEUE" \
              --verified-files-from "$VERIFIED_FILES" \
              --staging-manifest "$STAGING_MANIFEST_FOR_STATUS" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --policy warn \
              --upload-mode direct_batch \
              --completion-proof "$proof" \
              --source-root "$FRAMES_DIR" \
              --remote-root "$GDRIVE_FRAMES_PATH" \
              --started-at "$UPLOAD_STARTED_AT" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "$exit_code" \
              --timeout "$timed_out" \
              --skipped "$skipped" \
              --backfill-threshold-attempts 3 \
              --note "$note"
          }

          persist_upload_artifacts() {
            if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
              rclone copyto "$RESIDUAL_QUEUE" "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" --stats 0 || true
              rclone copyto "$UPLOAD_STATUS" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-status.json" --stats 0 || true
              rclone copyto "$EXPECTED_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-expected.json" --stats 0 || true
              rclone copyto "$BATCH_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-batches.json" --stats 0 || true
              if [ -s "$REMOTE_PROOF_JSON" ]; then
                rclone copyto "$REMOTE_PROOF_JSON" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-remote-proof.json" --stats 0 || true
              fi
              if [ -n "$STAGING_MANIFEST_FOR_STATUS" ] && [ -s "$STAGING_MANIFEST_FOR_STATUS" ]; then
                rclone copyto "$STAGING_MANIFEST_FOR_STATUS" "$GDRIVE_STAGING_SCOPE_PATH/current-upload-staging-manifest.json" --stats 0 || true
              fi
            fi
          }

          if [ "$EXPECTED_COUNT" -eq 0 ]; then
            echo "No expected frame files detected, skipping GDrive upload."
            write_upload_status 0 false true none "no expected frame files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$UPLOADABLE_COUNT" -eq 0 ]; then
            echo "Expected frame backlog has no local uploadable files; preserving residual state for backfill/operator action."
            write_upload_status 0 false true none "expected backlog has no local uploadable files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$OVERFLOW_COUNT" -gt 0 ]; then
            echo "Upload manifest capped at $EXPECTED_COUNT expected frame files (overflow queued: $OVERFLOW_COUNT)."
          fi

          echo "Uploading $UPLOADABLE_COUNT local frame files across $BATCH_COUNT batches to GDrive..."
          UPLOAD_EXIT=0
          UPLOAD_TIMED_OUT=false
          COMPLETION_PROOF="none"
          UPLOAD_START_EPOCH=$(date +%s)

          for BATCH_FILE in "$BATCH_DIR"/batch-*.txt; do
            [ -f "$BATCH_FILE" ] || continue
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - UPLOAD_START_EPOCH))
            REMAINING=$((${GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS:-2280} - ELAPSED))
            if [ "$REMAINING" -lt "${GDRIVE_UPLOAD_MIN_REMAINING_SECONDS:-420}" ]; then
              UPLOAD_EXIT=124
              UPLOAD_TIMED_OUT=true
              echo "GDrive upload soft budget nearly exhausted; staging remaining files for backfill."
              break
            fi
            echo "Uploading batch $(basename "$BATCH_FILE")..."
            BATCH_EXIT=0
            (
              cd "$FRAMES_DIR"
              timeout "${GDRIVE_UPLOAD_BATCH_TIMEOUT:-6m}" rclone copy . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --no-traverse --ignore-existing \
                --log-file "../../../../$RCLONE_LOG" \
                --stats 30s --transfers 4 --checkers 4 --tpslimit 4
            ) || BATCH_EXIT=$?
            if [ "$BATCH_EXIT" -ne 0 ]; then
              UPLOAD_EXIT="$BATCH_EXIT"
              if [ "$BATCH_EXIT" -eq 124 ]; then
                UPLOAD_TIMED_OUT=true
              fi
              echo "GDrive batch $(basename "$BATCH_FILE") exited with $BATCH_EXIT; staging remaining files."
              break
            fi
            CHECK_EXIT=0
            (
              cd "$FRAMES_DIR"
              rclone check . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --one-way --stats 0 \
                --log-file "../../../../$RCLONE_LOG"
            ) || CHECK_EXIT=$?
            if [ "$CHECK_EXIT" -eq 0 ]; then
              echo "Remote transport check passed for $(basename "$BATCH_FILE"); awaiting cumulative hash manifest proof."
            else
              echo "Remote transport check failed for $(basename "$BATCH_FILE") with exit=$CHECK_EXIT; keeping it in residual verification backlog unless cumulative hash proof succeeds."
              COMPLETION_PROOF="rclone_exit_zero"
            fi
          done

          if rclone lsjson "$GDRIVE_FRAMES_PATH" --recursive --files-only --hash --stats 0 > "$REMOTE_LIST_JSON"; then
            if python3 backend/utils/run_daily_helpers.py write-gdrive-remote-verification \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --remote-list "$REMOTE_LIST_JSON" \
              --output "$REMOTE_PROOF_JSON" \
              --verified-files-output "$VERIFIED_FILES" \
              --run-id "${GITHUB_RUN_ID:-}"; then
              COMPLETION_PROOF="remote_manifest_check"
            else
              echo "Remote hash manifest comparison failed; preserving upload results as unverified."
              : > "$VERIFIED_FILES"
              COMPLETION_PROOF="rclone_exit_zero"
            fi
          else
            echo "Remote hash inventory failed; preserving upload results as unverified."
            : > "$VERIFIED_FILES"
            COMPLETION_PROOF="rclone_exit_zero"
          fi

          VERIFIED_COUNT=$(sort -u "$VERIFIED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERIFIED_COUNT" -lt "$EXPECTED_COUNT" ]; then
            python3 backend/utils/run_daily_helpers.py write-gdrive-staging-shards \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$STAGING_MANIFEST" \
              --output-dir "$STAGING_DIR" \
              --verified-files-from "$VERIFIED_FILES" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --source-root "$FRAMES_DIR" \
              --remote-staging-root "$GDRIVE_STAGING_SCOPE_PATH" \
              --max-files "${GDRIVE_UPLOAD_SHARD_FILES:-1000}" \
              --max-bytes "${GDRIVE_UPLOAD_SHARD_BYTES:-536870912}"
            STAGING_UPLOAD_EXIT=0
            if find "$STAGING_DIR" -type f | grep -q .; then
              rclone copy "$STAGING_DIR" "$GDRIVE_STAGING_SCOPE_PATH" --stats 30s --transfers 2 --checkers 2 --tpslimit 2 || STAGING_UPLOAD_EXIT=$?
              if [ "$STAGING_UPLOAD_EXIT" -eq 0 ]; then
                STAGING_MANIFEST_FOR_STATUS="$STAGING_MANIFEST"
              else
                STAGING_PUBLISH_NOTE="; staging upload failed exit=$STAGING_UPLOAD_EXIT"
                echo "GDrive staging shard upload failed with exit=$STAGING_UPLOAD_EXIT; residual items will remain un-staged in status."
              fi
            fi
          else
            echo '{"schemaVersion":2,"shards":[]}' > "$STAGING_MANIFEST"
            STAGING_MANIFEST_FOR_STATUS="$STAGING_MANIFEST"
          fi

          STATUS_NOTE="batch upload exit=$UPLOAD_EXIT; verified=$VERIFIED_COUNT/$EXPECTED_COUNT; proof=$COMPLETION_PROOF"
          if [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            STATUS_NOTE="$STATUS_NOTE; soft timeout"
          fi
          STATUS_NOTE="$STATUS_NOTE$STAGING_PUBLISH_NOTE"
          write_upload_status "$UPLOAD_EXIT" "$UPLOAD_TIMED_OUT" false "$COMPLETION_PROOF" "$STATUS_NOTE"
          persist_upload_artifacts

          {
            echo "### GDrive upload status"
            echo
            echo '```json'
            cat "$UPLOAD_STATUS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS_VALUE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "$UPLOAD_STATUS")
          if [ "$STATUS_VALUE" = "backfill_required" ] || [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            exit 0
          fi

          exit "$UPLOAD_EXIT"

      - name: Upload GDrive Status Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: gdrive-upload-status-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/log/cron/current-upload-status.json
            backend/log/cron/current-upload-expected.json
            backend/log/cron/current-upload-batches.json
            backend/log/cron/current-upload-files-from.txt
            backend/log/cron/current-upload-verified-files.txt
            backend/log/cron/current-upload-staging-manifest.json
            backend/log/cron/current-upload-remote-list.json
            backend/log/cron/current-upload-remote-proof.json
            backend/log/cron/current-upload-rclone.log
            backend/log/cron/gdrive-upload-residual-queue.jsonl
            backend/log/cron/gdrive-upload-batches/**
            backend/log/cron/gdrive-upload-staging/**
            backend/log/cron/production-contract-fixture-status.json
            backend/log/cron/gemini-runtime-preflight.json
            backend/log/cron/agy-runtime-preflight.txt
            backend/log/cron/agy-runtime-preflight.err
            backend/log/cron/gemini-cli-runtime-preflight.json
            backend/log/cron/gemini-cli-runtime-preflight.err
            backend/log/cron/actions-budget-posture.json
            backend/log/cron/admin-data-quality-audit.json
            backend/log/cron/admin-data-quality-audit.md
      - name: Prepare data-only publication artifact
        id: publication
        if: always()
        env:
          PUBLICATION_DIR: ${{ runner.temp }}/daily-data-publication
        run: |
          set -euo pipefail
          if [ -f "$PUBLICATION_DIR/.ready" ] \
            && [ -f "$PUBLICATION_DIR/daily-data-publication.tar" ] \
            && [ -f "$PUBLICATION_DIR/publication-manifest.json" ] \
            && [ -f "$PUBLICATION_DIR/publication-manifest.sha256" ]; then
            manifest_sha256="$(python3 - "$PUBLICATION_DIR/publication-manifest.json" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          case "$manifest_sha256" in
            *[!0-9a-f]*|'')
              echo "::error::Publication manifest digest is not lowercase SHA-256."
              exit 1
              ;;
          esac
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          else
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated data-only publication artifact
        id: upload-publication
        if: ${{ steps.publication.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: daily-data-publication-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/daily-data-publication/daily-data-publication.tar
            ${{ runner.temp }}/daily-data-publication/publication-manifest.json
            ${{ runner.temp }}/daily-data-publication/publication-manifest.sha256

      - name: Propagate compute pipeline status
        if: always()
        env:
          PIPELINE_EXIT_CODE: ${{ steps.pipeline.outputs.exit_code }}
        run: |
          case "${PIPELINE_EXIT_CODE:-}" in
            0) exit 0 ;;
            '')
              if [ "${{ github.event.inputs.skip_heavy_compute || 'true' }}" = "true" ]; then
                echo "lite crawl missing exit_code; continuing"
                exit 0
              fi
              echo "pipeline exit_code output missing; treating as failure"
              exit 1
              ;;
            *)
              if [ "${{ github.event.inputs.skip_heavy_compute || 'true' }}" = "true" ]; then
                echo "lite crawl worker exited ${PIPELINE_EXIT_CODE}; not failing the job"
                exit 0
              fi
              echo "pipeline exited with ${PIPELINE_EXIT_CODE}"
              exit 1
              ;;
          esac

  daily-publish:
    needs: daily-compute
    if: ${{ always() && needs.daily-compute.outputs.publication_ready == 'true' && needs.daily-compute.outputs.publication_manifest_sha256 != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted publisher source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind publisher to the exact trusted source
        env:
          CANONICAL_REPOSITORY: ${{ github.event.repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$REF_NAME" = "$DEFAULT_BRANCH"
          test "$REF_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"
          git show-ref --verify --quiet refs/remotes/origin/data
          git merge-base --is-ancestor "$TRIGGER_SHA" "origin/$DEFAULT_BRANCH"

      - name: Download data-only publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: daily-data-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-data-publication

      - name: Verify compute-bound manifest digest, artifact action digest, and manifest
        id: verify-publication
        env:
          PUBLICATION_DIR: ${{ runner.temp }}/daily-data-publication
          EXPECTED_COMPUTE_MANIFEST_SHA256: ${{ needs.daily-compute.outputs.publication_manifest_sha256 }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.daily-compute.outputs.artifact_digest }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse origin/data)"
          base_tree="$(git rev-parse "origin/data^{tree}")"
          python3 backend/bin/validate_daily_publication_bundle.py verify \
            --manifest "$PUBLICATION_DIR/publication-manifest.json" \
            --manifest-sha256 "$PUBLICATION_DIR/publication-manifest.sha256" \
            --bundle "$PUBLICATION_DIR/daily-data-publication.tar" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-execution-sha "$EXPECTED_EXECUTION_SHA" \
            --expected-target-branch data \
            --expected-base-sha "$base_sha" \
            --expected-base-tree "$base_tree" \
            --expected-compute-manifest-sha256 "$EXPECTED_COMPUTE_MANIFEST_SHA256" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'base_tree=%s\n' "$base_tree" >> "$GITHUB_OUTPUT"

      - name: Safely extract validated data bytes
        env:
          PUBLICATION_DIR: ${{ runner.temp }}/daily-data-publication
          EXTRACTION_DIR: ${{ runner.temp }}/daily-data-extracted
          EXPECTED_COMPUTE_MANIFEST_SHA256: ${{ needs.daily-compute.outputs.publication_manifest_sha256 }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.daily-compute.outputs.artifact_digest }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EXECUTION_SHA: ${{ github.sha }}
          BASE_SHA: ${{ steps.verify-publication.outputs.base_sha }}
          BASE_TREE: ${{ steps.verify-publication.outputs.base_tree }}
        run: |
          set -euo pipefail
          python3 backend/bin/validate_daily_publication_bundle.py extract \
            --manifest "$PUBLICATION_DIR/publication-manifest.json" \
            --manifest-sha256 "$PUBLICATION_DIR/publication-manifest.sha256" \
            --bundle "$PUBLICATION_DIR/daily-data-publication.tar" \
            --destination "$EXTRACTION_DIR" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-execution-sha "$EXPECTED_EXECUTION_SHA" \
            --expected-target-branch data \
            --expected-base-sha "$BASE_SHA" \
            --expected-base-tree "$BASE_TREE" \
            --expected-compute-manifest-sha256 "$EXPECTED_COMPUTE_MANIFEST_SHA256" \
            --expected-artifact-digest "$EXPECTED_ARTIFACT_DIGEST"

      - name: Create one content-only data commit
        id: commit-publication
        env:
          EXTRACTION_DIR: ${{ runner.temp }}/daily-data-extracted
          TARGET_WORKTREE: ${{ runner.temp }}/daily-data-target
          BASE_SHA: ${{ steps.verify-publication.outputs.base_sha }}
          MANIFEST: ${{ runner.temp }}/daily-data-publication/publication-manifest.json
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null worktree add --detach "$TARGET_WORKTREE" "$BASE_SHA"
          python3 backend/bin/validate_daily_publication_bundle.py apply \
            --manifest "$MANIFEST" \
            --source "$EXTRACTION_DIR" \
            --target "$TARGET_WORKTREE"
          git -C "$TARGET_WORKTREE" -c core.hooksPath=/dev/null add --all -- \
            backend/restaurant-crawling/data backend/restaurant-evaluation/data
          git -C "$TARGET_WORKTREE" diff --cached --check
          git -C "$TARGET_WORKTREE" diff --cached --name-only -z > "$RUNNER_TEMP/daily-publication-index-paths"
          python3 - "$MANIFEST" "$RUNNER_TEMP/daily-publication-index-paths" <<'PY'
          import json
          import pathlib
          import sys
          allowed = {entry["path"] for entry in json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["files"]}
          changed = [item.decode("utf-8") for item in pathlib.Path(sys.argv[2]).read_bytes().split(b"\0") if item]
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit(f"staged non-manifest data paths: {unexpected}")
          PY
          if git -C "$TARGET_WORKTREE" diff --cached --quiet; then
            printf 'committed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$TARGET_WORKTREE" -c core.hooksPath=/dev/null \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit --no-verify -m "chore(data): publish daily data (${{ github.run_id }})"
          test "$(git -C "$TARGET_WORKTREE" rev-parse HEAD^)" = "$BASE_SHA"
          printf 'committed=true\n' >> "$GITHUB_OUTPUT"

      - name: Push the one verified content commit
        if: ${{ steps.commit-publication.outputs.committed == 'true' }}
        env:
          PUSH_TOKEN: ${{ github.token }}
          TARGET_WORKTREE: ${{ runner.temp }}/daily-data-target
          BASE_SHA: ${{ steps.verify-publication.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$TARGET_WORKTREE" rev-parse HEAD^)" = "$BASE_SHA"
          git -C "$TARGET_WORKTREE" merge-base --is-ancestor "$BASE_SHA" HEAD
          askpass="$RUNNER_TEMP/daily-publication-askpass"
          printf '%s\n' '#!/usr/bin/env bash' \
            'case "$1" in *Username*) printf "%s" "x-access-token" ;; *) printf "%s" "$GIT_PASSWORD" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 GIT_PASSWORD="$PUSH_TOKEN" \
            git -C "$TARGET_WORKTREE" -c credential.helper= push \
            "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/data

  hosted-pending-apply:
    needs: []
    if: ${{ github.repository == github.event.repository.full_name && github.ref_name == github.event.repository.default_branch && github.ref_protected && vars.TZUDONG_HOSTED_DATA_PLANE_APPROVED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      TZUDONG_HOSTED_DATA_PLANE_APPROVED: ${{ vars.TZUDONG_HOSTED_DATA_PLANE_APPROVED }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY }}
      NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
      NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
      NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
      NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
      LIVE_MAX_NEW_ITEMS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install crawler Python deps for evaluate
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r backend/restaurant-crawling/scripts/requirements.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked Node dependencies for evaluate
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Preflight hosted pending apply env
        run: python3 backend/bin/check_env_contract.py --profile hosted-pending-apply
      - name: Evaluate new videos then pending-apply
        env:
          TZUDONG_PIPELINE_SOURCE: github_actions
        run: |
          set -euo pipefail
          mkdir -p backend/log/cron
          python3 backend/bin/run_hosted_new_video_pipeline.py \
            --channel tzuyang \
            --limit 1 \
            --preview-out backend/log/cron/hosted-apply-preview.json
