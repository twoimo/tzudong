name: Daily Data Collection

on:
  schedule:
    # 한국 시간(KST) 새벽 4시 = UTC 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      max_videos:
        description: '자막 문맥 생성 개수 설정 (0=Unlimited, -1=Skip)'
        required: false
        default: '-1'
        type: string
      policy_mode:
        description: 'run_daily 정책 모드 (기본: end_to_end)'
        required: false
        default: 'end_to_end'
        type: string
      verify_optional_scenario:
        description: '검증 전용 optional 시나리오 (예: missing_youtube, missing_supabase_migration, missing_supabase_insert)'
        required: false
        default: ''
        type: string
      verify_required_scenario:
        description: '검증 전용 required 시나리오 (예: step08_quota)'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: '검증/수동 실행용 체크아웃 ref (미입력 시 default branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# GitHub Actions Node 20 deprecation 사전 대응: JS actions를 Node 24 런타임으로 강제
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GEMINI_CLI_TRUST_WORKSPACE: "true"

# [PERF] 운영(default branch -> data sync) 런은 직렬화하고, 검증용 non-default workflow_dispatch 는 브랜치별로 분리
# schedule 및 수동 default branch 재실행은 운영 락을 공유하고, 검증 브랜치는 별도 group 으로 실행
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && ((github.event.inputs.checkout_ref || github.event.repository.default_branch) != github.event.repository.default_branch && format('daily-crawl-validation-{0}', github.event.inputs.checkout_ref || github.event.repository.default_branch) || 'daily-crawl-pipeline') || 'daily-crawl-pipeline' }}
  cancel-in-progress: false

jobs:
  daily-crawl:
    runs-on: ubuntu-latest
    # [PERF] 안전 타임아웃: 최대 90분 (월 3000분 한도 보호)
    timeout-minutes: 90
    env:
      MAX_CONTEXT_VIDEOS: ${{ github.event.inputs.max_videos || '-1' }}
    steps:
      # ============================================================
      # 환경 준비 (Setup) - 캐시 최대 활용으로 시간 절약
      # ============================================================

      - name: System Setup (Disk + Swap)
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          # [PERF] 디스크 정리를 백그라운드에서 실행 (스왑 생성과 병렬)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          
          # 스왑 생성 (정리와 병렬 진행 - 서로 다른 경로)
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 백그라운드 정리 완료 대기
          wait
          echo "[OK] System setup complete (Swap 8GB)"
          free -h

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.event.repository.default_branch) || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install System Dependencies (ffmpeg, jq, rclone)
        timeout-minutes: 12
        run: |
          set -euo pipefail

          missing_packages=()
          command -v ffmpeg >/dev/null 2>&1 || missing_packages+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing_packages+=(jq)
          command -v rclone >/dev/null 2>&1 || missing_packages+=(rclone)

          if [ ${#missing_packages[@]} -eq 0 ]; then
            echo "[OK] System dependencies already available"
            ffmpeg -version | head -1 || true
            jq --version || true
            rclone version | head -1 || true
            exit 0
          fi

          APT_OPTIONS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
            -o Dpkg::Use-Pty=0
          )

          retry_with_timeout() {
            local description="$1"
            local time_limit="$2"
            shift 2

            local attempt
            for attempt in 1 2; do
              echo "[INFO] ${description} (attempt ${attempt}/2)"
              if timeout "$time_limit" "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 2 ]; then
                echo "[ERROR] ${description} failed after ${attempt} attempts"
                return 1
              fi

              echo "[WARN] ${description} failed; retrying once..."
            done
          }

          retry_with_timeout "apt-get update" 2m sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTIONS[@]}" update -qq
          retry_with_timeout "apt-get install ${missing_packages[*]}" 4m sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTIONS[@]}" install -y -qq --no-install-recommends "${missing_packages[@]}"

          command -v ffmpeg >/dev/null 2>&1
          command -v jq >/dev/null 2>&1
          command -v rclone >/dev/null 2>&1

          echo "[OK] Installed missing packages: ${missing_packages[*]}"
          ffmpeg -version | head -1 || true
          jq --version || true
          rclone version | head -1 || true

      # ============================================================
      # 의존성 설치 (Dependencies) - 캐시 활용 극대화
      # ============================================================

      - name: Cache Puppeteer Browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/restaurant-crawling/scripts/requirements.txt

      # [PERF] Python + Node 의존성 완전 병렬 설치 (yt-dlp 최신화 포함)
      - name: Install Dependencies (Python + Node.js)
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer
        run: |
          # Python: pip upgrade + requirements + yt-dlp 최신버전 (백그라운드)
          (python -m pip install --upgrade pip -q && \
           pip install -r backend/restaurant-crawling/scripts/requirements.txt -q && \
           pip install -U "yt-dlp[default]" -q && \
           python -m camoufox fetch) &
          PY_PID=$!
          
          # Node.js 의존성 (병렬)
          (cd backend && npm ci --prefer-offline && npm install -g @google/gemini-cli) &
          NPM_PID=$!
          
          # 모든 설치 완료 대기
          wait $PY_PID $NPM_PID
          echo "[OK] All dependencies installed"

      # ============================================================
      # 자격 증명 설정 (Credentials) - 병렬 생성
      # ============================================================

      - name: Setup Credentials
        run: |
          mkdir -p backend/restaurant-crawling/data ~/.gemini ~/.config/rclone
          
          # Add wrapper to PATH
          echo "${{ github.workspace }}/backend/bin" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/backend/bin/gemini
          
          # Google Credentials
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > backend/restaurant-crawling/data/credentials.json
          
          # YouTube Cookies
          if [ -n "${{ secrets.YOUTUBE_COOKIES_TXT }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES_TXT }}" > backend/restaurant-crawling/data/cookies.txt
          fi
          
          # Gemini Credentials (자동 계정 우회 지원)
          # Note: API Key is injected manually as GEMINI_API_KEY_BYEON
          if [ -n "${{ secrets.GEMINI_CREDENTIALS_BASE64 }}" ]; then
            echo "${{ secrets.GEMINI_CREDENTIALS_BASE64 }}" | base64 -d > ~/.gemini/oauth_creds.json
            echo '{"security": {"auth": {"selectedType": "oauth-personal"}}}' > ~/.gemini/settings.json
            echo '{"projects": {}}' > ~/.gemini/projects.json
          fi
          
          # 백업 계정 (쿼타 우회용)
          if [ -n "${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}" ]; then
            echo "${{ secrets.GEMINI_CREDENTIALS_BASE64_2 }}" | base64 -d > ~/.gemini/oauth_creds_backup.json
          fi
          
          # RClone Config
          if [ -n "${{ secrets.GDRIVE_RCLONE_CONFIG }}" ]; then
            echo "${{ secrets.GDRIVE_RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
          fi
          
          echo "[OK] All credentials configured"

      # ============================================================
      # Ollama 설정 (AI Model) - 조건부 실행
      # ============================================================

      - name: Cache Ollama Models
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        uses: actions/cache@v5
        with:
          path: |
            ~/.ollama
            /usr/share/ollama/.ollama
          key: ${{ runner.os }}-ollama-models-v3
          restore-keys: |
            ${{ runner.os }}-ollama-models-

      - name: Setup Ollama
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # [Fix] 캐시 복원 시 모델 디렉토리 권한 보정 (ollama 사용자에게 소유권 이전)
          if [ -d /usr/share/ollama/.ollama ]; then
            sudo chown -R ollama:ollama /usr/share/ollama/.ollama 2>/dev/null || true
          fi
          echo "[OK] Ollama installed"

      - name: Start Ollama & Pull Model
        if: env.MAX_CONTEXT_VIDEOS != '-1'
        run: |
          ollama serve &
          
          # Ollama 준비 대기 (최적화된 폴링)
          for i in $(seq 1 15); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "[OK] Ollama ready (${i}s)"
              break
            fi
            [ $i -eq 15 ] && { echo "[ERROR] Ollama timeout"; exit 1; }
            sleep 1
          done
          
          # 모델 Pull (캐시 히트 시 즉시 완료)
          ollama pull cookieshake/a.x-4.0-light-imatrix:Q8_0

      # ============================================================
      # 파이프라인 실행 (Main Pipeline)
      # ============================================================

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily Pipeline
        timeout-minutes: 80
        env:
          # API Keys
          YOUTUBE_API_KEY_BYEON: ${{ secrets.YOUTUBE_API_KEY_BYEON }}
          GEMINI_API_KEY_BYEON: ${{ secrets.GEMINI_API_KEY_BYEON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Naver & NCP API
          NAVER_CLIENT_ID_BYEON: ${{ secrets.NAVER_CLIENT_ID_BYEON }}
          NAVER_CLIENT_SECRET_BYEON: ${{ secrets.NAVER_CLIENT_SECRET_BYEON }}
          NCP_MAPS_KEY_ID_BYEON: ${{ secrets.NCP_MAPS_KEY_ID_BYEON }}
          NCP_MAPS_KEY_BYEON: ${{ secrets.NCP_MAPS_KEY_BYEON }}
          # RClone / GDrive
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_REMOTE_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/video_cache"
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          # Ollama
          OLLAMA_HOST: http://localhost:11434
          # CI
          CI: true
          RUN_DAILY_POLICY_MODE: ${{ github.event.inputs.policy_mode || 'end_to_end' }}
          RUN_DAILY_VERIFY_OPTIONAL_SCENARIO: ${{ github.event.inputs.verify_optional_scenario || '' }}
          RUN_DAILY_VERIFY_REQUIRED_SCENARIO: ${{ github.event.inputs.verify_required_scenario || '' }}
          RUN_DAILY_EXECUTION_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.event.repository.default_branch) || github.event.repository.default_branch }}
          RUN_DAILY_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && ((github.event.inputs.checkout_ref || github.event.repository.default_branch) != github.event.repository.default_branch && (github.event.inputs.checkout_ref || github.event.repository.default_branch) || 'data') || 'data' }}
        run: |
          chmod +x backend/run_daily.sh
          bash backend/run_daily.sh
          
      # ============================================================
      # 후처리 (Post-processing) - 항상 실행
      # ============================================================

      - name: Add Job Summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Upload Results to GDrive
        if: always()
        continue-on-error: true
        # 대량 프레임은 batch 업로드 + strong remote proof + staging/backfill material을 남긴다.
        timeout-minutes: 45
        env:
          RUN_DAILY_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && ((github.event.inputs.checkout_ref || github.event.repository.default_branch) != github.event.repository.default_branch && (github.event.inputs.checkout_ref || github.event.repository.default_branch) || 'data') || 'data' }}
          GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
          GDRIVE_STATUS_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/status"
          GDRIVE_UPLOAD_MAX_FILES: "0"
          GDRIVE_UPLOAD_BATCH_FILES: "400"
          GDRIVE_UPLOAD_BATCH_BYTES: "402653184"
          GDRIVE_UPLOAD_BATCH_TIMEOUT: "6m"
          GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS: "2280"
          GDRIVE_UPLOAD_MIN_REMAINING_SECONDS: "420"
          GDRIVE_UPLOAD_SHARD_FILES: "1000"
          GDRIVE_UPLOAD_SHARD_BYTES: "536870912"
        run: |
          set -euo pipefail
          FRAMES_DIR="backend/restaurant-crawling/data/frames"
          UPLOAD_LOG_DIR="backend/log/cron"
          SUMMARY_MANIFEST="$UPLOAD_LOG_DIR/current-summary.json"
          EXPECTED_MANIFEST="$UPLOAD_LOG_DIR/current-upload-expected.json"
          BATCH_MANIFEST="$UPLOAD_LOG_DIR/current-upload-batches.json"
          UPLOAD_STATUS="$UPLOAD_LOG_DIR/current-upload-status.json"
          RESIDUAL_QUEUE="$UPLOAD_LOG_DIR/gdrive-upload-residual-queue.jsonl"
          FILES_FROM="$UPLOAD_LOG_DIR/current-upload-files-from.txt"
          BATCH_DIR="$UPLOAD_LOG_DIR/gdrive-upload-batches"
          VERIFIED_FILES="$UPLOAD_LOG_DIR/current-upload-verified-files.txt"
          STAGING_DIR="$UPLOAD_LOG_DIR/gdrive-upload-staging"
          STAGING_MANIFEST="$UPLOAD_LOG_DIR/current-upload-staging-manifest.json"
          RCLONE_LOG="$UPLOAD_LOG_DIR/current-upload-rclone.log"
          mkdir -p "$UPLOAD_LOG_DIR" "$BATCH_DIR" "$STAGING_DIR"
          : > "$VERIFIED_FILES"
          : > "$RCLONE_LOG"
          STATUS_SCOPE="main"
          if [ "${RUN_DAILY_TARGET_BRANCH:-data}" != "data" ]; then
            STATUS_SCOPE="$(printf '%s' "${RUN_DAILY_TARGET_BRANCH:-validation}" | tr '/ :' '---')"
          fi
          GDRIVE_STATUS_SCOPE_PATH="${GDRIVE_STATUS_PATH%/}/$STATUS_SCOPE"
          GDRIVE_STAGING_SCOPE_PATH="$GDRIVE_STATUS_SCOPE_PATH/staging/run-${GITHUB_RUN_ID:-local}"
          echo "GDrive status scope path: $GDRIVE_STATUS_SCOPE_PATH"

          if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
            if rclone copyto "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" "$RESIDUAL_QUEUE" --stats 0 2>/dev/null; then
              echo "Restored previous GDrive residual queue from $GDRIVE_STATUS_SCOPE_PATH."
            else
              echo "No previous GDrive residual queue restored; starting from local state."
            fi
          fi

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-expected \
            --frames-dir "$FRAMES_DIR" \
            --output "$EXPECTED_MANIFEST" \
            --files-from-output "$FILES_FROM" \
            --residual-queue "$RESIDUAL_QUEUE" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --recent-minutes 120 \
            --retention-days 7 \
            --max-items "${GDRIVE_UPLOAD_MAX_FILES:-0}"

          python3 backend/utils/run_daily_helpers.py write-gdrive-upload-batches \
            --expected-manifest "$EXPECTED_MANIFEST" \
            --output "$BATCH_MANIFEST" \
            --output-dir "$BATCH_DIR" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --source-root "$FRAMES_DIR" \
            --remote-root "$GDRIVE_FRAMES_PATH" \
            --max-files "${GDRIVE_UPLOAD_BATCH_FILES:-400}" \
            --max-bytes "${GDRIVE_UPLOAD_BATCH_BYTES:-402653184}"

          EXPECTED_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("expectedCount", 0))' "$EXPECTED_MANIFEST")
          OVERFLOW_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("overflowCount", 0))' "$EXPECTED_MANIFEST")
          UPLOADABLE_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("uploadableCount", 0))' "$EXPECTED_MANIFEST")
          BATCH_COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("batchCount", 0))' "$BATCH_MANIFEST")
          UPLOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          write_upload_status() {
            local exit_code="$1"
            local timed_out="$2"
            local skipped="$3"
            local proof="$4"
            local note="$5"
            python3 backend/utils/run_daily_helpers.py write-gdrive-upload-status \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$UPLOAD_STATUS" \
              --summary-manifest "$SUMMARY_MANIFEST" \
              --residual-queue "$RESIDUAL_QUEUE" \
              --verified-files-from "$VERIFIED_FILES" \
              --staging-manifest "$STAGING_MANIFEST" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --policy warn \
              --upload-mode direct_batch \
              --completion-proof "$proof" \
              --source-root "$FRAMES_DIR" \
              --remote-root "$GDRIVE_FRAMES_PATH" \
              --started-at "$UPLOAD_STARTED_AT" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "$exit_code" \
              --timeout "$timed_out" \
              --skipped "$skipped" \
              --backfill-threshold-attempts 3 \
              --note "$note"
          }

          persist_upload_artifacts() {
            if [ -n "${GDRIVE_STATUS_PATH:-}" ]; then
              rclone copyto "$RESIDUAL_QUEUE" "$GDRIVE_STATUS_SCOPE_PATH/gdrive-upload-residual-queue.jsonl" --stats 0 || true
              rclone copyto "$UPLOAD_STATUS" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-status.json" --stats 0 || true
              rclone copyto "$EXPECTED_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-expected.json" --stats 0 || true
              rclone copyto "$BATCH_MANIFEST" "$GDRIVE_STATUS_SCOPE_PATH/current-upload-batches.json" --stats 0 || true
              if [ -s "$STAGING_MANIFEST" ]; then
                rclone copyto "$STAGING_MANIFEST" "$GDRIVE_STAGING_SCOPE_PATH/current-upload-staging-manifest.json" --stats 0 || true
              fi
            fi
          }

          if [ "$EXPECTED_COUNT" -eq 0 ]; then
            echo "No expected frame files detected, skipping GDrive upload."
            write_upload_status 0 false true none "no expected frame files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$UPLOADABLE_COUNT" -eq 0 ]; then
            echo "Expected frame backlog has no local uploadable files; preserving residual state for backfill/operator action."
            write_upload_status 0 false true none "expected backlog has no local uploadable files"
            persist_upload_artifacts
            cat "$UPLOAD_STATUS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$OVERFLOW_COUNT" -gt 0 ]; then
            echo "Upload manifest capped at $EXPECTED_COUNT expected frame files (overflow queued: $OVERFLOW_COUNT)."
          fi

          echo "Uploading $UPLOADABLE_COUNT local frame files across $BATCH_COUNT batches to GDrive..."
          UPLOAD_EXIT=0
          UPLOAD_TIMED_OUT=false
          COMPLETION_PROOF="none"
          UPLOAD_START_EPOCH=$(date +%s)

          for BATCH_FILE in "$BATCH_DIR"/batch-*.txt; do
            [ -f "$BATCH_FILE" ] || continue
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - UPLOAD_START_EPOCH))
            REMAINING=$((${GDRIVE_UPLOAD_SOFT_BUDGET_SECONDS:-2280} - ELAPSED))
            if [ "$REMAINING" -lt "${GDRIVE_UPLOAD_MIN_REMAINING_SECONDS:-420}" ]; then
              UPLOAD_EXIT=124
              UPLOAD_TIMED_OUT=true
              echo "GDrive upload soft budget nearly exhausted; staging remaining files for backfill."
              break
            fi
            echo "Uploading batch $(basename "$BATCH_FILE")..."
            BATCH_EXIT=0
            (
              cd "$FRAMES_DIR"
              timeout "${GDRIVE_UPLOAD_BATCH_TIMEOUT:-6m}" rclone copy . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --no-traverse --ignore-existing \
                --log-file "../../../../$RCLONE_LOG" \
                --stats 30s --transfers 4 --checkers 4 --tpslimit 4
            ) || BATCH_EXIT=$?
            if [ "$BATCH_EXIT" -ne 0 ]; then
              UPLOAD_EXIT="$BATCH_EXIT"
              if [ "$BATCH_EXIT" -eq 124 ]; then
                UPLOAD_TIMED_OUT=true
              fi
              echo "GDrive batch $(basename "$BATCH_FILE") exited with $BATCH_EXIT; staging remaining files."
              break
            fi
            CHECK_EXIT=0
            (
              cd "$FRAMES_DIR"
              rclone check . "$GDRIVE_FRAMES_PATH" \
                --files-from "../../../../$BATCH_FILE" \
                --size-only --one-way --stats 0 \
                --log-file "../../../../$RCLONE_LOG"
            ) || CHECK_EXIT=$?
            if [ "$CHECK_EXIT" -eq 0 ]; then
              cat "$BATCH_FILE" >> "$VERIFIED_FILES"
              COMPLETION_PROOF="remote_size_check"
            else
              echo "Remote proof failed for $(basename "$BATCH_FILE") with exit=$CHECK_EXIT; keeping it in residual verification backlog."
              COMPLETION_PROOF="rclone_exit_zero"
            fi
          done

          VERIFIED_COUNT=$(sort -u "$VERIFIED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERIFIED_COUNT" -lt "$EXPECTED_COUNT" ]; then
            python3 backend/utils/run_daily_helpers.py write-gdrive-staging-shards \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$STAGING_MANIFEST" \
              --output-dir "$STAGING_DIR" \
              --verified-files-from "$VERIFIED_FILES" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --source-root "$FRAMES_DIR" \
              --remote-staging-root "$GDRIVE_STAGING_SCOPE_PATH" \
              --max-files "${GDRIVE_UPLOAD_SHARD_FILES:-1000}" \
              --max-bytes "${GDRIVE_UPLOAD_SHARD_BYTES:-536870912}"
            if find "$STAGING_DIR" -type f | grep -q .; then
              rclone copy "$STAGING_DIR" "$GDRIVE_STAGING_SCOPE_PATH" --stats 30s --transfers 2 --checkers 2 --tpslimit 2 || true
            fi
          else
            echo '{"schemaVersion":2,"shards":[]}' > "$STAGING_MANIFEST"
          fi

          STATUS_NOTE="batch upload exit=$UPLOAD_EXIT; verified=$VERIFIED_COUNT/$EXPECTED_COUNT; proof=$COMPLETION_PROOF"
          if [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            STATUS_NOTE="$STATUS_NOTE; soft timeout"
          fi
          write_upload_status "$UPLOAD_EXIT" "$UPLOAD_TIMED_OUT" false "$COMPLETION_PROOF" "$STATUS_NOTE"
          persist_upload_artifacts

          {
            echo "### GDrive upload status"
            echo
            echo '```json'
            cat "$UPLOAD_STATUS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS_VALUE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "$UPLOAD_STATUS")
          if [ "$STATUS_VALUE" = "backfill_required" ] || [ "$UPLOAD_TIMED_OUT" = "true" ]; then
            exit 0
          fi

          exit "$UPLOAD_EXIT"

      - name: Upload GDrive Status Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gdrive-upload-status-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            backend/log/cron/current-upload-expected.json
            backend/log/cron/current-upload-status.json
            backend/log/cron/gdrive-upload-residual-queue.jsonl
            backend/log/cron/current-upload-files-from.txt
            backend/log/cron/current-upload-batches.json
            backend/log/cron/current-upload-verified-files.txt
            backend/log/cron/current-upload-staging-manifest.json
            backend/log/cron/current-upload-rclone.log
            backend/log/cron/gdrive-upload-batches/**
            backend/log/cron/gdrive-upload-staging/**
