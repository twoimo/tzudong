name: Nightly Local Regression

on:
  schedule:
    - cron: '30 19 * * *' # 04:30 KST (UTC)
  workflow_dispatch:
    inputs:
      suite:
        description: Local regression lane
        required: false
        default: all
        type: choice
        options:
          - all
          - unit
          - e2e

concurrency:
  group: nightly-local-regression
  cancel-in-progress: false

# This job reconstructs a disposable local stack on Linux. It does not use
# hosted credentials, publish source, or run migrations against hosted services.
# A successful run publishes a public prerelease containing only the explicit
# sanitized artifact allowlist below.
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24.6.0'
  BUN_VERSION: '1.3.14'
  COMPOSE_VERSION: 'v2.39.4'
  LOCAL_STACK_PORT_BASE: '18000'
  APP_PORT: '18080'
  NIGHTLY_SUITE: ${{ inputs.suite || 'all' }}

jobs:
  local:
    name: Disposable local Supabase regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install pinned Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) compose_arch=x86_64 ;;
            aarch64|arm64) compose_arch=aarch64 ;;
            *) echo 'Unsupported runner architecture for pinned Compose.' >&2; exit 1 ;;
          esac
          plugin="$HOME/.docker/cli-plugins/docker-compose"
          mkdir -p "$(dirname "$plugin")"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${compose_arch}" \
            --output "$plugin"
          chmod 0755 "$plugin"
          test "$(docker compose version --short)" = "${COMPOSE_VERSION#v}"
      - name: Enable disposable runner user namespaces
        shell: bash
        run: |
          set -euo pipefail
          for setting in \
            'kernel.apparmor_restrict_unprivileged_userns=0' \
            'kernel.unprivileged_userns_clone=1' \
            'user.max_user_namespaces=28633'; do
            if sudo -n sysctl -w "$setting"; then
              echo "Applied disposable runner namespace setting: ${setting%%=*}"
            else
              echo "Runner does not expose namespace setting: ${setting%%=*}" >&2
            fi
          done

      - name: Verify Linux containment and Python runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/python3
          python3 -c 'import json, pathlib; print(json.dumps({"python": "ready", "version": __import__("sys").version.split()[0]}))'
          unshare --user --map-root-user --pid --fork --mount-proc sh -c \
            'test "$(id -u)" = 0 && test -r /proc/1/status'

      - name: Install Python runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --break-system-packages \
            langgraph langchain-openai langchain-core FlagEmbedding supabase python-dotenv numpy pydantic

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Pull pinned Compose images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nightly-artifacts
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          images = (
              'supabase/studio:2025.12.17-sha-43f4f7f',
              'kong:2.8.1',
              'supabase/gotrue:v2.184.0',
              'postgrest/postgrest:v14.1',
              'supabase/realtime:v2.68.0',
              'supabase/storage-api:v1.33.0',
              'darthsim/imgproxy:v3.8.0',
              'supabase/postgres-meta:v0.95.1',
              'supabase/edge-runtime:v1.69.28',
              'supabase/logflare:1.27.0',
              'supabase/postgres:15.8.1.085',
              'timberio/vector:0.28.1-alpine',
              'supabase/supavisor:2.7.4',
              'inbucket/inbucket:3.0.3',
          )
          markers = (
              ('image_rate_limited', ('toomanyrequests', 'rate limit', '429 too many')),
              ('image_unavailable', ('manifest unknown', 'pull access denied', 'repository does not exist')),
              ('registry_auth', ('unauthorized', 'authentication required', 'error getting credentials')),
              ('registry_network', ('failed to copy', 'unexpected status from head request', 'tls handshake timeout', 'connection reset')),
              ('disk_full', ('no space left on device',)),
          )

          def classify(stderr):
              normalized = stderr.casefold()
              for suffix, values in markers:
                  if any(value in normalized for value in values):
                      return suffix
              return 'unknown'

          safe_env = {
              key: os.environ[key]
              for key in ('PATH', 'HOME', 'USER', 'TMPDIR', 'LANG', 'LC_ALL', 'TERM')
              if os.environ.get(key)
          }
          safe_env.setdefault('PATH', '/usr/bin:/bin')
          safe_env.setdefault('HOME', str(Path.home()))
          records = []
          failed = False
          for image in images:
              record = {'image': image, 'status': 'not_attempted', 'failure_class': 'not_attempted'}
              if not failed:
                  for attempt in range(2):
                      try:
                          result = subprocess.run(
                              ['docker', 'pull', '--quiet', image],
                              capture_output=True,
                              text=True,
                              timeout=180,
                              check=False,
                              env=safe_env,
                          )
                      except FileNotFoundError:
                          record['failure_class'] = 'docker_not_found'
                          break
                      except subprocess.TimeoutExpired:
                          record['failure_class'] = 'timeout'
                          break
                      if result.returncode == 0:
                          record['status'] = 'pulled'
                          record['failure_class'] = 'none'
                          break
                      record['status'] = 'failed'
                      record['failure_class'] = classify(result.stderr)
                      if attempt == 0:
                          time.sleep(10)
                  if record['status'] != 'pulled':
                      failed = True
              records.append(record)
          container_probe = {'status': 'failed', 'failure_class': 'unknown'}
          if not failed:
              try:
                  probe = subprocess.run(
                      [
                          'docker', 'run', '--rm', '--pull=never', '--network=none',
                          '--entrypoint', '/bin/sh', 'supabase/postgres:15.8.1.085',
                          '-c', 'exit 0',
                      ],
                      capture_output=True,
                      text=True,
                      timeout=120,
                      check=False,
                      env=safe_env,
                  )
                  if probe.returncode == 0:
                      container_probe = {'status': 'passed', 'failure_class': 'none'}
                  else:
                      container_probe['failure_class'] = classify(probe.stderr)
              except FileNotFoundError:
                  container_probe['failure_class'] = 'docker_not_found'
              except subprocess.TimeoutExpired:
                  container_probe['failure_class'] = 'timeout'
              if container_probe['status'] != 'passed':
                  failed = True
          receipt = {
              'schema': 'local-image-pull-preflight-v1',
              'image_count': len(images),
              'images': records,
              'container_probe': container_probe,
          }
          Path('nightly-artifacts/local-image-pull-preflight.json').write_text(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          if failed:
              raise SystemExit(2)
          PY
      - name: Probe Compose container creation
        shell: bash
        run: |
          set -euo pipefail
          render_receipt="$RUNNER_TEMP/local-stack-render-preflight.json"
          python3 backend/supabase/scripts/local-stack.py render > "$render_receipt"
          python3 - "$render_receipt" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          project = receipt.get('project_name')
          if receipt.get('schema') != 'local-stack-receipt-v1' or receipt.get('action') != 'render' or receipt.get('ok') is not True:
              raise SystemExit(2)
          if not isinstance(project, str) or not project.startswith('tzudong-local-'):
              raise SystemExit(2)
          state = pathlib.Path('backend/supabase/volumes/.local-stack') / project
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'LOCAL_PROJECT={project}\n')
              handle.write(f'LOCAL_STATE={state.resolve()}\n')
          command = [
              'docker', 'compose',
              '--project-name', project,
              '--env-file', str(state / 'stack.env'),
              '-f', 'backend/supabase/docker-compose.yml',
              '-f', 'backend/supabase/docker-compose.local.yml',
              '-f', 'backend/supabase/docker-compose.mail.yml',
              'create', '--no-start',
              'analytics', 'auth', 'db', 'functions', 'imgproxy', 'kong', 'mail',
              'meta', 'realtime', 'rest', 'storage', 'supavisor', 'vector',
          ]
          safe_env = {
              key: os.environ[key]
              for key in ('PATH', 'HOME', 'USER', 'TMPDIR', 'LANG', 'LC_ALL', 'TERM')
              if os.environ.get(key)
          }
          safe_env.setdefault('PATH', '/usr/bin:/bin')
          safe_env.setdefault('HOME', str(pathlib.Path.home()))
          try:
              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  timeout=300,
                  check=False,
                  env=safe_env,
              )
              status = 'passed' if result.returncode == 0 else 'failed'
          except (OSError, subprocess.TimeoutExpired):
              status = 'failed'
              result = None
          if status != 'passed':
              report = {
                  'schema': 'local-compose-create-preflight-v1',
                  'project_name': project,
                  'status': status,
                  'failure_class': 'timeout' if result is None else 'unknown',
              }
              target = pathlib.Path('nightly-artifacts/failure-diagnostics/local-compose-create-preflight.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(
                  json.dumps(report, sort_keys=True, separators=(',', ':')) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(2)
          PY
      - name: Reset disposable local stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nightly-artifacts
          python3 backend/supabase/scripts/local-stack.py reset \
            > nightly-artifacts/local-stack-reset.json
          python3 - nightly-artifacts/local-stack-reset.json <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if receipt.get('schema') != 'local-stack-receipt-v1' or receipt.get('action') != 'reset' or receipt.get('ok') is not True:
              raise SystemExit('local stack reset did not produce a successful sanitized receipt')
          project = receipt.get('project_name')
          if not isinstance(project, str) or not project.startswith('tzudong-local-'):
              raise SystemExit('local stack reset project identity is invalid')
          state = pathlib.Path('backend/supabase/volumes/.local-stack') / project
          db = subprocess.check_output([
              'docker', 'ps', '--filter', f'label=com.docker.compose.project={project}',
              '--filter', 'label=com.docker.compose.service=db', '--format', '{{.ID}}',
          ], text=True).strip().splitlines()
          if len(db) != 1:
              raise SystemExit('local stack database container identity is not unique')
          env = {
              'LOCAL_PROJECT': project,
              'LOCAL_STATE': str(state.resolve()),
              'LOCAL_DB_CONTAINER': db[0],
          }
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              for key, value in env.items():
                  handle.write(f'{key}={value}\n')
          PY

      - name: Apply local migrations, close functions, and seed
        shell: bash
        run: |
          set -euo pipefail
          state="$LOCAL_STATE"
          bind=(--project "$LOCAL_PROJECT" --state-dir "$state" --env-file "$state/stack.env")
          python3 backend/supabase/scripts/local-migrate.py generate-prerequisite \
            --input backend/supabase/baselines/pre-20260214-public-schema.sql \
            --output backend/supabase/baselines/local/application-prerequisites.sql \
            --manifest-output backend/supabase/baselines/local/APPLICATION_PREREQUISITES.v1.json \
            > "$state/local-prerequisite-generate.json"
          python3 backend/supabase/scripts/local-migrate.py manifest \
            --output "$state/local-migration-manifest.json"
          python3 backend/supabase/scripts/local-migrate.py verify \
            --manifest "$state/local-migration-manifest.json" \
            > "$state/local-migration-verify.json"
          python3 backend/supabase/scripts/local-migrate.py apply-prerequisite \
            --container "$LOCAL_DB_CONTAINER" --allow-local "${bind[@]}" \
            > "$state/local-migrate-prerequisite.json"
          python3 backend/supabase/scripts/local-migrate.py apply \
            --container "$LOCAL_DB_CONTAINER" --allow-local "${bind[@]}" \
            > "$state/local-migrate-apply.json"
          python3 backend/supabase/scripts/local-function-runtime-scan.py generate \
            --output "$state/local-function-path-patch-local.sql" \
            > "$state/local-closure-generate.json"
          python3 backend/supabase/scripts/local-function-runtime-scan.py apply \
            --container "$LOCAL_DB_CONTAINER" --patch "$state/local-function-path-patch-local.sql" \
            > "$state/local-closure-apply.json"
          python3 backend/supabase/scripts/local-function-runtime-scan.py rescan \
            --container "$LOCAL_DB_CONTAINER" --patch "$state/local-function-path-patch-local.sql" \
            > "$state/local-closure-rescan.json"
          python3 backend/supabase/scripts/local-function-runtime-scan.py smoke \
            --container "$LOCAL_DB_CONTAINER" \
            > "$state/local-closure-smoke.json"
          python3 backend/supabase/scripts/local-migrate.py seed \
            --container "$LOCAL_DB_CONTAINER" --allow-local "${bind[@]}" \
            > "$state/local-seed.json"
          python3 backend/supabase/scripts/local-migrate.py receipt \
            --container "$LOCAL_DB_CONTAINER" --allow-local "${bind[@]}" \
            --output "$state/local-receipt-v1.json" \
            > "$state/local-receipt-command.json"

      - name: Run local nightly regression
        working-directory: apps/web
        shell: bash
        run: |
          export TZUDONG_NODE24_EXECUTABLE="$(command -v node)"
          bun run test:nightly -- \
            --mode local \
            --suite "$NIGHTLY_SUITE" \
            --env-file "../../${LOCAL_STATE#"$GITHUB_WORKSPACE/"}/stack.env" \
            --provenance-file "../../${LOCAL_STATE#"$GITHUB_WORKSPACE/"}/stack.env.provenance.json" \
            > nightly-run.log

      - name: Capture sanitized local receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nightly-artifacts
          if [[ -n "${LOCAL_STATE:-}" && -d "$LOCAL_STATE" ]]; then
            python3 backend/supabase/scripts/local-stack.py status \
              > "$LOCAL_STATE/local-stack-status.json" || true
            set -a
            . "$LOCAL_STATE/stack.env"
            set +a
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          import json
          import subprocess

          output = Path('nightly-artifacts')
          output.mkdir(parents=True, exist_ok=True)
          values = [
              os.environ.get(name, '')
              for name in (
                  'POSTGRES_PASSWORD', 'NIGHTLY_ADMIN_PASSWORD', 'ANON_KEY',
                  'SERVICE_ROLE_KEY', 'JWT_SECRET', 'SUPABASE_DB_URL',
              )
              if os.environ.get(name, '')
          ]
          reset_path = Path('nightly-artifacts/local-stack-reset.json')
          try:
              reset = json.loads(reset_path.read_text(encoding='utf-8'))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              reset = {}
          if reset.get('ok') is not True:
              project = reset.get('project_name')
              valid_project = (
                  isinstance(project, str)
                  and project.startswith('tzudong-local-')
                  and len(project) == len('tzudong-local-') + 12
              )
              diagnostics = {
                  'schema': 'local-stack-failure-diagnostics-v1',
                  'project_name': project if valid_project else 'unknown',
                  'failure_code': (
                      reset.get('error_code')
                      if isinstance(reset.get('error_code'), str)
                      and reset.get('error_code').replace('_', '').isalnum()
                      else 'reset_unknown'
                  ),
                  'compose_ps': 'unavailable',
                  'services': [],
              }
              if valid_project:
                  root = Path('backend/supabase/volumes/.local-stack') / project
                  command = [
                      'docker', 'compose',
                      '--project-name', project,
                      '--env-file', str(root / 'stack.env'),
                      '-f', 'backend/supabase/docker-compose.yml',
                      '-f', 'backend/supabase/docker-compose.local.yml',
                      '-f', 'backend/supabase/docker-compose.mail.yml',
                      'ps', '--all', '--format', 'json',
                  ]
                  safe_env = {
                      key: os.environ[key]
                      for key in ('PATH', 'HOME', 'USER', 'TMPDIR', 'LANG', 'LC_ALL', 'TERM')
                      if os.environ.get(key)
                  }
                  safe_env.setdefault('PATH', '/usr/bin:/bin')
                  safe_env.setdefault('HOME', str(Path.home()))
                  try:
                      result = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                          timeout=30,
                          check=False,
                          env=safe_env,
                      )
                      if result.returncode == 0:
                          diagnostics['compose_ps'] = 'passed'
                          try:
                              parsed = json.loads(result.stdout)
                              entries = parsed if isinstance(parsed, list) else [parsed]
                          except (TypeError, ValueError):
                              entries = [
                                  json.loads(line)
                                  for line in result.stdout.splitlines()
                                  if line.strip()
                              ]
                          allowed_services = {
                              'analytics', 'auth', 'db', 'functions', 'imgproxy', 'kong',
                              'mail', 'meta', 'realtime', 'rest', 'storage', 'studio',
                              'supavisor', 'vector',
                          }
                          allowed_states = {'created', 'running', 'exited', 'dead', 'paused', 'restarting', 'removing'}
                          allowed_health = {'', 'healthy', 'unhealthy', 'starting'}
                          for entry in entries:
                              if not isinstance(entry, dict):
                                  continue
                              service = entry.get('Service')
                              state_value = entry.get('State')
                              health_value = entry.get('Health') or ''
                              exit_code = entry.get('ExitCode')
                              if service not in allowed_services:
                                  continue
                              diagnostics['services'].append({
                                  'service': service,
                                  'state': state_value if state_value in allowed_states else 'unknown',
                                  'health': health_value if health_value in allowed_health else 'unknown',
                                  'exit_code': exit_code if isinstance(exit_code, int) and 0 <= exit_code <= 255 else None,
                              })
                  except (OSError, subprocess.TimeoutExpired, TypeError, ValueError, json.JSONDecodeError):
                      pass
              diagnostics['services'].sort(key=lambda entry: entry['service'])
              target = output / 'failure-diagnostics/local-stack-failure-diagnostics.json'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(
                  json.dumps(diagnostics, sort_keys=True, separators=(',', ':')) + '\n',
                  encoding='utf-8',
              )
          sources = []
          state = os.environ.get('LOCAL_STATE', '')
          if state:
              root = Path(state)
              for name in (
                  'last-receipt.json', 'local-stack-status.json',
                  'stack.env.provenance.json', 'stack.inputs.provenance.json',
                  'local-migration-manifest.json', 'local-migration-verify.json',
                  'local-migrate-prerequisite.json', 'local-migrate-apply.json',
                  'local-closure-generate.json', 'local-closure-apply.json',
                  'local-closure-rescan.json', 'local-closure-smoke.json',
                  'local-seed.json', 'local-receipt-command.json', 'local-receipt-v1.json',
              ):
                  sources.append((root / name, Path(name)))
          sources.extend([
              (Path('nightly-artifacts/local-stack-reset.json'), Path('local-stack-reset.json')),
              (Path('apps/web/test-results/local-browser-route-diagnostics.json'), Path('local-browser-route-diagnostics.json')),
          ])
          for source, relative in sources:
              if not source.is_file() or source.is_symlink():
                  continue
              try:
                  text = source.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for value in values:
                  text = text.replace(value, '[REDACTED]')
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          (output / 'publication-boundary.txt').write_text(
              'Local-only sanitized receipts; stack.env and credentials excluded.\n',
              encoding='utf-8',
          )
          PY

      - name: Upload sanitized local nightly artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # actions/upload-artifact@v4
        with:
          name: nightly-local-${{ github.run_id }}
          path: nightly-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and remove disposable local stack
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${LOCAL_STATE:-}" && -f "$LOCAL_STATE/stack.env" ]]; then
            python3 backend/supabase/scripts/local-stack.py stop
            docker compose \
              --project-name "$LOCAL_PROJECT" \
              --env-file "$LOCAL_STATE/stack.env" \
              -f backend/supabase/docker-compose.yml \
              -f backend/supabase/docker-compose.local.yml \
              -f backend/supabase/docker-compose.mail.yml \
              down --volumes --remove-orphans
            rm -rf -- "$LOCAL_STATE"
          fi
  publish:
    name: Publish sanitized nightly prerelease
    needs: local
    if: ${{ needs.local.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download sanitized local nightly artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: nightly-local-${{ github.run_id }}
          path: nightly-artifacts

      - name: Verify trusted publication ref and artifact boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$main_sha"
          test "${GITHUB_SHA}" = "$main_sha"
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('nightly-artifacts')
          all_paths = list(root.rglob('*'))
          if any(path.is_symlink() for path in all_paths):
              raise SystemExit('publication artifact tree contains a symlink')
          allowed = {
              'local-stack-reset.json',
              'local-image-pull-preflight.json',
              'local-stack-status.json',
              'local-migration-manifest.json',
              'local-receipt-v1.json',
              'local-closure-rescan.json',
              'local-closure-smoke.json',
              'local-browser-route-diagnostics.json',
              'publication-boundary.txt',
          }
          stack_receipt_fields = {
              'action',
              'config_sha256',
              'env_provenance_sha256',
              'error_code',
              'generator_version',
              'input_provenance_sha256',
              'ok',
              'project_name',
              'renderer',
              'schema',
              'services',
          }
          migration_receipt_fields = {
              'catalog_sha256',
              'closure_binding_sha256',
              'commit_sha256',
              'compose_evidence_sha256',
              'config_sha256',
              'env_provenance_sha256',
              'environment_contract_sha256',
              'function_source_sha256',
              'image_digests',
              'image_service_digests',
              'input_evidence_sha256',
              'input_provenance_sha256',
              'input_source_manifest_sha256',
              'ledger',
              'ledger_sha256',
              'platform_bootstrap_evidence_sha256',
              'platform_bootstrap_sha256',
              'prerequisite_sha256',
              'project_name',
              'readback',
              'readback_sha256',
              'readback_sql_sha256',
              'schema',
              'seed_sha256',
              'seed_source_sha256',
              'sequence',
              'sequence_sha256',
              'serializer',
              'service',
              'service_sha256',
              'source_chain_sha256',
              'source_manifest_sha256',
              'stack_provenance',
          }
          runtime_fields = {
              'schemaVersion',
              'mode',
              'functionCount',
              'localSearchPathCount',
              'unresolvedPathCount',
              'ambiguousPathCount',
              'definerMissingSearchPathCount',
              'functionMetadataDigest',
              'definitionHash',
              'extensionCatalogSha256',
              'externalEffectBindingSha256',
              'candidateResolution',
              'closureSmoke',
              'rpcSmoke',
              'candidateRpcSmoke',
          }
          expected_fields = {
              'local-stack-reset.json': stack_receipt_fields,
              'local-stack-status.json': stack_receipt_fields,
              'local-migration-manifest.json': {'schemaVersion', 'source', 'exclusions'},
              'local-receipt-v1.json': migration_receipt_fields,
              'local-closure-rescan.json': runtime_fields | {'closureBinding'},
              'local-closure-smoke.json': runtime_fields,
              'local-browser-route-diagnostics.json': {'schema', 'source', 'tests', 'record_count'},
              'local-image-pull-preflight.json': {'schema', 'image_count', 'images', 'container_probe'},
          }
          expected_markers = {
              'local-stack-reset.json': ('schema', 'local-stack-receipt-v1'),
              'local-stack-status.json': ('schema', 'local-stack-receipt-v1'),
              'local-migration-manifest.json': ('schemaVersion', 'local-supabase-migration-manifest/v1'),
              'local-receipt-v1.json': ('schema', 'local-receipt-v1'),
              'local-closure-rescan.json': ('schemaVersion', 'local-function-runtime-scan/v1'),
              'local-closure-smoke.json': ('schemaVersion', 'local-function-runtime-scan/v1'),
              'local-browser-route-diagnostics.json': ('schema', 'local-browser-route-diagnostics-v1'),
              'local-image-pull-preflight.json': ('schema', 'local-image-pull-preflight-v1'),
          }
          files = {
              path.relative_to(root).as_posix()
              for path in all_paths
              if path.is_file()
          }
          if files != allowed:
              raise SystemExit(f'unexpected publication artifacts: {sorted(files ^ allowed)}')
          forbidden = re.compile(r'(?i)(?:password|secret|authorization|bearer|service[_-]?role|database[_-]?url|postgres(?:ql)?://|jwt)')
          for name in sorted(allowed):
              path = root / name
              data = path.read_bytes()
              if len(data) > 256 * 1024:
                  raise SystemExit(f'publication artifact exceeds size bound: {name}')
              if name == 'publication-boundary.txt':
                  if data != b'Local-only sanitized receipts; stack.env and credentials excluded.\n':
                      raise SystemExit('publication boundary marker is not canonical')
                  continue
              try:
                  payload = json.loads(data)
              except json.JSONDecodeError as error:
                  raise SystemExit(f'publication artifact is not JSON: {name}') from error
              expected = expected_fields[name]
              if not isinstance(payload, dict) or set(payload) != expected:
                  raise SystemExit(f'publication artifact schema mismatch: {name}')
              marker_key, marker_value = expected_markers[name]
              if payload.get(marker_key) != marker_value:
                  raise SystemExit(f'publication artifact marker mismatch: {name}')
              if name == 'local-stack-reset.json' and payload.get('action') != 'reset':
                  raise SystemExit('local stack reset receipt action mismatch')
              if name == 'local-stack-status.json' and payload.get('action') != 'status':
                  raise SystemExit('local stack status receipt action mismatch')
              if forbidden.search(json.dumps(payload, separators=(',', ':'))):
                  raise SystemExit(f'publication artifact contains a forbidden secret marker: {name}')
          PY
      - name: Publish sanitized nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="nightly-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Nightly Local Regression ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          notes="nightly-artifacts/release-notes.md"
          cat > "$notes" <<EOF
          Local-only nightly regression prerelease.
          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Scope: disposable loopback Compose stack, synthetic fixtures, and bounded local regression checks.
          Credentials, stack.env, raw rows, provider payloads, and hosted/production state are excluded.
          EOF
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$notes" \
            --prerelease \
            nightly-artifacts/local-stack-reset.json \
            nightly-artifacts/local-stack-status.json \
            nightly-artifacts/local-migration-manifest.json \
            nightly-artifacts/local-receipt-v1.json \
            nightly-artifacts/local-closure-rescan.json \
            nightly-artifacts/local-closure-smoke.json \
            nightly-artifacts/local-browser-route-diagnostics.json \
            nightly-artifacts/publication-boundary.txt
