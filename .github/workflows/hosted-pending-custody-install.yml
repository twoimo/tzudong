name: Hosted pending custody installation
run-name: Pending custody · ${{ inputs.mode }} · ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: observe
        options: [observe, apply]
      source_sha:
        type: string
        required: true
      apply_confirmation:
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  # Preserve accepted observations; the database advisory/ledger locks serialize
  # the operating command. The owner journal permits only one apply dispatch.
  group: hosted-pending-custody-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  operate:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' &&
      github.ref_protected && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.sender.login == github.repository_owner && github.sha == inputs.source_sha &&
      (inputs.mode == 'observe' || github.run_attempt == 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit exact protected source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git symbolic-ref -q HEAD || true)"
      - name: Verify GitHub producer fence before apply
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The owner separately records the local Mac fence. This job cannot
          # inspect a local launchd label and does not claim that it did so.
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-crawler.yml" --jq .state)" = disabled_manually
          for status in queued in_progress requested waiting pending; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-crawler.yml/runs?status=$status&per_page=1" --jq .total_count)"
            test "$count" = 0
          done
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.21.0'
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -q install --no-install-recommends -y postgresql-client
      - name: Rehearse, apply once and independently reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          live_source="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '[.commit.sha,.protected]|@tsv')"
          test "$live_source" = "$EXPECTED_SOURCE_SHA"$'\ttrue'
          node apps/web/scripts/hosted-pending-custody-operation.mjs "$MODE"
