name: Guardian Auth FK successor readback
run-name: Guardian97 · ${{ inputs.mode }} · ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: observe
        options: [observe]
      source_sha:
        type: string
        required: true
      original_operation_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: guardian97-readback-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' &&
      github.ref_protected && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.sender.login == github.repository_owner && github.sha == inputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit exact protected source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git symbolic-ref -q HEAD || true)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.0'
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get -q update
          sudo apt-get -q install --no-install-recommends -y postgresql-client
      # Hosted runners cannot own the parent's durable original global journal.
      # Operating apply remains in the original owner's CLI with that journal;
      # this workflow never creates/replaces it or treats an artifact as custody.
      - name: Independently observe the successor state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          ORIGINAL_OPERATION_ID: ${{ inputs.original_operation_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in observe) ;; *) exit 1 ;; esac
          node apps/web/scripts/g014-guardian-auth-fk-operation.mjs "$MODE"
