name: Security Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/**/requirements*.txt'
      - 'backend/supabase/scripts/g037-hosted-closure-requirements.txt'
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:


concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/web
          - backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Audit npm dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=moderate

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - backend/pipeline/requirements.txt
          - backend/restaurant-crawling/scripts/requirements.txt
          - backend/supabase/scripts/g037-hosted-closure-requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit Python requirements
        run: python -m pip_audit -r "${{ matrix.requirements }}" --strict

  secret-pattern-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Scan tracked files for high-confidence secrets
        run: python3 scripts/security/scan_tracked_secrets.py

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate commit-bound CycloneDX SBOMs
        shell: bash
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"
          mkdir -p "$RUNNER_TEMP/security-evidence"
          npm sbom --prefix apps/web --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/security-evidence/apps-web.cdx.json"
          npm sbom --prefix backend --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/security-evidence/backend.cdx.json"
          (
            cd "$RUNNER_TEMP/security-evidence"
            sha256sum apps-web.cdx.json backend.cdx.json > SHA256SUMS
          )

      - name: Upload bounded SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: security-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/security-evidence/apps-web.cdx.json
            ${{ runner.temp }}/security-evidence/backend.cdx.json
            ${{ runner.temp }}/security-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
