name: Security Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/**/requirements*.txt'
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/web
          - backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Audit npm dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - backend/pipeline/requirements.txt
          - backend/restaurant-crawling/scripts/requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit Python requirements
        run: python -m pip_audit -r "${{ matrix.requirements }}" --strict
