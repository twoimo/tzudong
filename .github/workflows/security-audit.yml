name: Security
run-name: ${{ github.event.pull_request.title || format('Security · {0}', github.ref_name) }}

on:
  pull_request:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:


concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Security scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      security: ${{ steps.select.outputs.security }}
      reason: ${{ steps.select.outputs.reason }}
      fatal: ${{ steps.select.outputs.fatal }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Verify security scope and required-result failure paths
        run: node --test .github/scripts/classify-security-scope.test.mjs .github/scripts/verify-ci-results.test.mjs
      - name: Select security checks for this exact source
        id: select
        run: node .github/scripts/classify-security-scope.mjs

  cloudflare-toolchain-audit:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    name: Cloudflare toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/cloudflare
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/cloudflare/package-lock.json
      - name: Pin authoritative npm
        run: npm install --global npm@11.6.2
      - name: Install locked deployment tools without lifecycle scripts
        run: timeout --signal=TERM --kill-after=10s 4m npm ci --ignore-scripts --no-audit --fund=false
      - name: Audit the complete Cloudflare dependency graph
        run: timeout --signal=TERM --kill-after=10s 4m npm audit --audit-level=moderate
      - name: Exercise Cloudflare failure paths
        run: npm test
      - name: Validate the fail-closed Worker with pinned Wrangler
        run: node node_modules/wrangler/bin/wrangler.js deploy worker.mjs --config wrangler.jsonc --dry-run

  npm-audit:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    # Two 20-minute audits, bounded termination and shared setup.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            backend/package-lock.json

      - name: Pin authoritative npm
        run: |
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - name: Audit npm dependencies
        run: |
          set -uo pipefail
          status=0
          for project in apps/web backend; do
            if ! (
              cd "$project" &&
              timeout --signal=TERM --kill-after=30s 20m npm audit --audit-level=moderate
            ); then
              status=1
            fi
          done
          exit "$status"

  pip-audit:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    # Five 20-minute audits, bounded termination and shared setup.
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit Python requirements
        run: |
          set -uo pipefail
          status=0
          for requirements in \
            backend/test-requirements.txt \
            backend/pipeline/requirements.txt \
            backend/restaurant-crawling/scripts/requirements.txt \
            backend/supabase/scripts/g037-hosted-closure-requirements.txt \
            backend/pipeline-control/requirements.txt; do
            if ! timeout --signal=TERM --kill-after=30s 20m python -m pip_audit -r "$requirements" --strict; then
              status=1
            fi
          done
          exit "$status"

  orchestration-readiness:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    # Include retained-source verification and descriptor tooling after checkout.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Verify retained provenance commits
        run: |
          git fetch --no-tags origin refs/tags/kiro-provenance-platform-20260905 refs/tags/kiro-provenance-corroboration-20260905
          git cat-file -e '880bf06d375dbc6ebe8dcf108419c3f455048a97^{commit}'
          git cat-file -e '2d7a8f6ed5fe9e14d8f5046f45a4ea2d45fb725c^{commit}'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Set up exact Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Verify incremental CI monitoring contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*ci*.py'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/test-requirements.txt

      - name: Verify shared pending custody and terminal cache
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import stat
          from backend.supabase.scripts.hosted_pending_source import observe_source_revision
          root = Path.cwd()
          parents = [{"depth": i, "uid": p.lstat().st_uid,
                      "mode": stat.S_IMODE(p.lstat().st_mode)}
                     for i, p in enumerate((root, *root.parents))]
          print(json.dumps({"nativeUid": os.getuid(), "sourceParents": parents}))
          print("pendingSource=" + observe_source_revision(root))
          PY
          python -m unittest \
            backend.bin.tests.test_evaluate_new_youtube_videos \
            backend.bin.tests.test_hosted_apply_cli \
            backend.bin.tests.test_local_pipeline_freshness \
            backend.bin.tests.test_terminal_completion_cache \
            backend.utils.tests.test_privacy_log

      - name: Set up pinned pipeline Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24.21.0'

      - name: Verify fixed pending custody SQL operation
        run: node --test apps/web/scripts/__tests__/hosted-pending-custody-operation.test.mjs

      - name: Verify transcript collector Python environment binding
        run: node --test backend/restaurant-crawling/scripts/tests/collect-transcript-env.test.mjs

      - name: Verify pipeline receipts, review completeness and resource limits
        run: |
          command -v jq
          python -m unittest backend.bin.tests.test_restaurant_review_automation backend.utils.tests.test_stage_execution backend.utils.tests.test_pipeline_restart_integration
          python -m unittest backend.bin.tests.test_restaurant_evidence_recovery backend.bin.tests.test_recovery_pipeline_budget backend.bin.tests.test_review_input_repair backend.bin.tests.test_review_native_visual_packet
          python -m unittest backend.bin.tests.test_collect_urls_snapshot backend.pipeline.test_validators_unittest
          node --test backend/utils/tests/resource-budget.test.mjs

      - name: Install Helm for actual local descriptor rendering
        uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v4.2.4'
      - name: Install OpenTofu for provider-free local descriptor plans
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false
      - name: Verify crawler orchestration readiness
        run: python backend/bin/check_crawler_orchestration_readiness.py --run-tests --json

      - name: Verify supply-chain source contracts
        run: >-
          python -m unittest
          backend.utils.tests.test_supply_chain_contract
          backend.utils.tests.test_rust_source_recovery

      - name: Verify durable local publication queue and agent results
        run: |
          python -m pip install --disable-pip-version-check -r backend/pipeline-control/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r backend/supabase/scripts/g037-hosted-closure-requirements.txt
          export TZUDONG_TEST_POSTGRES_BIN="$(pg_config --bindir)"
          test -x "$TZUDONG_TEST_POSTGRES_BIN/initdb"
          python -m unittest backend.pipeline_control.test_publish_queue_postgres backend.pipeline_control.test_publication_cas_postgres backend.bin.tests.test_schema_mirror_report_unittest.CatalogDefinitionTests backend.supabase.tests.test_g037_readonly_transaction_postgres backend.supabase.tests.test_release_readiness_observation -v

      - name: Verify Collector crash recovery with disposable fixtures
        run: |
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          TZUDONG_TEST_OTEL_RESTART=1 python -m unittest backend.bin.tests.test_otel_restart

      - name: Verify recovered observability and readiness-agent boundaries
        run: >-
          python -m unittest -v
          backend.utils.tests.test_operational_source_recovery
          backend.utils.tests.test_platform_modernization_reconciliation
          backend.utils.tests.test_duplicate_checker_jsonl
          backend.bin.tests.test_observability_up_unittest
          backend.bin.tests.test_metrics_contract_report_unittest
          backend.bin.tests.test_check_deployment_descriptor_set_unittest
          backend.pipeline_control.test_log_allowlist_pbt
          backend.pipeline_control.test_log_bounds_pbt
          backend.pipeline_control.test_log_pending_queue_unittest
          backend.pipeline_control.test_log_pipeline_unittest
          backend.pipeline_control.test_log_queue_pbt
          backend.pipeline_control.test_log_redaction_pbt
          backend.pipeline_control.test_log_redaction_unittest
          backend.pipeline_control.test_log_required_fields_pbt
          backend.pipeline_control.test_log_retention_unittest
          backend.pipeline_control.test_log_sink_url_pbt
          backend.pipeline_control.test_loopback_boundary_pbt
          backend.pipeline_control.tests.test_loki_sink
          backend.pipeline_control.test_deployment_descriptor_unittest
          backend.pipeline_control.test_descriptor_secret_pbt
          backend.pipeline_control.test_cluster_render_pbt
          backend.pipeline_control.test_ops_agent_unittest
          backend.pipeline_control.test_agent_boundary_pbt
          backend.pipeline_control.test_agent_rate_pbt
          backend.pipeline_control.test_evidence_state_pbt
          backend.pipeline_control.test_migration_readiness_unittest
          backend.bin.tests.test_tooling_gate_unittest
          backend.pipeline_control.test_tag_fixity_pbt
          backend.pipeline_control.test_tooling_selection_unittest

      - name: Verify recovered local-foundation contracts
        run: >-
          python -m unittest
          backend.bin.tests.test_check_local_runtime_unittest
          backend.bin.tests.test_schema_mirror_report_unittest
          backend.bin.tests.test_schema_mirror_pbt
          backend.bin.tests.test_seed_fixture_guard_unittest
          backend.pipeline_control.test_local_boundary_pbt
          backend.pipeline_control.test_local_pipeline_composition_unittest
          backend.pipeline_control.test_run_summary_unittest
          backend.pipeline_control.test_step_composition_pbt
          backend.pipeline_control.tests.test_es_index

      - name: Verify current-input phase gates
        run: >-
          python -m unittest
          backend.utils.tests.test_phase_gate_source_recovery
          backend.bin.tests.test_phase_gate_unittest
          backend.bin.tests.test_run_p1_gate_unittest
          backend.bin.tests.test_run_p2_gate_unittest
          backend.bin.tests.test_run_p3_gate_unittest
          backend.bin.tests.test_run_p4_gate_unittest
          backend.bin.tests.test_run_p5_gate_unittest
          backend.bin.tests.test_run_p6_gate_unittest
          backend.bin.tests.test_run_p7_gate_unittest
          backend.pipeline_control.test_phase_partition_pbt
          backend.pipeline_control.test_rollback_plan_pbt

      - name: Verify current layout and rename ledger
        run: >-
          python -m unittest
          backend.utils.tests.test_layout_naming_source_recovery
          backend.bin.tests.test_check_layout_manifest_unittest
          backend.bin.tests.test_check_rename_ledger_unittest
          backend.bin.tests.test_layout_move_pbt
          backend.bin.tests.test_rename_scope_pbt

      - name: Verify recovered web supply-chain contracts
        run: >-
          bun test
          apps/web/tests-unit/dependency-candidate-split.test.ts
          apps/web/tests-unit/dependency-freshness-workflow.test.ts
          apps/web/tests-unit/image-tag-fixity.test.ts
          apps/web/tests-unit/pin-contract.test.ts
          apps/web/tests-unit/sanitize-leak.test.ts
          apps/web/tests-unit/supabase-entrypoint-source.test.ts
          apps/web/tests-unit/verify-pin-contract-source.test.ts

      - name: Verify fail-closed publication recovery
        run: >-
          python -m unittest
          backend.utils.tests.test_publication_source_recovery
          backend.bin.tests.test_publication_isolation_pbt
          backend.pipeline_control.test_publication_adapter_unittest
          backend.pipeline_control.test_publication_set_unittest
          backend.pipeline_control.test_publish_apply_unittest
          backend.pipeline_control.test_publish_batch_pbt
          backend.pipeline_control.test_publish_codes_pbt
          backend.pipeline_control.test_publish_hash_pbt
          backend.pipeline_control.test_publish_idempotency_pbt
          backend.pipeline_control.test_publish_payload_pbt
          backend.pipeline_control.test_publish_readback_pbt
          backend.pipeline_control.test_publish_schedule_unittest
          backend.pipeline_control.test_publish_worker_unittest
          backend.pipeline_control.tests.test_batch_upsert_publication_allowlist
          backend.supabase.tests.test_local_compose_inputs

      - name: Verify publication admin route boundary
        run: bun test apps/web/tests-unit/publish-jobs-request-contract.test.ts

      - name: Verify immutable owner stages and read-only PG15 replay bindings
        run: >-
          python -m unittest
          backend.supabase.tests.test_g014_owner_final_verifier.SourceContract
          backend.supabase.tests.test_g014_owner_final_replay.SourceContract
          backend.supabase.tests.test_local_replay_contract
          backend.supabase.tests.test_operational_sql_receipts.SourceContract

      - name: Verify Supabase advisor, Auth hardening, and hosted DB access source
        run: |
          python -m unittest \
            backend.supabase.tests.test_g037_reviewed_artifacts \
            backend.supabase.tests.test_optional_s3_overlay \
            backend.supabase.tests.test_advisor_followup_source \
            backend.supabase.tests.test_advisor_replay \
            backend.supabase.tests.test_advisor_replay_prerequisites \
            backend.supabase.tests.test_g037_dedicated_credential_readback_source \
            backend.supabase.tests.test_auth_hardening_evidence_source \
            backend.supabase.tests.test_hosted_db_access_decision_source \
            backend.supabase.tests.test_g037_preflight_attempt_evidence_source \
            backend.supabase.tests.test_g037_runtime_probe_attempt_evidence_source \
            backend.supabase.tests.test_g037_readonly_credential_contract_source \
            backend.supabase.tests.test_g037_readonly_role_preview_approval_source \
            backend.supabase.tests.test_g037_readonly_role_v2_source \
            backend.supabase.tests.test_g037_readonly_role_v2_approval_source \
            backend.supabase.tests.test_g037_readonly_role_postcondition_diagnostic_source \
            backend.supabase.tests.test_g037_readonly_role_postcondition_diagnostic_approval_source \
            backend.supabase.tests.test_g037_readonly_role_membership_diagnostic_source \
            backend.supabase.tests.test_g037_readonly_role_membership_diagnostic_approval_source \
            backend.supabase.tests.test_g037_readonly_role_creator_membership_diagnostic_source \
            backend.supabase.tests.test_g037_readonly_role_creator_membership_diagnostic_approval_source \
            backend.supabase.tests.test_g037_readonly_role_v3_source \
            backend.supabase.tests.test_g037_readonly_role_v3_approval_source \
            backend.supabase.tests.test_g037_readonly_role_v3_apply_request_source \
            backend.supabase.tests.test_g037_readonly_role_v3_apply_authorization_source \
            backend.supabase.tests.test_g037_readonly_role_v3_apply_attempt_source \
            backend.supabase.tests.test_g037_readonly_credential_custody_preview_source \
            backend.supabase.tests.test_g037_readonly_credential_custody_approval_source \
            backend.supabase.tests.test_g037_readonly_password_assignment_request_source \
            backend.supabase.tests.test_g037_direct_endpoint_network_preflight_attempt_source \
            backend.supabase.tests.test_g037_direct_endpoint_network_preflight \
            backend.supabase.tests.test_g037_direct_endpoint_host_evidence_request_source \
            backend.supabase.tests.test_g037_session_pooler_alternative_preview_source \
            backend.supabase.tests.test_g037_session_pooler_preview_approval_request_source \
            backend.supabase.tests.test_g037_session_pooler_preview_approval_contract_source \
            backend.supabase.tests.test_g037_session_pooler_preview_approval_source \
            backend.supabase.tests.test_g037_session_pooler_metadata_request_source \
            backend.supabase.tests.test_g037_session_pooler_metadata_attempt_source \
            backend.supabase.tests.test_g037_session_pooler_metadata_receipt \
            backend.supabase.tests.test_g037_session_pooler_control_map_source \
            backend.supabase.tests.test_g037_session_pooler_control_map_v2_source \
            backend.supabase.tests.test_g037_session_pooler_control_map_v3_source

  rust-recovery:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup run 1.97.0 rustc --version
          rustup run 1.97.0 cargo --version

      - name: Set up canonical performance verifier runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Verify formatting and locked Cargo workspace
        env:
          RUSTUP_TOOLCHAIN: '1.97.0'
        run: |
          rustup run 1.97.0 cargo fmt --manifest-path backend/rust/Cargo.toml --all -- --check
          rustup run 1.97.0 cargo test --manifest-path backend/rust/Cargo.toml --locked

      - name: Build fresh Python extension and verify parity
        env:
          RUSTUP_TOOLCHAIN: '1.97.0'
        run: |
          python -m venv "$RUNNER_TEMP/rust-parity"
          "$RUNNER_TEMP/rust-parity/bin/python" -m pip install --disable-pip-version-check maturin==1.15.0 hypothesis==6.165.10
          VIRTUAL_ENV="$RUNNER_TEMP/rust-parity" "$RUNNER_TEMP/rust-parity/bin/python" -m maturin develop --manifest-path backend/rust/tzudong-validators/Cargo.toml --locked
          VIRTUAL_ENV="$RUNNER_TEMP/rust-parity" "$RUNNER_TEMP/rust-parity/bin/python" -c "import tzudong_validators; assert tzudong_validators.__file__"
          for crate in tzudong-normalize tzudong-upsert-payload tzudong-media-compute tzudong-pipeline-graph; do
            VIRTUAL_ENV="$RUNNER_TEMP/rust-parity" "$RUNNER_TEMP/rust-parity/bin/python" -m maturin develop --manifest-path "backend/rust/$crate/Cargo.toml" --locked
          done
          TZUDONG_REQUIRE_RUST_CALL_SITES=1 "$RUNNER_TEMP/rust-parity/bin/python" -m unittest backend.pipeline_control.tests.test_rust_runtime_bindings
          "$RUNNER_TEMP/rust-parity/bin/python" -m unittest backend.pipeline_control.tests.test_rust_performance_admission backend.pipeline_control.tests.test_rust_promotion_evidence backend.pipeline_control.tests.test_rust_parity backend.pipeline_control.tests.test_impl_selector backend.pipeline_control.test_rust_parity_gate_pbt backend.pipeline_control.test_impl_selector_pbt
          "$RUNNER_TEMP/rust-parity/bin/python" -m unittest backend.rust.tests.parity_pbt backend.rust.tests.parity_error_pbt
          "$RUNNER_TEMP/rust-parity/bin/python" -m unittest backend.rust.tests.test_visit_enum_compiled_parity

  secret-pattern-scan:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Scan tracked files for high-confidence secrets
        run: python3 scripts/security/scan_tracked_secrets.py

  sbom:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate commit-bound CycloneDX SBOMs
        shell: bash
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"
          mkdir -p "$RUNNER_TEMP/security-evidence"
          npm sbom --prefix apps/web --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/security-evidence/apps-web.cdx.json"
          npm sbom --prefix backend --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/security-evidence/backend.cdx.json"
          (
            cd "$RUNNER_TEMP/security-evidence"
            sha256sum apps-web.cdx.json backend.cdx.json > SHA256SUMS
          )

      - name: Upload bounded SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: security-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/security-evidence/apps-web.cdx.json
            ${{ runner.temp }}/security-evidence/backend.cdx.json
            ${{ runner.temp }}/security-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  security-result:
    name: Security
    if: ${{ always() }}
    needs: [scope, cloudflare-toolchain-audit, npm-audit, pip-audit, orchestration-readiness, rust-recovery, secret-pattern-scan, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Require all applicable security checks to finish successfully
        env:
          CI_RESULTS_MODE: security
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-ci-results.mjs
