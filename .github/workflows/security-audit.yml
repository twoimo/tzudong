name: Security Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/**/requirements*.txt'
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/web
          - backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Audit npm dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=moderate

  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - backend/pipeline/requirements.txt
          - backend/restaurant-crawling/scripts/requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install 'pip-audit==2.7.3'

      - name: Audit Python requirements
        run: python -m pip_audit -r "${{ matrix.requirements }}" --strict

  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Scan tracked files for high-confidence secrets
        run: python3 scripts/security/scan_tracked_secrets.py
