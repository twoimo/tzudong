name: Web Admin CI

on:
  pull_request:
    paths:
      - '.github/workflows/web-admin-ci.yml'
      - 'apps/web/app/admin/evaluations/**'
      - 'apps/web/components/admin/**'
      - 'apps/web/lib/admin-address-consistency.ts'
      - 'apps/web/tests-unit/**'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/bun.lock'
      - 'apps/web/tsconfig.json'
      - 'apps/web/eslint.config.mjs'
      - 'backend/bin/apply_tzuyang_address_evidence_ledger.mjs'
      - 'backend/bin/build_tzuyang_address_evidence_ledger.mjs'
      - 'backend/bin/build_tzuyang_case_review_pack.mjs'
      - 'backend/bin/naver_scrapling_fetch.py'
      - 'backend/bin/build_tzuyang_operator_review_package.mjs'
      - 'backend/bin/validate_tzuyang_address_evidence_ledger.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-case-review-pack.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-operator-review-package.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger-cli-fixture.mjs'
  push:
    branches:
      - main
      - develop
      - data
    paths:
      - '.github/workflows/web-admin-ci.yml'
      - 'apps/web/app/admin/evaluations/**'
      - 'apps/web/components/admin/**'
      - 'apps/web/lib/admin-address-consistency.ts'
      - 'apps/web/tests-unit/**'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/bun.lock'
      - 'apps/web/tsconfig.json'
      - 'apps/web/eslint.config.mjs'
      - 'backend/bin/apply_tzuyang_address_evidence_ledger.mjs'
      - 'backend/bin/build_tzuyang_address_evidence_ledger.mjs'
      - 'backend/bin/build_tzuyang_case_review_pack.mjs'
      - 'backend/bin/naver_scrapling_fetch.py'
      - 'backend/bin/build_tzuyang_operator_review_package.mjs'
      - 'backend/bin/validate_tzuyang_address_evidence_ledger.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-case-review-pack.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-operator-review-package.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger.test.mjs'
      - 'backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger-cli-fixture.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-admin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  admin-address-consistency:
    name: Admin address consistency regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tzudong_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.16'

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd ../.. && npm ci --prefix backend

      - name: Lint changed admin address surfaces
        run: >
          npx eslint
          lib/admin-address-consistency.ts
          app/admin/evaluations/page.tsx
          components/admin/EvaluationDetailView.tsx
          components/admin/EvaluationTableNew.tsx
          tests-unit/admin-address-consistency.test.ts
          tests-unit/admin-evaluation-address-filter-source.test.ts
          --max-warnings=0

      - name: Typecheck web app
        run: npx tsc --noEmit --pretty false

      - name: Run backend address ledger regression tests
        run: >
          cd ../.. &&
          node --test
          backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger.test.mjs
          backend/restaurant-evaluation/scripts/tests/tzuyang-case-review-pack.test.mjs
          backend/restaurant-evaluation/scripts/tests/tzuyang-operator-review-package.test.mjs


      - name: Run backend address ledger CLI fixture chain
        run: >
          cd ../.. &&
          TZUYANG_LEDGER_CI_FIXTURE=1
          SUPABASE_DB_HOST=localhost
          SUPABASE_DB_PORT=5432
          SUPABASE_DB_NAME=tzudong_ci
          SUPABASE_DB_USER=postgres
          SUPABASE_DB_PASSWORD=${{ github.run_id }}
          SUPABASE_DB_SSL=disable
          node backend/restaurant-evaluation/scripts/tests/tzuyang-address-evidence-ledger-cli-fixture.mjs

      - name: Run admin address regression tests
        run: >
          bun test
          tests-unit/admin-address-consistency.test.ts
          tests-unit/admin-evaluation-address-filter-source.test.ts
          tests-unit/mobile-desktop-parity-source.test.ts
          tests-unit/web-quality-performance-source.test.ts
