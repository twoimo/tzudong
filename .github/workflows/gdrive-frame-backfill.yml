name: Backfill
run-name: Backfill · ${{ github.ref_name }}

on:
  schedule:
    # Budget-safe catch-up windows after Crawler (UTC 19:00 / KST 04:00).
    # Do not add more default windows without re-checking the monthly Actions budget.
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
  workflow_run:
    workflows: ["Crawler"]
    types: [completed]
  workflow_dispatch:
    inputs:
      status_scope:
        description: 'GDrive status scope to backfill (default: main)'
        required: false
        default: 'main'
        type: string
      max_batches:
        description: 'Maximum staged shard archives to process in this run'
        required: false
        default: '1'
        type: string
      max_items:
        description: 'Maximum frame items to process in this run'
        required: false
        default: '500'
        type: string
      dry_run:
        description: 'Plan only; do not upload or mutate status'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: gdrive-frame-backfill-${{ github.event.inputs.status_scope || 'main' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Public standard runners do not consume the Pro 3000-minute quota, and
    # catch-up backfills can legitimately exceed the former budget guard.
    timeout-minutes: 360
    if: >-
      ${{ github.repository == github.event.repository.full_name &&
          github.ref_name == github.event.repository.default_branch &&
          github.ref_protected &&
          (github.event_name != 'workflow_run' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'schedule' &&
             github.event.workflow_run.head_branch == github.event.repository.default_branch &&
             github.event.workflow_run.head_repository.full_name == github.repository)) }}
    env:
      GDRIVE_FRAMES_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/frames"
      GDRIVE_STATUS_PATH: "gdrive:04_빠른공유/tzudong_tzuyang_data/status"
      STATUS_SCOPE: ${{ github.event.inputs.status_scope || 'main' }}
      MAX_BACKFILL_BATCHES: ${{ github.event.inputs.max_batches || '1' }}
      MAX_BACKFILL_ITEMS: ${{ github.event.inputs.max_items || '500' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted backfill source
        env:
          TRIGGER_REPOSITORY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || github.repository }}
          TRIGGER_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$TRIGGER_REPOSITORY"
          test "$TRIGGER_REF_NAME" = "$DEFAULT_BRANCH"
          test "$TRIGGER_REF_PROTECTED" = "true"
          test -n "$TRIGGER_SHA"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git merge-base --is-ancestor "$TRIGGER_SHA" "origin/$DEFAULT_BRANCH"

      - name: Check Actions budget posture before backfill
        id: budget
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/log/cron/gdrive-backfill
          python3 backend/bin/check_actions_budget.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow daily-crawler.yml \
            --workflow gdrive-frame-backfill.yml \
            --output backend/log/cron/gdrive-backfill/actions-budget-posture.json || true
          soft_gate=$(python3 -c 'import json; print(json.load(open("backend/log/cron/gdrive-backfill/actions-budget-posture.json", encoding="utf-8")).get("softGate", "unknown"))')
          echo "soft_gate=$soft_gate" >> "$GITHUB_OUTPUT"
          {
            echo "### GitHub Actions budget posture"
            echo
            echo "\`\`\`json"
            cat backend/log/cron/gdrive-backfill/actions-budget-posture.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install rclone and jq
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends rclone jq
          rclone version | head -1

      - name: Setup rclone credentials
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          if [ -n "$GDRIVE_RCLONE_CONFIG" ]; then
            printf '%s' "$GDRIVE_RCLONE_CONFIG" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          fi
          test -s ~/.config/rclone/rclone.conf

      - name: Validate runtime environment contract
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
        run: python3 backend/bin/check_env_contract.py --profile gdrive-backfill

      - name: Backfill staged frame shards
        run: |
          set -euo pipefail
          STATUS_SCOPE_SAFE="${STATUS_SCOPE:-main}"
          case "$STATUS_SCOPE_SAFE" in
            ''|*..*|*[!A-Za-z0-9._-]*)
              echo "::error::status_scope must match [A-Za-z0-9._-]+ and must not contain '..'."
              exit 1
              ;;
          esac
          case "${MAX_BACKFILL_BATCHES:-1}:${MAX_BACKFILL_ITEMS:-500}" in
            0:*|*:0)
              echo "No backfill work requested (MAX_BACKFILL_BATCHES=$MAX_BACKFILL_BATCHES, MAX_BACKFILL_ITEMS=$MAX_BACKFILL_ITEMS)."
              mkdir -p backend/log/cron/gdrive-backfill
              printf '%s\n' '{"status":"noop","reason":"zero backfill batch or item limit"}' > backend/log/cron/gdrive-backfill/current-upload-status.json
              exit 0
              ;;
          esac

          STATUS_REMOTE="${GDRIVE_STATUS_PATH%/}/$STATUS_SCOPE_SAFE"
          LOCK_REMOTE="$STATUS_REMOTE/backfill.lock.json"
          WORK_DIR="backend/log/cron/gdrive-backfill"
          RESTORE_DIR="$WORK_DIR/restored"
          EXTRACT_DIR="$WORK_DIR/extracted"
          PLAN_JSON="$WORK_DIR/backfill-plan.json"
          EXPECTED_MANIFEST="$WORK_DIR/current-upload-expected.json"
          UPLOAD_STATUS="$WORK_DIR/current-upload-status.json"
          RESIDUAL_QUEUE="$WORK_DIR/gdrive-upload-residual-queue.jsonl"
          VERIFIED_FILES="$WORK_DIR/backfill-verified-files.txt"
          RCLONE_LOG="$WORK_DIR/backfill-rclone.log"
          REMOTE_LIST_JSON="$WORK_DIR/backfill-remote-files.json"
          STAGING_MANIFEST="$WORK_DIR/current-upload-staging-manifest.json"
          STAGING_MANIFEST_DIR="$WORK_DIR/staging-manifests"
          mkdir -p "$RESTORE_DIR" "$EXTRACT_DIR" "$STAGING_MANIFEST_DIR"
          : > "$VERIFIED_FILES"
          : > "$RCLONE_LOG"
          ROOT_DIR="$PWD"
          RCLONE_LOG_ABS="$ROOT_DIR/$RCLONE_LOG"
          : > "$RESIDUAL_QUEUE"

          RCLONE_DRIVE_FLAGS=(--drive-pacer-min-sleep 500ms --drive-pacer-burst 1 --tpslimit 2)
          RCLONE_RETRY_FLAGS=(--retries 5 --low-level-retries 20 --retries-sleep 30s)

          rclone copyto "$STATUS_REMOTE/current-upload-status.json" "$UPLOAD_STATUS.previous" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
          rclone copyto "$STATUS_REMOTE/gdrive-upload-residual-queue.jsonl" "$RESIDUAL_QUEUE" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
          rclone copy "$STATUS_REMOTE/staging" "$STAGING_MANIFEST_DIR" \
            --filter "+ current-upload-staging-manifest.json" \
            --filter "+ **/current-upload-staging-manifest.json" \
            --filter "- **" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true

          set +e
          python3 - "$UPLOAD_STATUS.previous" "$RESIDUAL_QUEUE" "$STAGING_MANIFEST_DIR" "${GITHUB_EVENT_NAME:-unknown}" "$MAX_BACKFILL_BATCHES" "$MAX_BACKFILL_ITEMS" <<'PY'
          import json, sys
          from pathlib import Path

          status_path, queue_path, staging_dir, event_name, max_batches, max_items = sys.argv[1:7]
          status = {}
          status_file = Path(status_path)
          if status_file.exists() and status_file.stat().st_size > 0:
              try:
                  status = json.loads(status_file.read_text(encoding='utf-8'))
              except Exception as exc:
                  status = {'parseError': str(exc)}

          queue_file = Path(queue_path)
          queue_line_count = 0
          if queue_file.exists() and queue_file.stat().st_size > 0:
              queue_line_count = sum(1 for line in queue_file.read_text(encoding='utf-8').splitlines() if line.strip())

          staging_manifest_count = 0
          staging_item_count = 0
          for manifest_path in Path(staging_dir).rglob('current-upload-staging-manifest.json'):
              staging_manifest_count += 1
              try:
                  payload = json.loads(manifest_path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              staging_item_count += sum(len(shard.get('items') or []) for shard in payload.get('shards', []) if isinstance(shard, dict))

          numeric_fields = {}
          for key in ('residualCount', 'pendingBacklogCount', 'stagedShardCount', 'stagedShardItemCount'):
              try:
                  numeric_fields[key] = int(status.get(key) or 0)
              except Exception:
                  numeric_fields[key] = 0

          reasons = []
          if status.get('status') == 'backfill_required':
              reasons.append('status=backfill_required')
          for key, value in numeric_fields.items():
              if value > 0:
                  reasons.append(f'{key}={value}')
          if queue_line_count > 0:
              reasons.append(f'residualQueueLines={queue_line_count}')

          telemetry = {
              'trigger': event_name,
              'status': status.get('status') or 'missing',
              'backlogDetected': bool(reasons),
              'backlogReason': reasons,
              'residualCount': numeric_fields['residualCount'],
              'pendingBacklogCount': numeric_fields['pendingBacklogCount'],
              'stagedShardCount': numeric_fields['stagedShardCount'],
              'stagedShardItemCount': numeric_fields['stagedShardItemCount'],
              'residualQueueLines': queue_line_count,
              'stagingManifestCount': staging_manifest_count,
              'stagingItemCount': staging_item_count,
              'maxBackfillBatches': max_batches,
              'maxSelectedItemCount': max_items,
          }
          print('Backfill preflight: ' + json.dumps(telemetry, sort_keys=True))
          if not reasons:
              print('No GDrive backfill backlog detected; exiting.')
              raise SystemExit(42)
          PY
          PREFLIGHT_STATUS=$?
          set -e
          if [ "$PREFLIGHT_STATUS" -eq 42 ]; then
            {
              echo "### GDrive frame backfill preflight"
              echo
              echo "No GDrive backfill backlog detected; exiting."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            exit "$PREFLIGHT_STATUS"
          fi

          if rclone copyto "$LOCK_REMOTE" "$WORK_DIR/backfill.lock.remote.json" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" 2>/dev/null; then
            set +e
            python3 - "$WORK_DIR/backfill.lock.remote.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path = sys.argv[1]
          lock = json.load(open(path, encoding='utf-8'))
          expires = lock.get('expiresAt')
          if expires:
              expires_at = datetime.fromisoformat(expires.replace('Z', '+00:00'))
              if expires_at > datetime.now(timezone.utc):
                  print(f"lease_held by {lock.get('ownerRunId')} until {expires}")
                  raise SystemExit(42)
          PY
            LOCK_STATUS=$?
            set -e
            case "$LOCK_STATUS" in
              42) exit 0 ;;
              0) ;;
              *) exit "$LOCK_STATUS" ;;
            esac
          fi

          python3 - "$WORK_DIR/backfill.lock.json" "${GITHUB_RUN_ID:-manual}" "$STATUS_SCOPE_SAFE" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          path, run_id, scope = sys.argv[1:4]
          now = datetime.now(timezone.utc).replace(microsecond=0)
          lock = {
            'ownerRunId': run_id,
            'scope': scope,
            'startedAt': now.isoformat().replace('+00:00', 'Z'),
            'heartbeatAt': now.isoformat().replace('+00:00', 'Z'),
            'expiresAt': (now + timedelta(minutes=75)).isoformat().replace('+00:00', 'Z'),
          }
          open(path, 'w', encoding='utf-8').write(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY
          LOCK_ACQUIRED=false
          cleanup_lock() {
            if [ "$LOCK_ACQUIRED" = "true" ] && [ "$DRY_RUN" != "true" ]; then
              rclone deletefile "$LOCK_REMOTE" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
            fi
          }
          trap cleanup_lock EXIT

          if [ "$DRY_RUN" != "true" ]; then
            rclone copyto "$WORK_DIR/backfill.lock.json" "$LOCK_REMOTE" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}"
            LOCK_ACQUIRED=true
          fi

          rclone copyto "$STATUS_REMOTE/current-upload-expected.json" "$EXPECTED_MANIFEST" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}"
          if ! rclone lsjson "$GDRIVE_FRAMES_PATH" --recursive --files-only --hash --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" > "$REMOTE_LIST_JSON"; then
            echo "Remote preflight inventory failed; planning from residual queue only."
            printf '[]\n' > "$REMOTE_LIST_JSON"
          fi

          python3 - "$RESIDUAL_QUEUE" "$PLAN_JSON" "$MAX_BACKFILL_BATCHES" "$MAX_BACKFILL_ITEMS" "$STAGING_MANIFEST_DIR" "$STAGING_MANIFEST" "$EXPECTED_MANIFEST" "$REMOTE_LIST_JSON" "$VERIFIED_FILES" <<'PY'
          import json, sys
          from collections import OrderedDict
          from pathlib import Path

          queue_path, plan_path, max_batches_raw, max_items_raw, manifest_dir, staging_manifest_path, expected_path, remote_list_path, verified_path = sys.argv[1:10]
          max_batches = max(1, int(max_batches_raw or '1'))
          max_items = max(1, int(max_items_raw or '500'))
          expected = json.load(open(expected_path, encoding='utf-8'))
          remote_entries = json.load(open(remote_list_path, encoding='utf-8'))
          remote_md5s = {}
          for entry in remote_entries:
              if not isinstance(entry, dict):
                  continue
              rel = str(entry.get('Path', ''))
              hashes = entry.get('Hashes') if isinstance(entry.get('Hashes'), dict) else {}
              md5 = str(hashes.get('MD5') or hashes.get('md5') or '').lower()
              if rel and md5:
                  remote_md5s[rel] = md5
          expected_md5s = {}
          for expected_item in expected.get('items', []):
              if not isinstance(expected_item, dict):
                  continue
              rel = str(expected_item.get('relativePath') or '')
              md5 = str(expected_item.get('md5') or '').lower()
              if rel and md5:
                  expected_md5s[rel] = md5
          remote_verified = {rel for rel, md5 in expected_md5s.items() if remote_md5s.get(rel) == md5}
          Path(verified_path).write_text('\n'.join(sorted(remote_verified)) + ('\n' if remote_verified else ''), encoding='utf-8')

          staging_by_rel = {}
          shard_contracts = OrderedDict()
          source_bindings = {}
          for manifest_path in sorted(Path(manifest_dir).rglob('current-upload-staging-manifest.json')):
              try:
                  payload = json.loads(manifest_path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              source_binding = {
                  'runId': payload.get('runId'),
                  'expectedManifestSha256': payload.get('expectedManifestSha256'),
              }
              for shard in payload.get('shards', []):
                  if not isinstance(shard, dict):
                      continue
                  required_shard_keys = {
                      'shardId', 'remoteShard', 'archiveSha256', 'archiveSize',
                      'itemCount', 'byteCount', 'items', 'archiveReceipt',
                  }
                  if set(shard) != required_shard_keys:
                      raise SystemExit('staging shard contract has missing or extra fields')
                  remote = shard.get('remoteShard')
                  if not isinstance(remote, str) or not remote:
                      continue
                  existing = shard_contracts.get(remote)
                  if existing is not None and (
                      existing != shard or source_bindings[remote] != source_binding
                  ):
                      raise SystemExit(f'conflicting staging contracts for {remote}')
                  shard_contracts[remote] = shard
                  source_bindings[remote] = source_binding
                  for item in shard.get('items', []):
                      if not isinstance(item, dict):
                          continue
                      rel = item.get('relativePath')
                      if isinstance(rel, str) and rel:
                          previous = staging_by_rel.get(rel)
                          if previous is not None and previous != remote:
                              raise SystemExit(f'conflicting staging membership for {rel}')
                          staging_by_rel[rel] = remote

          eligible_states = {'staged', 'missing_local', 'pending_local'}
          selected_by_remote = OrderedDict()
          missing = []
          for line in open(queue_path, encoding='utf-8'):
              if not line.strip():
                  continue
              entry = json.loads(line)
              item = entry.get('item') or {}
              rel = item.get('relativePath')
              state = entry.get('state') or item.get('state')
              remote = entry.get('stagingShard') or item.get('stagingShard') or staging_by_rel.get(rel)
              if rel in remote_verified:
                  continue
              if (
                  state in eligible_states
                  and isinstance(rel, str)
                  and rel
                  and remote in shard_contracts
              ):
                  selected_by_remote.setdefault(remote, OrderedDict()).setdefault(rel, None)
              elif state == 'missing_local':
                  missing.append(rel)

          selected = []
          selected_item_count = 0
          for remote, selected_items_by_path in list(selected_by_remote.items())[:max_batches]:
              remaining = max_items - selected_item_count
              if remaining <= 0:
                  break
              selected_items = list(selected_items_by_path)[:remaining]
              if selected_items:
                  selected.append(
                      {
                          'remoteShard': remote,
                          'items': selected_items,
                          'shard': shard_contracts[remote],
                          'sourceManifestBinding': source_bindings[remote],
                      }
                  )
                  selected_item_count += len(selected_items)

          staging_manifest = {
              'schemaVersion': 2,
              'shards': [
                  {
                      'remoteShard': remote,
                      'shard': shard,
                      'sourceManifestBinding': source_bindings[remote],
                  }
                  for remote, shard in shard_contracts.items()
              ],
          }
          Path(staging_manifest_path).write_text(
              json.dumps(staging_manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          plan = {'shards': selected, 'missingItems': missing}
          Path(plan_path).write_text(json.dumps(plan, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Backfill plan telemetry: ' + json.dumps({
              'selectedShardCount': len(selected),
              'selectedItemCount': selected_item_count,
              'maxSelectedItemCount': max_items,
              'missingLocalCount': len(missing),
              'remoteVerifiedBeforeCount': len(remote_verified),
              'stagingManifestItems': len(staging_by_rel),
          }, sort_keys=True))
          PY

          if [ "$DRY_RUN" = "true" ]; then
            cat "$PLAN_JSON"
            exit 0
          fi

          SHARD_COUNT=$(jq '.shards | length' "$PLAN_JSON")
          BACKFILL_EXIT=0
          if [ "$SHARD_COUNT" -eq 0 ]; then
            echo "No staged shards to backfill; writing cumulative remote status."
          fi

          for index in $(seq 0 $((SHARD_COUNT - 1))); do
            REMOTE_SHARD=$(jq -er ".shards[$index].remoteShard" "$PLAN_JSON")
            LOCAL_ARCHIVE="$RESTORE_DIR/backfill-shard-$index.tar.gz"
            SHARD_CONTRACT="$WORK_DIR/backfill-shard-$index.contract.json"
            FILES_FROM="$WORK_DIR/backfill-shard-$index.txt"
            FILES_FROM_ABS="$ROOT_DIR/$FILES_FROM"
            SHARD_EXTRACT_DIR="$EXTRACT_DIR/shard-$index"
            SHARD_RECEIPT="$WORK_DIR/backfill-shard-$index.receipt.json"
            jq -e ".shards[$index].shard" "$PLAN_JSON" > "$SHARD_CONTRACT"
            jq -r ".shards[$index].items[]" "$PLAN_JSON" > "$FILES_FROM"
            SHARD_EXIT=0
            set +e
            rclone copyto "$REMOTE_SHARD" "$LOCAL_ARCHIVE" --stats 30s "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}"
            COPY_EXIT=$?
            if [ "$COPY_EXIT" -eq 0 ]; then
              python3 backend/utils/run_daily_helpers.py extract-gdrive-backfill-shard \
                --archive "$LOCAL_ARCHIVE" \
                --shard-contract "$SHARD_CONTRACT" \
                --expected-manifest "$EXPECTED_MANIFEST" \
                --files-from "$FILES_FROM" \
                --output-dir "$SHARD_EXTRACT_DIR" \
                --output-receipt "$SHARD_RECEIPT" \
                > "$WORK_DIR/backfill-shard-$index.extract.json"
              EXTRACT_EXIT=$?
            else
              EXTRACT_EXIT=1
            fi
            if [ "$COPY_EXIT" -eq 0 ] && [ "$EXTRACT_EXIT" -eq 0 ]; then
              (
                cd "$SHARD_EXTRACT_DIR"
                rclone copy . "$GDRIVE_FRAMES_PATH" \
                  --files-from "$FILES_FROM_ABS" \
                  --no-traverse --ignore-existing \
                  --log-file "$RCLONE_LOG_ABS" \
                  --stats 30s --transfers 2 --checkers 2 \
                  "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}"
                rclone check . "$GDRIVE_FRAMES_PATH" \
                  --files-from "$FILES_FROM_ABS" \
                  --one-way --stats 0 \
                  --checkers 2 \
                  --log-file "$RCLONE_LOG_ABS" \
                  "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}"
              )
              SHARD_EXIT=$?
            else
              SHARD_EXIT=1
            fi
            set -e
            if [ "$SHARD_EXIT" -eq 0 ]; then
              cat "$FILES_FROM" >> "$VERIFIED_FILES"
              echo "Backfill shard $index copied from a hash-bound archive; terminal status is deferred until cumulative lsjson --hash proof completes."
            else
              BACKFILL_EXIT="$SHARD_EXIT"
              echo "Backfill shard $index failed with exit=$SHARD_EXIT; preserving residual queue."
            fi
          done

          COMPLETION_PROOF="remote_manifest_check"
          if [ "$BACKFILL_EXIT" -eq 0 ]; then
            if rclone lsjson "$GDRIVE_FRAMES_PATH" --recursive --files-only --hash --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" > "$REMOTE_LIST_JSON"; then
              python3 - "$EXPECTED_MANIFEST" "$REMOTE_LIST_JSON" "$VERIFIED_FILES" <<'PY'
          import json, sys
          expected_path, remote_list_path, verified_path = sys.argv[1:4]
          expected = json.load(open(expected_path, encoding='utf-8'))
          remote_entries = json.load(open(remote_list_path, encoding='utf-8'))
          remote_md5s = {}
          for entry in remote_entries:
              if not isinstance(entry, dict):
                  continue
              rel = str(entry.get('Path', ''))
              hashes = entry.get('Hashes') if isinstance(entry.get('Hashes'), dict) else {}
              md5 = str(hashes.get('MD5') or hashes.get('md5') or '').lower()
              if rel and md5:
                  remote_md5s[rel] = md5
          verified = []
          for item in expected.get('items', []):
              if not isinstance(item, dict):
                  continue
              rel = str(item.get('relativePath') or '')
              md5 = str(item.get('md5') or '').lower()
              if rel and md5 and remote_md5s.get(rel) == md5:
                  verified.append(rel)
          with open(verified_path, 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(sorted(set(verified))) + ('\n' if verified else ''))
          print(json.dumps({'remoteVerifiedCount': len(set(verified)), 'remoteListedCount': len(remote_md5s)}, sort_keys=True))
          PY
            else
              BACKFILL_EXIT=1
              COMPLETION_PROOF="none"
              echo "Remote cumulative verification failed; preserving residual queue."
            fi
          else
            COMPLETION_PROOF="none"
          fi

          if [ "$BACKFILL_EXIT" -ne 0 ]; then
            echo "Backfill failed; preserving previous remote status and residual queue instead of publishing downgraded progress."
            if [ -s "$UPLOAD_STATUS.previous" ]; then
              cp "$UPLOAD_STATUS.previous" "$UPLOAD_STATUS"
            fi
          else
            python3 backend/utils/run_daily_helpers.py write-gdrive-upload-status \
              --expected-manifest "$EXPECTED_MANIFEST" \
              --output "$UPLOAD_STATUS" \
              --residual-queue "$RESIDUAL_QUEUE" \
              --verified-files-from "$VERIFIED_FILES" \
              --run-id "${GITHUB_RUN_ID:-}" \
              --policy warn \
              --upload-mode backfill \
              --completion-proof "$COMPLETION_PROOF" \
              --source-root "$EXTRACT_DIR" \
              --remote-root "$GDRIVE_FRAMES_PATH" \
              --started-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code "$BACKFILL_EXIT" \
              --timeout false \
              --backfill-threshold-attempts 3 \
              --note "backfill processed staged shards"

            rclone copyto "$RESIDUAL_QUEUE" "$STATUS_REMOTE/gdrive-upload-residual-queue.jsonl" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
            rclone copyto "$UPLOAD_STATUS" "$STATUS_REMOTE/current-upload-status.json" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
            rclone copyto "$EXPECTED_MANIFEST" "$STATUS_REMOTE/current-upload-expected.json" --stats 0 "${RCLONE_DRIVE_FLAGS[@]}" "${RCLONE_RETRY_FLAGS[@]}" || true
          fi

          {
            echo "### GDrive frame backfill status"
            echo
            echo '```json'
            cat "$UPLOAD_STATUS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$BACKFILL_EXIT"

      - name: Upload backfill artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: gdrive-frame-backfill-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/log/cron/gdrive-backfill/current-upload-status.json
            backend/log/cron/gdrive-backfill/current-upload-expected.json
            backend/log/cron/gdrive-backfill/gdrive-upload-residual-queue.jsonl
            backend/log/cron/gdrive-backfill/backfill-plan.json
            backend/log/cron/gdrive-backfill/backfill-verified-files.txt
            backend/log/cron/gdrive-backfill/backfill-remote-files.json
            backend/log/cron/gdrive-backfill/current-upload-staging-manifest.json
            backend/log/cron/gdrive-backfill/backfill-rclone.log
            backend/log/cron/gdrive-backfill/backfill-shard-*.contract.json
            backend/log/cron/gdrive-backfill/backfill-shard-*.extract.json
            backend/log/cron/gdrive-backfill/backfill-shard-*.receipt.json
            backend/log/cron/gdrive-backfill/staging-manifests/**
            backend/log/cron/gdrive-backfill/restored/**
            backend/log/cron/gdrive-backfill/backfill.lock.json
