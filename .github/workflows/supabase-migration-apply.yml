name: Supabase Migration Apply

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'SQL migration file to apply'
        required: false
        default: 'backend/supabase/migrations/20260531105250_restaurant_refresh_history.sql'
        type: string
      migration_name:
        description: 'Supabase migration name'
        required: false
        default: 'restaurant_refresh_history'
        type: string
      dry_run:
        description: 'Validate inputs without applying the migration'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: supabase-migration-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIGRATION_FILE: ${{ github.event.inputs.migration_file }}
      MIGRATION_NAME: ${{ github.event.inputs.migration_name }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install PostgreSQL client for direct DB migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply selected Supabase migration
        run: |
          set -euo pipefail
          args=(--migration-file "$MIGRATION_FILE" --name "$MIGRATION_NAME" --verify-table restaurant_refresh_candidates --json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node apps/web/scripts/apply-supabase-migration.mjs "${args[@]}"
