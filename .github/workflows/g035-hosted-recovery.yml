name: Recovery
run-name: Recovery · ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Local rehearsal operation
        required: true
        default: validate
        type: choice
        options: [validate, capture, short-url-remediation-inspect, short-url-remediation-apply, short-url-remediation-verify, clone-apply, local-postflight]
      evidence_receipt_path:
        description: Absolute local path outside the workspace
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: g035-local-recovery
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: [self-hosted, g035-recovery-local]
    timeout-minutes: 120
    env:
      REQUESTED_MODE: ${{ inputs.mode }}
      EVIDENCE_RECEIPT_PATH: ${{ inputs.evidence_receipt_path }}
      G035_HOSTED_PG_SERVICE_FILE: ${{ vars.G035_HOSTED_PG_SERVICE_FILE }}
      G035_LOCAL_PG_SERVICE_FILE: ${{ vars.G035_LOCAL_PG_SERVICE_FILE }}
      G035_ENCRYPTED_DESTINATION_PATH: ${{ vars.G035_ENCRYPTED_DESTINATION_PATH }}
      G035_PUBLIC_RECIPIENT: ${{ vars.G035_PUBLIC_RECIPIENT }}
      G035_ENCRYPT_COMMAND: ${{ vars.G035_ENCRYPT_COMMAND }}
      G035_G034_ARTIFACT: ${{ vars.G035_G034_ARTIFACT }}
      G035_RESTORE_RECEIPT_PATH: ${{ vars.G035_RESTORE_RECEIPT_PATH }}
      G035_SHORT_URL_REMEDIATION_INSPECT_RECEIPT_PATH: ${{ vars.G035_SHORT_URL_REMEDIATION_INSPECT_RECEIPT_PATH }}
      G035_SHORT_URL_REMEDIATION_APPLY_RECEIPT_PATH: ${{ vars.G035_SHORT_URL_REMEDIATION_APPLY_RECEIPT_PATH }}
      G035_SHORT_URL_REMEDIATION_VERIFY_RECEIPT_PATH: ${{ vars.G035_SHORT_URL_REMEDIATION_VERIFY_RECEIPT_PATH }}
      G035_CLONE_RECEIPT_PATH: ${{ vars.G035_CLONE_RECEIPT_PATH }}
      G035_REMEDIATION_AUTHORIZATION_PATH: ${{ vars.G035_REMEDIATION_AUTHORIZATION_PATH }}
      G035_REMEDIATION_AUTHORIZATION_SIGNATURE_PATH: ${{ vars.G035_REMEDIATION_AUTHORIZATION_SIGNATURE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install hash-locked local driver
        run: python -m pip install --require-hashes -r backend/supabase/scripts/g034-preflight-requirements.txt
      - name: Run local-only rehearsal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          bootstrap='backend/supabase/scripts/g040_isolated_bootstrap.py'
          entrypoint='backend/supabase/scripts/g035_hosted_recovery.py'
          run_g035() {
            git show "$source_commit:$bootstrap" | python -I - \
              --repository-root "$GITHUB_WORKSPACE" \
              --authorized-final-commit "$source_commit" \
              --entrypoint "$entrypoint" -- "$@"
          }
          case "$EVIDENCE_RECEIPT_PATH" in
            /*|[A-Za-z]:/*|[A-Za-z]:\\*) ;;
            *) exit 1 ;;
          esac
          receipt_parent="$(dirname -- "$EVIDENCE_RECEIPT_PATH")"
          test -d "$receipt_parent"
          canonical_receipt_parent="$(realpath -e -- "$receipt_parent")"
          canonical_workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$canonical_receipt_parent/" in "$canonical_workspace/"*) exit 1;; esac
          test ! -e "$EVIDENCE_RECEIPT_PATH"
          test ! -L "$EVIDENCE_RECEIPT_PATH"
          set -C
          case "$REQUESTED_MODE" in
            validate) run_g035 validate > "$EVIDENCE_RECEIPT_PATH" ;;
            capture) test -r "$G035_HOSTED_PG_SERVICE_FILE"; run_g035 capture --destination "$G035_ENCRYPTED_DESTINATION_PATH" --service-file "$G035_HOSTED_PG_SERVICE_FILE" --recipient "$G035_PUBLIC_RECIPIENT" --g034-artifact "$G035_G034_ARTIFACT" --encrypt-command "$G035_ENCRYPT_COMMAND" > "$EVIDENCE_RECEIPT_PATH" ;;
            short-url-remediation-inspect) test -r "$G035_LOCAL_PG_SERVICE_FILE"; test -r "$G035_RESTORE_RECEIPT_PATH"; run_g035 short-url-remediation-inspect --service g035-local --service-file "$G035_LOCAL_PG_SERVICE_FILE" --restore-receipt "$G035_RESTORE_RECEIPT_PATH" > "$EVIDENCE_RECEIPT_PATH" ;;
            short-url-remediation-apply) test -r "$G035_LOCAL_PG_SERVICE_FILE"; test -r "$G035_RESTORE_RECEIPT_PATH"; test -r "$G035_SHORT_URL_REMEDIATION_INSPECT_RECEIPT_PATH"; test -r "$G035_REMEDIATION_AUTHORIZATION_PATH"; test -r "$G035_REMEDIATION_AUTHORIZATION_SIGNATURE_PATH"; run_g035 short-url-remediation-apply --service g035-local --service-file "$G035_LOCAL_PG_SERVICE_FILE" --restore-receipt "$G035_RESTORE_RECEIPT_PATH" --inspect-receipt "$G035_SHORT_URL_REMEDIATION_INSPECT_RECEIPT_PATH" --authorization "$G035_REMEDIATION_AUTHORIZATION_PATH" --authorization-signature "$G035_REMEDIATION_AUTHORIZATION_SIGNATURE_PATH" > "$EVIDENCE_RECEIPT_PATH" ;;
            short-url-remediation-verify) test -r "$G035_LOCAL_PG_SERVICE_FILE"; test -r "$G035_SHORT_URL_REMEDIATION_APPLY_RECEIPT_PATH"; run_g035 short-url-remediation-verify --service g035-local --service-file "$G035_LOCAL_PG_SERVICE_FILE" --apply-receipt "$G035_SHORT_URL_REMEDIATION_APPLY_RECEIPT_PATH" > "$EVIDENCE_RECEIPT_PATH" ;;
            clone-apply) test -r "$G035_LOCAL_PG_SERVICE_FILE"; test -r "$G035_RESTORE_RECEIPT_PATH"; test -r "$G035_SHORT_URL_REMEDIATION_VERIFY_RECEIPT_PATH"; run_g035 clone-apply --service g035-local --service-file "$G035_LOCAL_PG_SERVICE_FILE" --restore-receipt "$G035_RESTORE_RECEIPT_PATH" --short-url-remediation-receipt "$G035_SHORT_URL_REMEDIATION_VERIFY_RECEIPT_PATH" > "$EVIDENCE_RECEIPT_PATH" ;;
            local-postflight) test -r "$G035_LOCAL_PG_SERVICE_FILE"; test -r "$G035_CLONE_RECEIPT_PATH"; run_g035 local-postflight --service g035-local --service-file "$G035_LOCAL_PG_SERVICE_FILE" --clone-receipt "$G035_CLONE_RECEIPT_PATH" --psql psql > "$EVIDENCE_RECEIPT_PATH" ;;
          esac
