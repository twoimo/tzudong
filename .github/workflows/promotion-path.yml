name: Promotion
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-path-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-path:
    name: Promotion Path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: node --test .github/scripts/verify-promotion-path.test.mjs
      - run: node .github/scripts/verify-promotion-path.mjs
