name: Promotion
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # One-time installation on the three pre-policy protected base revisions.
  # Subsequent bases run only the protected pull_request_target definition.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-path-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-path:
    if: >-
      github.event_name == 'pull_request_target' ||
      contains(fromJSON('["3f4ca55742aa33869b776291e0d035a16024eef1","cdb21ef3abc60f5346300e2353dafcf910c18170","3d7557f6307c9f6696018324e559bff6e57afbce"]'), github.event.pull_request.base.sha)
    name: Promotion Path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The fixed recovery anchor contains the already reviewed policy for
          # initial bases which predate this file. Never execute the PR tree.
          ref: >-
            ${{ contains(fromJSON('["3f4ca55742aa33869b776291e0d035a16024eef1","cdb21ef3abc60f5346300e2353dafcf910c18170","3d7557f6307c9f6696018324e559bff6e57afbce"]'), github.event.pull_request.base.sha) && '8a3a3a65ea41d4a5f20f1111aac9e0c3f8583b25' || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Verify the event using protected policy code
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { verifyPromotionPath } from './.github/scripts/verify-promotion-path.mjs';
          let result = { passed: false, code: 'PROMOTION_EVENT_INVALID' };
          if (['pull_request', 'pull_request_target'].includes(process.env.GITHUB_EVENT_NAME)) {
            try {
              result = verifyPromotionPath(JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')), process.env.GITHUB_REPOSITORY);
            } catch {}
          }
          process.stdout.write(`${JSON.stringify(result)}\n`);
          process.exitCode = result.passed ? 0 : 1;
          JS
