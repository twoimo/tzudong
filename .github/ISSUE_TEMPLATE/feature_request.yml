name: 기능 제안 / Feature request
description: 해결하고 싶은 문제와 원하는 동작을 알려 주세요. Suggest an improvement.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: 한국어 또는 English로 작성해 주세요. 기존 이슈에 같은 제안이 있는지도 확인해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제 / Problem
      description: 누가 어떤 상황에서 불편을 겪는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작 / Proposed behavior
      description: 변경 후 사용자가 할 수 있어야 하는 일을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 참고 자료 / Alternatives and context
      description: 고려한 대안이나 참고 화면이 있다면 첨부해 주세요.
