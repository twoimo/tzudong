# Deployment_Descriptor_Set values (design C10, Requirement 14.2/14.3).
#
# Every component carries all four required items and leaves none empty:
#   1. image  ................. image reference (pinned tag, no floating/latest)
#   2. resources.requests ..... resource request values
#   3. env  ................... environment variable names with a source reference
#   4. secretRefs ............. external secret reference names
#
# Secret values are NEVER written here. Credential, token, and connection-string
# secret components are indicated by external secret reference names only
# (the *_REF identifiers below), matching backend/deploy/migration-readiness.v1.json.
# Their Kubernetes Secret object names are lowercase with underscores replaced
# by hyphens (SUPABASE_URL_REF maps to supabase-url-ref), with key "value".
#
# clusterId is a render parameter (see templates/_helpers.tpl). Rendering the
# same source for two or more cluster identifiers differs only in derived fields
# (namespace, releaseName, clusterLabel, fullname).

# Cluster identifier render parameter. Overridden per render:
#   helm template tzudong-platform --set clusterId=local-a
#   helm template tzudong-platform --set clusterId=local-b
clusterId: local-a

components:
  webApp:
    componentId: Web_App
    image: registry.local/tzudong/web-app:1.4.0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      - name: NODE_ENV
        source: configmap:web-app-config/node_env
      - name: SUPABASE_URL
        source: secretRef:SUPABASE_URL_REF
      - name: SUPABASE_ANON_KEY
        source: secretRef:SUPABASE_ANON_KEY_REF
      - name: SUPABASE_SERVICE_ROLE_KEY
        source: secretRef:SUPABASE_SERVICE_ROLE_KEY_REF
    secretRefs:
      - SUPABASE_URL_REF
      - SUPABASE_ANON_KEY_REF
      - SUPABASE_SERVICE_ROLE_KEY_REF

  backendRuntime:
    componentId: Backend_Runtime
    image: registry.local/tzudong/pipeline-worker:1.4.0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    env:
      - name: TZUDONG_PROFILE
        source: configmap:backend-runtime-config/profile
      - name: PIPELINE_PG_DSN
        source: secretRef:PIPELINE_PG_DSN_REF
      - name: GEMINI_API_KEY
        source: secretRef:GEMINI_API_KEY_REF
      - name: YOUTUBE_API_KEY
        source: secretRef:YOUTUBE_API_KEY_REF
    secretRefs:
      - PIPELINE_PG_DSN_REF
      - GEMINI_API_KEY_REF
      - YOUTUBE_API_KEY_REF

  localStack:
    componentId: Local_Stack
    image: registry.local/tzudong/local-stack:1.4.0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    env:
      - name: POSTGRES_DB
        source: configmap:local-stack-config/postgres_db
      - name: MANAGED_PG_DSN
        source: secretRef:MANAGED_PG_DSN_REF
      - name: JWT_SECRET
        source: secretRef:JWT_SECRET_REF
    secretRefs:
      - MANAGED_PG_DSN_REF
      - JWT_SECRET_REF

  observabilityStack:
    componentId: Observability_Stack
    image: registry.local/tzudong/observability:1.4.0
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
    env:
      - name: GF_SERVER_ROOT_URL
        source: configmap:observability-config/grafana_root_url
      - name: GF_SECURITY_ADMIN_PASSWORD
        source: secretRef:GRAFANA_ADMIN_PASSWORD_REF
      - name: LOKI_STORAGE
        source: secretRef:LOKI_STORAGE_REF
    secretRefs:
      - GRAFANA_ADMIN_PASSWORD_REF
      - LOKI_STORAGE_REF

  logPipeline:
    componentId: Log_Pipeline
    image: registry.local/tzudong/otel-collector:1.4.0
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
    env:
      - name: OTEL_LOG_LEVEL
        source: configmap:log-pipeline-config/otel_log_level
      - name: LOG_SINK_URL
        source: secretRef:LOG_SINK_URL_REF
      - name: LOG_SINK_TOKEN
        source: secretRef:LOG_SINK_TOKEN_REF
    secretRefs:
      - LOG_SINK_URL_REF
      - LOG_SINK_TOKEN_REF
