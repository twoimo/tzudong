# Migration_Slice R3-upsert-payload (design C1/D1).
#
# Behavioral-parity Rust backing for the payload-construction and stable-hash
# portions of backend/pipeline_control/batch_upsert.py (and the reused
# state_machine.py:payload_hash canonicalization). The RPC call and psycopg2
# paths stay in Python (design C1). This crate is NOT the public entry point;
# the Implementation_Selector opts it in per slice (requirements 1.1, 1.3).
#
# PyO3 is an OPTIONAL dependency behind the `python` feature (task 42 pattern),
# so `cargo test`/`cargo check` compile only pure logic and maturin enables the
# binding layer.
#
# The SHA-256 and canonical-JSON layers are implemented in-crate rather than via
# a new dependency, so the Dependency_Freshness_Workflow Pin_Contract is not
# expanded implicitly (design C2).
[package]
name = "tzudong-upsert-payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "tzudong_upsert_payload"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, optional = true }

[features]
default = []
python = ["dep:pyo3"]
