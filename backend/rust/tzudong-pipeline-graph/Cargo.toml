# Migration_Slice R5-pipeline-graph (design C1/D1).
#
# Behavioral-parity Rust backing for the declarative graph validation and the
# state-transition pure logic in backend/pipeline_control/graph.py and
# backend/pipeline_control/state_machine.py (design C1). Filesystem checks
# (command path existence/escape), env reads (resolve_python, build_argv), and
# the psycopg2/lease clock stay in Python. This crate is NOT the public entry
# point; the Implementation_Selector opts it in per slice (requirements 1.1,
# 1.3).
#
# PyO3 is an OPTIONAL dependency behind the `python` feature (task 42 pattern).
[package]
name = "tzudong-pipeline-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "tzudong_pipeline_graph"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, optional = true }

[features]
default = []
python = ["dep:pyo3"]
