# maturin build configuration for Migration_Slice R5-pipeline-graph (design C1).
#
# maturin is pinned to the exact design C1 version. Building this project
# produces the `tzudong_pipeline_graph` PyO3 extension module, which graph.py /
# state_machine.py import through the Implementation_Selector. The public Python
# entry points (validate_graph filesystem checks, build_argv, lease clock) are
# unchanged (requirements 1.1, 1.3).
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "tzudong-pipeline-graph"
version = "0.1.0"
# PyO3 0.29 supports CPython up to 3.13; on a newer interpreter the build needs
# PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (or a 3.11-3.13 interpreter).
requires-python = ">=3.11"

[tool.maturin]
bindings = "pyo3"
module-name = "tzudong_pipeline_graph"
features = ["python"]
