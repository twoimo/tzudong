# maturin build configuration for Migration_Slice R4-media-compute (design C1).
#
# maturin is pinned to the exact design C1 version. Building this project
# produces the `tzudong_media_compute` PyO3 extension module, which
# chunk_planner.py imports through the Implementation_Selector. The public
# Python entry points (CLI, ffmpeg orchestration, file I/O) are unchanged
# (requirements 1.1, 1.3).
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "tzudong-media-compute"
version = "0.1.0"
# PyO3 0.29 supports CPython up to 3.13; on a newer interpreter the build needs
# PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (or a 3.11-3.13 interpreter).
requires-python = ">=3.11"

[tool.maturin]
bindings = "pyo3"
module-name = "tzudong_media_compute"
features = ["python"]
