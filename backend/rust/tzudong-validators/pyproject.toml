# maturin build configuration for Migration_Slice R1-validators (design C1).
#
# maturin is pinned to the exact design C1 version. Building this project
# produces the `tzudong_validators` PyO3 extension module, which the existing
# Python package imports through the Implementation_Selector
# (backend/pipeline_control/impl_selector.py). The public Python entry points in
# backend/pipeline/validators.py are unchanged (requirements 1.1, 1.3).
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "tzudong-validators"
version = "0.1.0"
# Node 24 web runtime aside, the extension targets the backend interpreter.
# PyO3 0.29 supports CPython up to 3.13; on a newer interpreter the build needs
# PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (or a 3.11-3.13 interpreter).
requires-python = ">=3.11"

[tool.maturin]
bindings = "pyo3"
# The #[pymodule] name and the imported top-level module name.
module-name = "tzudong_validators"
# Compile the PyO3 binding layer (src/python.rs). Plain `cargo test`/`cargo
# check` leave this feature off so the pure logic stays verifiable without the
# pyo3 build script running against the host interpreter.
features = ["python"]
