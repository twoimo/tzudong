# Migration_Slice R1-validators (design C1/D1).
#
# Behavioral-parity Rust backing implementation for the pure functions in
# backend/pipeline/validators.py and backend/pipeline/state.py. This crate is
# NOT the public entry point: the Python package keeps its function signatures
# and the Implementation_Selector opt-in chooses this Rust backing per slice
# (requirements 1.1, 1.3; design C1).
#
# PyO3 is an OPTIONAL dependency behind the `python` feature. Rationale:
#   * `cargo test` / `cargo check` with default features compiles only the pure
#     Rust logic, so the pyo3 build script (which caps out at CPython 3.13 in
#     PyO3 0.29) never runs. This keeps the pure logic verifiable on hosts that
#     run a newer interpreter (e.g. CPython 3.14) without a forward-compat flag.
#   * maturin builds the extension module with `--features python` (configured
#     in pyproject.toml [tool.maturin] features), which pulls in pyo3 with the
#     workspace `extension-module` feature.
[package]
name = "tzudong-validators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# snake_case module name so the built PyO3 extension imports cleanly as
# `tzudong_validators`.
name = "tzudong_validators"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Optional: only compiled when the `python` feature is enabled (maturin build).
# Inherits the workspace `extension-module` feature declared in the root
# Cargo.toml [workspace.dependencies].
pyo3 = { workspace = true, optional = true }

[features]
default = []
# Enables the PyO3 extension-module binding layer (src/python.rs). maturin
# turns this on; plain cargo test/check leave it off.
python = ["dep:pyo3"]

[dev-dependencies]
# Property tests for this slice (task 46.3, Property 6). proptest is pinned
# centrally in the workspace [workspace.dependencies] table. Task 42 ships the
# stdlib #[test] parity unit tests; tests/prop.rs adds the proptest suite.
proptest = { workspace = true }
