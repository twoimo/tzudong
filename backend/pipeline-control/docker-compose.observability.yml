# Slice 3 overlay. Kafka/ES are not required to see the four frozen pipeline counters.
# Job rows remain in schema pipeline_control / Supabase — never Elasticsearch SoT.
# Grafana is a loopback admin iframe after CSP/auth gate (127.0.0.1:3000 → 127.0.0.1:3001).
# Anonymous auth is off. Embedding is on. CSP is on. SameSite is lax. Admin password comes from GRAFANA_ADMIN_PASSWORD.
# Kafka lives only in docker-compose.kafka.yml.
# Elasticsearch lives only in docker-compose.elasticsearch.yml.
name: tzudong-pipeline-observability

services:
  otel-storage-init:
    # Only initialize ownership of this private volume. The collector stays
    # unprivileged; no host directory or network is available to this helper.
    image: busybox:1.37.0
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    command: ["chown", "10001:10001", "/var/lib/otelcol"]
    volumes:
      - otel-storage:/var/lib/otelcol

  otel-collector:
    # filelog is a contrib receiver; the core distribution does not contain it.
    image: otel/opentelemetry-collector-contrib:0.120.0
    user: "10001:10001"
    depends_on:
      otel-storage-init:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ../log:/var/log/tzudong:ro
      - otel-storage:/var/lib/otelcol
    ports:
      - "127.0.0.1:4318:4318"
    networks:
      - supabase_network_local

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - supabase_network_local

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - supabase_network_local

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://127.0.0.1:3000;manifest-src 'self';media-src 'none';form-action 'self';frame-ancestors http://127.0.0.1:3000"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    networks:
      - supabase_network_local

volumes:
  otel-storage:

networks:
  supabase_network_local:
    external: true
    name: ${TZUDONG_LOCAL_SUPABASE_NETWORK:-tzudong-local-7a6f86ca1e63_default}
