# Default local control plane: API only. Run the batch worker explicitly with
# `docker compose -f .../docker-compose.pipeline.yml run --rm pipeline-worker`.
# Events, search and telemetry need their matching overrides; see LOCAL_MODES.md.
# Joins the existing local Supabase network.
# MUST NOT declare a postgres service. job/lock/audit live in schema pipeline_control.
name: tzudong-pipeline-control

services:
  pipeline-api:
    build:
      context: ../..
      dockerfile: backend/pipeline-control/Dockerfile
      target: api
    environment:
      TZUDONG_DATA_ENV: local_db
      PIPELINE_CONTROL_DSN: postgresql://postgres@db:5432/postgres
      TZUDONG_COMPUTE_PROFILE: heavy_local
      OTEL_SERVICE_NAME: pipeline-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ../..:/workspace
    command: ["python", "-m", "backend.pipeline_control.api"]
    networks:
      - supabase_network_local

  pipeline-worker:
    profiles: [batch]
    # Reap adopted stage descendants while Python supervises owned leaders.
    init: true
    build:
      context: ../..
      dockerfile: backend/pipeline-control/Dockerfile
      target: worker
    environment:
      TZUDONG_DATA_ENV: local_db
      PIPELINE_CONTROL_DSN: postgresql://postgres@db:5432/postgres
      TZUDONG_COMPUTE_PROFILE: heavy_local
      OTEL_SERVICE_NAME: pipeline-worker
    volumes:
      # heavy_local: repo tree, numbered scripts, node/ffmpeg available on the host mount
      - ../..:/workspace
    command: ["python", "-m", "backend.pipeline_control.worker"]
    networks:
      - supabase_network_local

  pipeline-indexer:
    profiles: [search]
    build:
      context: ../..
      dockerfile: backend/pipeline-control/Dockerfile
      target: indexer
    environment:
      TZUDONG_DATA_ENV: local_db
      TZUDONG_PIPELINE_ES: es
      TZUDONG_KAFKA_BOOTSTRAP: kafka:9092
      TZUDONG_ES_URL: http://elasticsearch:9200
      PIPELINE_CONTROL_DSN: postgresql://postgres@db:5432/postgres
      OTEL_SERVICE_NAME: pipeline-indexer
    command: ["python", "-m", "backend.pipeline_control.es_index"]
    depends_on: [kafka, elasticsearch]
    networks:
      - supabase_network_local

  pipeline-publisher:
    profiles: [events]
    build:
      context: ../..
      dockerfile: backend/pipeline-control/Dockerfile
      target: worker
    environment:
      TZUDONG_DATA_ENV: local_db
      TZUDONG_PIPELINE_EVENTS: kafka
      TZUDONG_PIPELINE_OUTBOX: postgres
      TZUDONG_KAFKA_BOOTSTRAP: kafka:9092
      PIPELINE_CONTROL_DSN: postgresql://postgres@db:5432/postgres
      OTEL_SERVICE_NAME: pipeline-publisher
    command: ["python", "-m", "backend.pipeline_control.publisher"]
    depends_on: [kafka]
    networks:
      - supabase_network_local

networks:
  supabase_network_local:
    external: true
    name: ${TZUDONG_LOCAL_SUPABASE_NETWORK:-tzudong-local-7a6f86ca1e63_default}
