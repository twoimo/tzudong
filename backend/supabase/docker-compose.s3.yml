# Optional local S3 backend. The default stack continues to use filesystem storage.
# Requires URI-safe local credentials; no existing filesystem data is migrated.
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:0d54f6c86e53138c6cfc242e21309a18941624d9034d9cdf598dbba61f69d872
    read_only: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a dedicated local S3 access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a dedicated local S3 secret}
    command: ["server", "--console-address", ":9001", "/data"]
    healthcheck:
      test: ["CMD", "mc", "--config-dir", "/tmp/minio-health", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 5
    tmpfs:
      - /tmp:rw,uid=65532,gid=65532,mode=0700
    volumes:
      - minio-data:/data

  minio-createbucket:
    image: cgr.dev/chainguard/minio-client@sha256:fce18c0d1a830273b51e422e6d8962f56c4e253d4858826ee5b5533deb7cbd6a
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_storage: http://${MINIO_ROOT_USER:?Set a dedicated local S3 access key}:${MINIO_ROOT_PASSWORD:?Set a dedicated local S3 secret}@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "storage/${GLOBAL_S3_BUCKET:-stub}"]
    restart: "no"

  storage:
    # Inherit the reviewed Storage image and other settings from the base stack.
    # An omitted or plain empty list would retain the base filesystem bind.
    volumes: !reset []
    depends_on:
      minio-createbucket:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set a dedicated local S3 access key}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set a dedicated local S3 secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      REGION: ${S3_REGION:-us-east-1}

  imgproxy:
    volumes: !reset []

volumes:
  minio-data:
