<!doctype html><meta charset="utf-8"><title>Local diagnostic filmstrip</title><style>body{background:#181818;color:#eee;font:16px system-ui;margin:24px}img{max-width:95vw;max-height:75vh;display:block}input{width:80vw}p{max-width:950px}</style><h1>CDP diagnostic frames</h1><p>Adaptive screenshot capture with trace overhead and simulated map SDK. Intervals between frames are unobserved. No continuous-video or physical-display proof.</p><input id="range" type="range" min="0" max="4" value="0"><p id="label"></p><img id="frame"><script>const frames=[{"index": 0, "relativeMs": 1.073, "path": "frames/000.jpg"}, {"index": 1, "relativeMs": 55.113, "path": "frames/001.jpg"}, {"index": 2, "relativeMs": 99.607, "path": "frames/002.jpg"}, {"index": 3, "relativeMs": 402.708, "path": "frames/003.jpg"}, {"index": 4, "relativeMs": 429.327, "path": "frames/004.jpg"}];const range=document.getElementById("range");function show(){const r=frames[Number(range.value)];if(!r)return;document.getElementById("frame").src=r.path;document.getElementById("label").textContent=`Frame ${r.index} / ${frames.length-1}, ${r.relativeMs.toFixed(1)} ms from diagnostic mark`;}range.oninput=show;document.onkeydown=e=>{if(e.key==="ArrowRight")range.value=Number(range.value)+1;if(e.key==="ArrowLeft")range.value=Number(range.value)-1;show();};show();</script>
