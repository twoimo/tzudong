name: Migrations
run-name: Migrations · ${{ inputs.migration_id }}

on:
  workflow_dispatch:
    inputs:
      migration_id:
        description: 'Committed release manifest migration identity'
        required: true
        type: string
      dry_run:
        description: 'Validate the committed manifest and migration bytes without credentials'
        required: false
        default: true
        type: boolean
      verify_terminal_state:
        description: 'Verify the exact terminal database state without replaying migration SQL'
        required: false
        default: false
        type: boolean
      provider_receipt:
        description: 'Canonical provider receipt JSON bound to the provider-owned G016 migration'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  READINESS_RELEASE_MANIFEST_SHA256: "03c7804306c6faac12ec92a52c20c8f9a6cfd4adf324af0f3dd9284c39675490"
  RELEASE_MIGRATION_MANIFEST_SHA256: "515743d094b4b431a29df772a363837bdad8f7541aa3acf4a923efb79f460c0d"
concurrency:
  group: supabase-migration-apply
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.inputs.migration_id != 'review_media_readiness11_v1' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migration_id: ${{ steps.manifest.outputs.migration_id }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      expected_manifest_sha256: ${{ steps.manifest.outputs.expected_manifest_sha256 }}
      validated_sha: ${{ steps.checkout.outputs.sha }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify canonical detached checkout
        id: checkout
        env:
          CANONICAL_REPOSITORY: twoimo/tzudong
          PROTECTED_DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$PROTECTED_DEFAULT_BRANCH"
          test "$GITHUB_REF_NAME" = "$PROTECTED_DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse --verify HEAD)"
          test "$GITHUB_SHA" = "$(git show -s --format=%H HEAD)"
          test -z "$(git symbolic-ref --quiet HEAD || true)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate reviewed manifest without production credentials
        id: manifest
        env:
          MIGRATION_ID: ${{ github.event.inputs.migration_id }}
        run: |
          set -euo pipefail
          actual_manifest_sha256="$(sha256sum .github/supabase-migration-release-manifest.v1.json)"
          actual_manifest_sha256="${actual_manifest_sha256%% *}"
          test "$actual_manifest_sha256" = "$RELEASE_MIGRATION_MANIFEST_SHA256"
          node apps/web/scripts/apply-supabase-migration.mjs \
            --migration-id "$MIGRATION_ID" \
            --dry-run \
            --json
          printf 'migration_id=%s\n' "$MIGRATION_ID" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$actual_manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'expected_manifest_sha256=%s\n' "$RELEASE_MIGRATION_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

  readiness_validate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.migration_id == 'review_media_readiness11_v1' &&
      github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
    steps:
      - name: Checkout exact readiness commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Validate readiness bytes without credentials
        id: validate
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse --verify HEAD)"
          test -z "$(git symbolic-ref --quiet HEAD || true)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(sha256sum .github/supabase-readiness-release-manifest.v1.json)"
          test "${actual%% *}" = "$READINESS_RELEASE_MANIFEST_SHA256"
          generic="$(sha256sum .github/supabase-migration-release-manifest.v1.json)"
          test "${generic%% *}" = "$RELEASE_MIGRATION_MANIFEST_SHA256"
          node apps/web/scripts/apply-readiness-release.mjs --dry-run --json
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "${actual%% *}" >> "$GITHUB_OUTPUT"

  readiness_apply:
    needs: readiness_validate
    if: >-
      needs.readiness_validate.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.migration_id == 'review_media_readiness11_v1' &&
      github.event.inputs.dry_run == 'false' &&
      github.event.inputs.provider_receipt == '' &&
      needs.readiness_validate.outputs.sha == github.sha &&
      github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      vars.G037_WRITE_FREEZE == 'active'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated readiness commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.readiness_validate.outputs.sha }}
          persist-credentials: false
      - name: Recheck readiness pin and exact detached commit
        env:
          VALIDATED_SHA: ${{ needs.readiness_validate.outputs.sha }}
          VALIDATED_MANIFEST_SHA: ${{ needs.readiness_validate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$VALIDATED_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse --verify HEAD)"
          test -z "$(git symbolic-ref --quiet HEAD || true)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(sha256sum .github/supabase-readiness-release-manifest.v1.json)"
          test "${actual%% *}" = "$READINESS_RELEASE_MANIFEST_SHA256"
          test "${actual%% *}" = "$VALIDATED_MANIFEST_SHA"
          generic="$(sha256sum .github/supabase-migration-release-manifest.v1.json)"
          test "${generic%% *}" = "$RELEASE_MIGRATION_MANIFEST_SHA256"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply only the pinned eleven units or verify final state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          G037_WRITE_FREEZE: ${{ vars.G037_WRITE_FREEZE }}
          READINESS_VALIDATED_SHA: ${{ needs.readiness_validate.outputs.sha }}
          VERIFY_TERMINAL_STATE: ${{ github.event.inputs.verify_terminal_state }}
        run: |
          set -euo pipefail
          args=(--json)
          if [ "$VERIFY_TERMINAL_STATE" = "true" ]; then
            args+=(--verify-terminal-state)
          fi
          node apps/web/scripts/apply-readiness-release.mjs "${args[@]}"

  apply:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.event.inputs.dry_run != 'true' &&
      needs.validate.outputs.validated_sha == github.sha &&
      needs.validate.outputs.manifest_sha256 == needs.validate.outputs.expected_manifest_sha256 &&
      github.repository == 'twoimo/tzudong' &&
      github.event.repository.full_name == 'twoimo/tzudong' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      (vars.G037_WRITE_FREEZE != 'active' ||
       contains(fromJSON('["g016_privacy_audit_owner_policy","g016_onboarding_confirmation_freshness"]'), needs.validate.outputs.migration_id)) &&
      (!contains(fromJSON('["g016_privacy_audit_owner_policy","g016_onboarding_confirmation_freshness"]'), needs.validate.outputs.migration_id) ||
       github.event.inputs.verify_terminal_state == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
          persist-credentials: false

      - name: Recheck canonical detached checkout and bound release manifest
        env:
          CANONICAL_REPOSITORY: twoimo/tzudong
          PROTECTED_DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$PROTECTED_DEFAULT_BRANCH"
          test "$GITHUB_REF_NAME" = "$PROTECTED_DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "${{ needs.validate.outputs.validated_sha }}"
          test "$GITHUB_SHA" = "$(git rev-parse --verify HEAD)"
          test "$GITHUB_SHA" = "$(git show -s --format=%H HEAD)"
          test -z "$(git symbolic-ref --quiet HEAD || true)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_manifest_sha256="$(sha256sum .github/supabase-migration-release-manifest.v1.json)"
          actual_manifest_sha256="${actual_manifest_sha256%% *}"
          test "$actual_manifest_sha256" = "$RELEASE_MIGRATION_MANIFEST_SHA256"
          test "$actual_manifest_sha256" = "${{ needs.validate.outputs.manifest_sha256 }}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install PostgreSQL client for migration apply or terminal verification
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply reviewed migration or verify provider-applied terminal state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_ID: ${{ needs.validate.outputs.migration_id }}
          VERIFY_TERMINAL_STATE: ${{ github.event.inputs.verify_terminal_state }}
          PROVIDER_MIGRATION_RECEIPT_SHA256: ${{ secrets.PROVIDER_MIGRATION_RECEIPT_SHA256 }}
          PROVIDER_RECEIPT: ${{ github.event.inputs.provider_receipt }}
        run: |
          set -euo pipefail
          args=(--migration-id "$MIGRATION_ID" --json)
          if [ "$VERIFY_TERMINAL_STATE" = "true" ]; then
            args+=(--verify-terminal-state)
            args+=(--provider-receipt "$PROVIDER_RECEIPT")
          fi
          node apps/web/scripts/apply-supabase-migration.mjs "${args[@]}"