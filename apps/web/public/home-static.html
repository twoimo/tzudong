  <style>
    :root{color-scheme:light;--primary:#ef4444;--secondary:#f97316;--muted:#64748b;--bg:#fff;--fg:#111827}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
    .shell{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;width:100vw;overflow:hidden;background:var(--bg);text-align:left}
    .map-surface{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(239,68,68,.08),transparent 34%),linear-gradient(0deg,rgba(248,250,252,.95),rgba(255,255,255,.95))}.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.16) 1px,transparent 1px);background-size:44px 44px}.search-shell{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;height:48px;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.95);padding:0 8px;box-shadow:0 10px 25px rgba(15,23,42,.06);backdrop-filter:blur(8px)}.search-pill{display:flex;min-height:44px;flex:1;align-items:center;border:0;border-radius:999px;background:rgba(241,245,249,.72);padding:0 12px;color:var(--muted);font:inherit;font-size:15px;text-align:left}.control-dot{min-height:44px;min-width:44px;border:0;border-radius:999px;background:rgba(241,245,249,.72)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.preview[hidden],.shell[hidden]{display:none}.preview{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:70}.sheet{height:50vh;border:1px solid #e5e7eb;border-radius:16px 16px 0 0;background:#fff;padding:20px 16px;box-shadow:0 -18px 45px rgba(15,23,42,.16)}.handle{margin:0 auto 12px;height:4px;width:32px;border-radius:999px;background:rgba(100,116,139,.45)}.small{margin:0;color:#64748b;font-size:12px;font-weight:600}.sheet h2{margin:8px 0 0;font-size:20px}.desc{margin:12px 0 0;color:#64748b;font-size:14px;line-height:1.5}.skeleton{margin-top:20px}.line{height:12px;border-radius:6px;background:#eef2f7;margin-top:8px}.line.a{width:75%}.line.b{width:50%}
    iframe#home-runtime-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:80;background:white}
    @media (min-width:1280px){.search-shell{left:32px;right:auto;width:360px}.control-dot{display:none}.preview{left:auto;right:0;top:56px;height:calc(100vh - 56px);width:400px}.sheet{height:100%;border-radius:0;border-left:1px solid #e5e7eb}}

<body>
  <main id="home-initial-shell" class="shell" aria-label="쯔동여지도 홈 미리보기">
    <div class="map-surface" aria-hidden="true"></div><div class="map-grid" aria-hidden="true"></div><div class="search-shell"><button type="button" class="search-pill" data-home-intent="search" aria-label="쯔동여지도 검색 열기">쯔동여지도 검색하기</button><button type="button" class="control-dot" data-home-intent="bookmark" aria-label="북마크 열기"></button><button type="button" class="control-dot" data-home-intent="notification" aria-label="알림 열기"></button><button type="button" class="control-dot" data-home-intent="user" aria-label="사용자 메뉴 열기"></button></div><p class="sr" role="status" aria-live="polite">쯔동여지도 홈 준비 중</p>
  </main>
  <aside id="home-deep-link-preview" class="preview" hidden><div class="sheet"><div class="handle"></div><p class="small">맛집 상세</p><h2>맛집 상세로 이동합니다</h2><p class="desc">선택한 맛집의 상세 화면을 곧바로 이어서 보여드립니다</p><div class="skeleton"><div class="line a"></div><div class="line b"></div></div></div></aside>
  <script>
  (function(){try{var autoActivationDelayMs=8000;var params=new URLSearchParams(location.search);var preview=document.getElementById('home-deep-link-preview');if((params.get('r')||params.get('restaurant'))&&preview)preview.hidden=false;var activated=false;var events=['pointerdown','keydown','wheel','touchstart'];function captureIntent(event){var target=event&&event.target&&event.target.closest?event.target.closest('[data-home-intent]'):null;if(!target)return;try{sessionStorage.setItem('tzudong:home-initial-intent',target.getAttribute('data-home-intent')||'search');}catch(_){}}function handleActivationEvent(event){captureIntent(event);activate();}function activate(){if(activated)return;activated=true;var shell=document.getElementById('home-initial-shell');var frame=document.createElement('iframe');frame.id='home-runtime-frame';frame.title='쯔동여지도 홈';frame.src='/home-frame'+location.search+location.hash;frame.style.visibility='hidden';frame.addEventListener('load',function(){if(shell)shell.hidden=true;if(preview)preview.hidden=true;frame.style.visibility='visible';},{once:true});document.body.appendChild(frame);events.forEach(function(e){removeEventListener(e,handleActivationEvent);});}setTimeout(activate,autoActivationDelayMs);events.forEach(function(e){addEventListener(e,handleActivationEvent,{once:true,passive:true});});}catch(_){}})();
  </script>
