  <style>
    :root{color-scheme:light;--border:#e5e7eb;--muted:#64748b;--primary:#ef4444;--bg:#fff;--fg:#111827}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:var(--fg);overflow:hidden}
    .shell{position:relative;height:100dvh;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(248,113,113,.14),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.95),rgba(248,250,252,.9))}
    .top{pointer-events:none;position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(env(safe-area-inset-top) + 10px) 12px 0}
    .bar{pointer-events:auto;display:flex;height:48px;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.95);padding:0 8px;box-shadow:0 10px 20px rgba(15,23,42,.08);backdrop-filter:blur(8px)}
    .search{display:flex;height:40px;flex:1;align-items:center;border-radius:999px;padding:0 10px;text-align:left;font-size:15px;color:var(--muted)}
    .dot{height:36px;width:36px;border-radius:999px;border:1px solid var(--border);background:#fff}
    .center{position:relative;display:flex;height:100%;align-items:center;justify-content:center;padding:0 24px;text-align:center}
    .card{border:1px solid var(--border);border-radius:24px;background:rgba(255,255,255,.92);padding:28px 32px;box-shadow:0 18px 45px rgba(15,23,42,.13);backdrop-filter:blur(8px)}
    .loader{position:relative;width:64px;height:64px;margin:0 auto 24px}.spin{position:absolute;inset:0;border-radius:999px;border:4px solid rgba(239,68,68,.2);border-top-color:var(--primary);animation:spin 1s linear infinite}.spin.secondary{border-color:transparent;border-right-color:#f97316;animation-duration:1.5s}.title{margin:0;background:linear-gradient(90deg,var(--primary),#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px;font-weight:800;line-height:1.2}.desc{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.dots{display:flex;justify-content:center;gap:4px;margin-top:14px}.dots span{width:8px;height:8px;border-radius:999px;background:var(--primary);animation:bounce 1s infinite}.dots span:nth-child(2){animation-delay:.1s}.dots span:nth-child(3){animation-delay:.2s}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .preview[hidden],.shell[hidden]{display:none}.preview{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:70}.sheet{height:50vh;border:1px solid var(--border);border-radius:16px 16px 0 0;background:#fff;padding:20px 16px;box-shadow:0 -18px 45px rgba(15,23,42,.16)}.handle{margin:0 auto 12px;height:4px;width:32px;border-radius:999px;background:rgba(100,116,139,.45)}.small{margin:0;color:var(--muted);font-size:12px;font-weight:600}.sheet h2{margin:8px 0 0;font-size:20px}.skeleton{margin-top:20px}.line{height:12px;border-radius:6px;background:#eef2f7;margin-top:8px}.line.a{width:75%}.line.b{width:50%}
    iframe#home-runtime-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:80;background:white}
    @media (min-width:1280px){.top{display:none}.preview{left:auto;right:0;top:56px;height:calc(100vh - 56px);width:400px}.sheet{height:100%;border-radius:0;border-left:1px solid var(--border)}}
  </style>
</head>
<body>
  <main id="home-initial-shell" class="shell" role="status" aria-label="쯔동여지도 로딩 중" aria-live="polite">
    <div class="top"><div class="bar"><div class="search">쯔동여지도 검색하기</div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
    <section class="center"><div class="card"><div class="loader" aria-hidden="true"><div class="spin"></div><div class="spin secondary"></div></div><h1 class="title">홈 지도를 불러오는 중...</h1><p class="desc">맛집 지도 런타임을 준비하고 있습니다</p><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div><span class="sr">쯔동여지도 로딩 중...</span></div></section>
  </main>
  <aside id="home-deep-link-preview" class="preview" hidden><div class="sheet"><div class="handle"></div><p class="small">맛집 상세</p><h2>맛집 정보를 준비 중입니다</h2><p class="desc">잠시 후 상세 정보와 지도가 표시됩니다</p><div class="skeleton"><div class="line a"></div><div class="line b"></div></div></div></aside>
  <script>
  (function(){try{var params=new URLSearchParams(location.search);var preview=document.getElementById('home-deep-link-preview');if((params.get('r')||params.get('restaurant'))&&preview)preview.hidden=false;var activated=false;var events=['pointerdown','keydown','wheel','touchstart'];function activate(){if(activated)return;activated=true;var shell=document.getElementById('home-initial-shell');if(shell)shell.hidden=true;if(preview)preview.hidden=true;var frame=document.createElement('iframe');frame.id='home-runtime-frame';frame.title='쯔동여지도 홈';frame.src='/home-frame'+location.search+location.hash;document.body.appendChild(frame);events.forEach(function(e){removeEventListener(e,activate);});}setTimeout(activate,8000);events.forEach(function(e){addEventListener(e,activate,{once:true,passive:true});});}catch(_){}})();
  </script>
</body>
</html>
