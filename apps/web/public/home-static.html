  <style>
    :root{color-scheme:light;--primary:#ef4444;--secondary:#f97316;--muted:#64748b;--bg:#fff;--fg:#111827}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
    .shell{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;width:100vw;overflow:hidden;background:var(--bg);text-align:left}
    .map-surface{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(239,68,68,.08),transparent 34%),linear-gradient(0deg,rgba(248,250,252,.95),rgba(255,255,255,.95))}.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.16) 1px,transparent 1px);background-size:44px 44px}.search-shell{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;height:48px;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.95);padding:0 8px;box-shadow:0 10px 25px rgba(15,23,42,.06);backdrop-filter:blur(8px)}.search-pill{display:flex;height:40px;flex:1;align-items:center;border-radius:999px;background:rgba(241,245,249,.72);padding:0 12px;color:var(--muted);font-size:15px}.control-dot{height:40px;width:40px;border-radius:999px;background:rgba(241,245,249,.72)}.status-card{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(calc(100vw - 32px),360px);transform:translateX(-50%);border-radius:16px;background:rgba(255,255,255,.9);padding:16px;box-shadow:0 18px 45px rgba(15,23,42,.10);backdrop-filter:blur(8px)}.eyebrow{margin:0;color:var(--primary);font-size:12px;font-weight:700}.title{margin:4px 0 0;color:var(--fg);font-size:18px;font-weight:800;line-height:1.25}.desc{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.steps{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:12px}.steps li{display:flex;align-items:center;gap:8px}.step-dot{height:8px;width:8px;border-radius:999px;background:#cbd5e1}.step-dot.active{background:var(--primary);animation:pulse 1.5s ease-in-out infinite}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .preview[hidden],.shell[hidden]{display:none}.preview{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:70}.sheet{height:50vh;border:1px solid #e5e7eb;border-radius:16px 16px 0 0;background:#fff;padding:20px 16px;box-shadow:0 -18px 45px rgba(15,23,42,.16)}.handle{margin:0 auto 12px;height:4px;width:32px;border-radius:999px;background:rgba(100,116,139,.45)}.small{margin:0;color:#64748b;font-size:12px;font-weight:600}.sheet h2{margin:8px 0 0;font-size:20px}.desc{margin:12px 0 0;color:#64748b;font-size:14px;line-height:1.5}.skeleton{margin-top:20px}.line{height:12px;border-radius:6px;background:#eef2f7;margin-top:8px}.line.a{width:75%}.line.b{width:50%}
    iframe#home-runtime-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:80;background:white}

    @media (min-width:1280px){.search-shell{left:32px;right:auto;width:360px}.status-card{left:32px;bottom:32px;transform:none}.preview{left:auto;right:0;top:56px;height:calc(100vh - 56px);width:400px}.sheet{height:100%;border-radius:0;border-left:1px solid #e5e7eb}}

  <main id="home-initial-shell" class="shell" role="status" aria-label="쯔동여지도 로딩 중" aria-live="polite">

  <script>
  (function(){try{var params=new URLSearchParams(location.search);var preview=document.getElementById('home-deep-link-preview');if((params.get('r')||params.get('restaurant'))&&preview)preview.hidden=false;var activated=false;var events=['pointerdown','keydown','wheel','touchstart'];function activate(){if(activated)return;activated=true;var shell=document.getElementById('home-initial-shell');var frame=document.createElement('iframe');frame.id='home-runtime-frame';frame.title='쯔동여지도 홈';frame.src='/home-frame'+location.search+location.hash;frame.style.visibility='hidden';frame.addEventListener('load',function(){if(shell)shell.hidden=true;if(preview)preview.hidden=true;frame.style.visibility='visible';},{once:true});document.body.appendChild(frame);events.forEach(function(e){removeEventListener(e,activate);});}setTimeout(activate,8000);events.forEach(function(e){addEventListener(e,activate,{once:true,passive:true});});}catch(_){}})();
  </script>
